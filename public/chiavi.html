<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chiavi</title>

  <!-- ═══ PWA META ═══════════════════════════════════════════ -->
  <!-- Pagina indipendente: nessun manifest condiviso con l'app Listini -->

  <!-- Android: associa icona e nome per "Aggiungi a schermata Home" -->
<link rel="icon" sizes="192x192" href="icons/icon-192x192.png">
<link rel="icon" sizes="512x512" href="icons/icon-512x512.png">

  <!-- Theme color (barra del browser / status bar) -->
  <meta name="theme-color" content="#dc2626">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS / iPadOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="#dc2626">
  <meta name="apple-mobile-web-app-title" content="Chiavi">

  <!-- iOS icons (Apple ignora il manifest per le icone) -->
  <link rel="apple-touch-icon" href="icons/icon-180x180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167x167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">

  <!-- Favicon desktop -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16x16.png">
  <link rel="shortcut icon" href="icons/favicon.ico">

  <!-- Windows tile -->
  <meta name="msapplication-TileColor" content="#dc2626">
  <meta name="msapplication-TileImage" content="icons/icon-144x144.png">

  <!-- SEO / sharing -->
  <meta name="description" content="Ricerca rapida listini chiavi con foto e lettore barcode integrato">
  <!-- ═══════════════════════════════════════════════════════ -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Barcode Detection API polyfill (ZXing-WASM) — covers iOS Safari, Firefox, etc. -->
  <script src="https://fastly.jsdelivr.net/npm/barcode-detector@3/dist/iife/polyfill.min.js"></script>
  <!-- jsPDF per generazione picking list -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --accent: #dc2626;
      --accent-light: #fef2f2;
      --accent-dark: #b91c1c;
      --surface: #ffffff;
      --bg: #f4f6fb;
      --border: #e8ecf4;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
      --shadow-md: 0 4px 16px rgba(15,23,42,0.08), 0 2px 6px rgba(15,23,42,0.04);
      --shadow-lg: 0 12px 32px rgba(15,23,42,0.1), 0 4px 12px rgba(15,23,42,0.05);
      --radius: 14px;
      --radius-sm: 8px;
      --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { touch-action: manipulation; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .header-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .logo svg { flex-shrink: 0; }

    .search-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color var(--transition);
    }

    .search-wrap:focus-within .search-icon { color: var(--accent); }

    #search-input {
      width: 100%;
      padding: 11px 14px 11px 42px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }

    #search-input::placeholder { color: var(--text-muted); }

    #search-input:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(220,38,38,0.1);
    }

    .btn-search {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      background: var(--accent);
      color: white;
      padding: 11px 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 2px 8px rgba(220,38,38,0.25);
      flex-shrink: 0;
    }

    .btn-search:hover {
      background: var(--accent-dark);
      box-shadow: 0 4px 14px rgba(220,38,38,0.35);
      transform: translateY(-1px);
    }

    .btn-search:active { transform: scale(0.97) translateY(0); }

    /* ─── CONTENT ─── */
    .content {
      max-width: 820px;
      margin: 28px auto;
      padding: 0 16px 60px;
    }

    /* ─── EMPTY STATE ─── */
    .stato-msg {
      text-align: center;
      padding: 72px 24px;
      color: var(--text-secondary);
      animation: fadeUp 0.35s ease both;
    }

    .stato-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      background: var(--accent-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .stato-msg p {
      font-size: 0.95rem;
      line-height: 1.7;
      max-width: 300px;
      margin: 0 auto;
    }

    .stato-msg strong { color: var(--text-primary); font-weight: 600; }

    .stato-msg.loading .stato-icon { animation: spin 1.2s linear infinite; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ─── RESULTS ─── */
    .results-count {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .results-list { display: flex; flex-direction: column; gap: 6px; }

    .result-item {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 13px 18px;
      cursor: pointer;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-sm), 0 2px 8px rgba(15,23,42,0.07);
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
      animation: fadeUp 0.3s ease both;
    }

    .result-item:nth-child(1) { animation-delay: 0.03s; }
    .result-item:nth-child(2) { animation-delay: 0.06s; }
    .result-item:nth-child(3) { animation-delay: 0.09s; }
    .result-item:nth-child(4) { animation-delay: 0.12s; }
    .result-item:nth-child(5) { animation-delay: 0.15s; }
    .result-item:nth-child(n+6) { animation-delay: 0.18s; }

    .result-item:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md), 0 0 0 3px rgba(220,38,38,0.06);
      transform: translateY(-1px);
    }

    .result-photos {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .result-thumb {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      border: 1.5px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition);
      display: block;
    }

    .result-thumb:hover {
      opacity: 0.82;
      transform: scale(1.04);
    }

    .result-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .result-fornitore {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .result-desc {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.4;
      white-space: normal;
      word-break: break-word;
    }

    .result-meta {
      font-size: 0.74rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .result-art-tag {
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.02em;
    }

    .result-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      align-self: flex-end;
    }

    .result-price .currency {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      vertical-align: super;
      margin-right: 1px;
    }

    /* ─── DETAIL ─── */
    .btn-back {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 8px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }

    .btn-back:hover {
      background: var(--bg);
      color: var(--text-primary);
      border-color: var(--accent);
    }

    .detail-card {
      background: var(--surface);
      border-radius: 18px;
      padding: 26px;
      box-shadow: var(--shadow-md);
      animation: fadeUp 0.3s ease both;
    }

    .article-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
      margin-bottom: 22px;
    }

    .article-code {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .article-desc {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 14px;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .article-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meta-tag {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .meta-tag svg { color: var(--text-muted); flex-shrink: 0; }

    .meta-tag-fornitore {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent-dark);
      font-weight: 700;
    }

    .meta-tag-fornitore svg { color: var(--accent); }

    /* ─── LIGHTBOX FOTO ─── */
    #photo-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(15,23,42,0.85);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    #photo-lightbox.open { display: flex; }

    #lightbox-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      animation: fadeUp 0.2s ease both;
    }

    .lightbox-close {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.14);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition);
    }

    .lightbox-close:hover { background: rgba(255,255,255,0.24); }

    .article-update {
      font-size: 0.73rem;
      color: var(--text-muted);
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .article-photos {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .article-photo-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .article-photo-box img {
      width: 128px;
      height: 128px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      transition: transform var(--transition), border-color var(--transition);
    }

    .article-photo-box img:hover {
      opacity: 0.82;
      transform: scale(1.03);
    }

    .article-photo-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ─── PRICE GRID ─── */
    .prezzi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .prezzi-grid { grid-template-columns: 1fr; }
      .logo span { display: none; }
    }

    /* ─── MOBILE PORTRAIT: search row ─── */
    @media (max-width: 600px) and (orientation: portrait) {
      .header { padding: 10px 14px 0; }

      .header-inner {
        flex-wrap: wrap;
        gap: 8px;
      }

      /* Logo prima riga */
      .logo { flex: 1 0 auto; }

      /* Search-wrap: flex-wrap per mettere barcode in seconda riga */
      .search-wrap {
        flex: 1 0 100%;
        flex-wrap: wrap;
        gap: 8px;
        padding-bottom: 10px;
      }

      /* Nasconde la lente (position:absolute incompatibile col flex-wrap) */
      .search-icon { display: none; }

      /* Input + btn-search sulla stessa riga, padding normale */
      #search-input {
        flex: 1 1 0;
        min-width: 0;
        font-size: 1rem;
        padding: 13px 14px;
      }

      .btn-search {
        padding: 13px 20px;
        font-size: 0.95rem;
        flex-shrink: 0;
      }

      /* Bottone barcode: riga intera, bello grande */
      #btn-scan {
        order: 10;
        flex: 1 0 100%;
        padding: 13px 16px;
        gap: 10px;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--accent);
        border-color: var(--accent);
        background: var(--accent-light);
        border-radius: var(--radius);
        justify-content: center;
      }

      #btn-scan::after {
        content: 'Scansiona barcode';
      }
    }

    .prezzo-card {
      border-radius: var(--radius);
      position: relative;
      text-align: center;
      transition: box-shadow var(--transition);
    }

    .prezzo-card:hover { box-shadow: var(--shadow-md); }

    .prezzo-card.base { grid-column: 1 / -1; }

    /* Fronte colori */
    .prezzo-card.base .prezzo-card-front {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
    }
    .prezzo-card.base .prezzo-card-front::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; border-radius: var(--radius) var(--radius) 0 0;
      background: linear-gradient(90deg, #4f8bff, #60efff);
    }
    .prezzo-card.chn .prezzo-card-front        { background: #e0e7ff; border: 1.5px solid #a5b4fc; }
    .prezzo-card.interventi .prezzo-card-front { background: #ffedd5; border: 1.5px solid #fb923c; }
    .prezzo-card.fabbro .prezzo-card-front     { background: #dcfce7; border: 1.5px solid #86efac; }
    .prezzo-card.minimo .prezzo-card-front     { background: #fee2e2; border: 1.5px solid #fca5a5; }

    .prezzo-card.chn .prezzo-card-front::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; border-radius: var(--radius) var(--radius) 0 0;
      background: #6366f1;
    }
    .prezzo-card.interventi .prezzo-card-front::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; border-radius: var(--radius) var(--radius) 0 0;
      background: #f97316;
    }
    .prezzo-card.fabbro .prezzo-card-front::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; border-radius: var(--radius) var(--radius) 0 0;
      background: #22c55e;
    }
    .prezzo-card.minimo .prezzo-card-front::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; border-radius: var(--radius) var(--radius) 0 0;
      background: #ef4444;
    }

    .prezzo-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .prezzo-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Icons - front */
    .prezzo-card.base .prezzo-card-front .prezzo-icon        { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
    .prezzo-card.chn .prezzo-card-front .prezzo-icon         { background: #e0e7ff; color: #4338ca; }
    .prezzo-card.interventi .prezzo-card-front .prezzo-icon  { background: #ffedd5; color: #c2410c; }
    .prezzo-card.fabbro .prezzo-card-front .prezzo-icon      { background: #dcfce7; color: #166534; }
    .prezzo-card.minimo .prezzo-card-front .prezzo-icon      { background: #fee2e2; color: #b91c1c; }
    /* Icons - back */
    .prezzo-card.base .prezzo-card-back .prezzo-icon        { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8); }
    .prezzo-card.chn .prezzo-card-back .prezzo-icon         { background: #c7d2fe; color: #3730a3; }
    .prezzo-card.interventi .prezzo-card-back .prezzo-icon  { background: #fde68a; color: #92400e; }
    .prezzo-card.fabbro .prezzo-card-back .prezzo-icon      { background: #bbf7d0; color: #14532d; }
    .prezzo-card.minimo .prezzo-card-back .prezzo-icon      { background: #fecaca; color: #991b1b; }

    .prezzo-label {
      font-size: 0.73rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    /* Labels - front */
    .prezzo-card.base .prezzo-card-front .prezzo-label        { color: rgba(255,255,255,0.55); }
    .prezzo-card.chn .prezzo-card-front .prezzo-label         { color: #4338ca; }
    .prezzo-card.interventi .prezzo-card-front .prezzo-label  { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-card-front .prezzo-label      { color: #166534; }
    .prezzo-card.minimo .prezzo-card-front .prezzo-label      { color: #b91c1c; }
    /* Labels - back */
    .prezzo-card.base .prezzo-card-back .prezzo-label        { color: rgba(255,255,255,0.55); }
    .prezzo-card.chn .prezzo-card-back .prezzo-label         { color: #3730a3; }
    .prezzo-card.interventi .prezzo-card-back .prezzo-label  { color: #92400e; }
    .prezzo-card.fabbro .prezzo-card-back .prezzo-label      { color: #14532d; }
    .prezzo-card.minimo .prezzo-card-back .prezzo-label      { color: #991b1b; }

    .prezzo-valore {
      font-size: 1.9rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .prezzo-valore .prezzo-currency {
      font-size: 1rem;
      font-weight: 600;
      vertical-align: super;
      margin-right: 2px;
      opacity: 0.7;
    }

    /* Valori - front */
    .prezzo-card.base .prezzo-card-front .prezzo-valore { color: white; font-size: 2.3rem; }
    .prezzo-card.chn .prezzo-card-front .prezzo-valore        { color: #3730a3; }
    .prezzo-card.interventi .prezzo-card-front .prezzo-valore { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-card-front .prezzo-valore     { color: #166534; }
    .prezzo-card.minimo .prezzo-card-front .prezzo-valore     { color: #b91c1c; }
    /* Valori - back */
    .prezzo-card.base .prezzo-card-back .prezzo-valore { color: white; font-size: 2.3rem; }
    .prezzo-card.chn .prezzo-card-back .prezzo-valore        { color: #312e81; }
    .prezzo-card.interventi .prezzo-card-back .prezzo-valore { color: #92400e; }
    .prezzo-card.fabbro .prezzo-card-back .prezzo-valore     { color: #14532d; }
    .prezzo-card.minimo .prezzo-card-back .prezzo-valore     { color: #991b1b; }

    .prezzo-molt {
      font-size: 0.72rem;
      font-family: 'DM Mono', monospace;
      margin-top: 6px;
      opacity: 0.45;
    }

    /* ─── FLIP CARD ─── */
    .prezzo-card {
      perspective: 900px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .prezzo-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 110px;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: var(--radius);
    }

    .prezzo-card.base .prezzo-card-inner { min-height: 120px; }

    .prezzo-card.flipped .prezzo-card-inner {
      transform: rotateY(180deg);
    }

    .prezzo-card-front,
    .prezzo-card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .prezzo-card-back {
      transform: rotateY(180deg);
    }

    /* Colori retro (IVA inclusa) */
    .prezzo-card.base .prezzo-card-back        { background: linear-gradient(135deg, #1e3a5f 0%, #0f2744 100%); color: white; }
    .prezzo-card.chn .prezzo-card-back         { background: #c7d2fe; border: 1.5px solid #818cf8; }
    .prezzo-card.interventi .prezzo-card-back  { background: #fde68a; border: 1.5px solid #f59e0b; }
    .prezzo-card.fabbro .prezzo-card-back      { background: #bbf7d0; border: 1.5px solid #4ade80; }
    .prezzo-card.minimo .prezzo-card-back      { background: #fecaca; border: 1.5px solid #ef4444; }

    .prezzo-card-back .prezzo-card-back-before {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .prezzo-card.base        .prezzo-card-back-before { background: linear-gradient(90deg, #60efff, #a78bfa); }
    .prezzo-card.chn         .prezzo-card-back-before { background: #818cf8; }
    .prezzo-card.interventi  .prezzo-card-back-before { background: #f59e0b; }
    .prezzo-card.fabbro      .prezzo-card-back-before { background: #4ade80; }
    .prezzo-card.minimo      .prezzo-card-back-before { background: #f87171; }

    .iva-badge {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-radius: 4px;
      padding: 2px 7px;
      white-space: nowrap;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .prezzo-card.base .iva-badge        { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.75); }
    .prezzo-card.chn .iva-badge         { background: #c7d2fe; color: #3730a3; }
    .prezzo-card.interventi .iva-badge  { background: #fde68a; color: #92400e; }
    .prezzo-card.fabbro .iva-badge      { background: #bbf7d0; color: #14532d; }
    .prezzo-card.minimo .iva-badge      { background: #fecaca; color: #991b1b; }

    .prezzo-card-back .prezzo-header { margin-bottom: 6px; }
    .prezzo-card-back .prezzo-molt   { margin-top: 4px; }

    /* hint "tocca" visibile solo prima volta (sparisce dopo primo flip) */
    .flip-hint {
      position: absolute;
      bottom: 7px;
      right: 9px;
      font-size: 0.6rem;
      opacity: 0.35;
      font-family: 'DM Mono', monospace;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .prezzo-card.flipped .flip-hint,
    .prezzo-card.hint-done .flip-hint { opacity: 0; }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .detail-card .prezzo-card {
      animation: fadeUp 0.3s ease both;
    }
    .detail-card .prezzo-card:nth-child(1) { animation-delay: 0.05s; }
    .detail-card .prezzo-card:nth-child(2) { animation-delay: 0.1s; }
    .detail-card .prezzo-card:nth-child(3) { animation-delay: 0.15s; }
    .detail-card .prezzo-card:nth-child(4) { animation-delay: 0.2s; }
    .detail-card .prezzo-card:nth-child(5) { animation-delay: 0.25s; }

    /* ─── DETAIL TOP BAR ─── */
    .detail-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 8px;
    }

    /* tutti e tre i tasti della topbar condividono la stessa altezza e allineamento */
    .detail-topbar .btn-back,
    .detail-topbar .btn-iva-toggle,
    .detail-topbar .btn-add-picking {
      flex: 1;
      justify-content: center;
      min-width: 0;
    }

    /* mobile portrait: etichette abbreviate o icona-only per non andare a capo */
    @media (max-width: 540px) {
      .detail-topbar {
        gap: 6px;
      }
      .detail-topbar .btn-back,
      .detail-topbar .btn-iva-toggle,
      .detail-topbar .btn-add-picking {
        padding: 8px 6px;
        font-size: 0.78rem;
        gap: 4px;
      }
      /* "Nuova ricerca" → "Ricerca" */
      .btn-back-label { display: none; }
      .btn-back::after { content: 'Ricerca'; font-size: 0.78rem; }

      /* IVA: mostra solo il testo inclusa/esclusa, nasconde il dot */
      .btn-iva-toggle .toggle-dot { display: none; }

      /* Picking: nasconde testo lungo e svg, mostra "+ Picking" */
      .btn-pick-label { display: none; }
      .btn-add-picking > svg { display: none; }
      .btn-add-picking::after { content: '+ Picking'; font-size: 0.78rem; }
    }

    .btn-iva-toggle {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 8px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
      white-space: nowrap;
    }

    .btn-iva-toggle:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn-iva-toggle.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(220,38,38,0.25);
    }

    .btn-iva-toggle .toggle-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.5;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .btn-iva-toggle.active .toggle-dot { opacity: 1; }

    /* ─── SCANNER BUTTON (header) ─── */
    .btn-scan {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 10px 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    .btn-scan:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn-scan.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(220,38,38,0.3);
    }

    /* ─── SCANNER OVERLAY ─── */
    #scanner-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #000;
      flex-direction: column;
    }

    #scanner-overlay.open { display: flex; }

    #scanner-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* viewfinder frame */
    .scanner-frame {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .scanner-window {
      width: min(72vw, 300px);
      height: min(72vw, 300px);
      position: relative;
    }

    /* corner brackets */
    .scanner-window::before,
    .scanner-window::after,
    .scanner-corner-bl,
    .scanner-corner-br {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: white;
      border-style: solid;
    }

    .scanner-window::before  { top:0;    left:0;  border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .scanner-window::after   { top:0;    right:0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .scanner-corner-bl       { bottom:0; left:0;  border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .scanner-corner-br       { bottom:0; right:0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    /* scan line animation */
    .scanner-line {
      position: absolute;
      left: 6px; right: 6px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff4d4d, #ff9b9b, #ff4d4d, transparent);
      border-radius: 2px;
      animation: scanLine 2s ease-in-out infinite;
      box-shadow: 0 0 8px rgba(255,77,77,0.8);
    }

    @keyframes scanLine {
      0%   { top: 8px;   opacity: 0.4; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: calc(100% - 10px); opacity: 0.4; }
    }

    .scanner-hint {
      color: rgba(255,255,255,0.7);
      font-size: 0.82rem;
      margin-top: 22px;
      letter-spacing: 0.02em;
      text-align: center;
    }

    /* scanner top bar */
    .scanner-topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: env(safe-area-inset-top, 0px) 16px 0;
      padding-top: max(env(safe-area-inset-top, 0px), 16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 10;
    }

    .scanner-title {
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-scanner-close {
      cursor: pointer;
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      color: white;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      transition: background var(--transition);
    }

    .btn-scanner-close:hover { background: rgba(255,255,255,0.15); }

    /* scanner bottom controls */
    .scanner-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 24px);
      padding-left: 24px; padding-right: 24px;
      padding-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
    }

    .btn-scanner-ctrl {
      cursor: pointer;
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 50px;
      background: rgba(0,0,0,0.45);
      color: white;
      padding: 10px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      backdrop-filter: blur(6px);
      transition: background var(--transition), border-color var(--transition);
      -webkit-tap-highlight-color: transparent;
    }

    .btn-scanner-ctrl:hover  { background: rgba(255,255,255,0.15); }
    .btn-scanner-ctrl.on     { background: rgba(255,220,50,0.25); border-color: rgba(255,220,50,0.6); color: #ffd700; }
    .btn-scanner-ctrl.zoom-label { min-width: 52px; justify-content: center; }

    /* detected flash */
    .scanner-flash {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s;
    }

    .scanner-flash.blink { opacity: 0.5; }

    /* ─── CARRELLO BADGE (header) ─── */
    .btn-cart {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 10px 13px;
      display: none; /* hidden until items added */
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
    }
    .btn-cart.visible { display: flex; }
    .btn-cart:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }
    .cart-badge {
      position: absolute;
      top: -6px; right: -6px;
      background: #ef4444;
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 2px solid var(--surface);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* ─── PULSANTE AGGIUNGI NELLA SCHEDA DETTAGLIO ─── */
    .btn-add-picking {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 8px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-add-picking:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }
    .btn-add-picking.added {
      background: #f0fdf4;
      color: #16a34a;
      border-color: #86efac;
    }
    .btn-add-picking.added:hover {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fca5a5;
    }

    /* ─── POPUP QUANTITÀ ─── */
    #qty-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(15,23,42,0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #qty-overlay.open { display: flex; }

    .qty-popup {
      background: var(--surface);
      border-radius: 20px;
      padding: 28px 24px 24px;
      width: 100%;
      max-width: 320px;
      box-shadow: var(--shadow-lg);
      animation: fadeUp 0.22s ease both;
      text-align: center;
    }
    .qty-popup-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .qty-popup-art {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 2px;
    }
    .qty-popup-desc {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 24px;
      line-height: 1.35;
    }
    .qty-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .qty-btn {
      cursor: pointer;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 1.4rem;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition), border-color var(--transition);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      flex-shrink: 0;
    }
    .qty-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
    .qty-btn:active { transform: scale(0.93); }
    #qty-input {
      width: 72px;
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 4px;
      background: var(--bg);
      outline: none;
      -moz-appearance: textfield;
    }
    #qty-input::-webkit-outer-spin-button,
    #qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #qty-input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px rgba(220,38,38,0.1); }
    .qty-popup-actions {
      display: flex;
      gap: 10px;
    }
    .btn-qty-cancel {
      flex: 1;
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background var(--transition);
    }
    .btn-qty-cancel:hover { background: var(--bg); }
    .btn-qty-confirm {
      flex: 2;
      cursor: pointer;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      padding: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 2px 8px rgba(220,38,38,0.25);
      transition: background var(--transition), box-shadow var(--transition);
    }
    .btn-qty-confirm:hover { background: var(--accent-dark); box-shadow: 0 4px 14px rgba(220,38,38,0.35); }

    /* ─── PANNELLO CARRELLO ─── */
    #cart-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(15,23,42,0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      align-items: flex-end;
      justify-content: center;
    }
    #cart-overlay.open { display: flex; }

    .cart-panel {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 820px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -8px 40px rgba(15,23,42,0.18);
      animation: slideUp 0.28s cubic-bezier(0.4,0,0.2,1) both;
      overflow: hidden;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .cart-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .cart-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cart-count-pill {
      background: var(--accent);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
    }
    .btn-cart-close {
      cursor: pointer;
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition);
    }
    .btn-cart-close:hover { background: var(--border); }

    .cart-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 16px;
    }

    .cart-empty {
      text-align: center;
      padding: 40px 24px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .cart-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 10px 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.2s ease both;
    }
    .cart-row:last-child { border-bottom: none; }

    .cart-row-info { min-width: 0; }
    .cart-row-art {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .cart-row-desc {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cart-row-price {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* qty mini stepper in cart */
    .cart-qty-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .cart-qty-btn {
      cursor: pointer;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 1rem;
      font-weight: 400;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition);
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .cart-qty-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
    .cart-qty-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 22px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .btn-cart-remove {
      cursor: pointer;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1.5px solid #fca5a5;
      background: #fef2f2;
      color: #dc2626;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background var(--transition), border-color var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-cart-remove:hover { background: #fee2e2; border-color: #ef4444; }

    .cart-footer {
      padding: 16px 20px max(env(safe-area-inset-bottom, 0px), 20px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cart-footer-info {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }
    .btn-generate-pdf {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: white;
      padding: 15px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: 0 2px 8px rgba(220,38,38,0.25);
      transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-generate-pdf:hover { background: var(--accent-dark); box-shadow: 0 4px 14px rgba(220,38,38,0.35); transform: translateY(-1px); }
    .btn-generate-pdf:active { transform: scale(0.98); }
    .btn-generate-pdf:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* mobile: scan button adjustments when cart visible */
    @media (max-width: 600px) and (orientation: portrait) {
      #btn-cart {
        order: -1;
      }
    }

  </style>
</head>
<body>

<!-- ─── SCANNER OVERLAY ─── -->

<!-- ─── POPUP QUANTITÀ ─── -->
<div id="qty-overlay" onclick="handleQtyOverlayClick(event)">

<script>
  // ============================================================
  // CONFIGURAZIONE
  // ============================================================
  const SUPABASE_URL      = 'https://dltokkmmgiqcearzapzf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsdG9ra21tZ2lxY2VhcnphcHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2NzE4MjcsImV4cCI6MjA5MjI0NzgyN30.Aokl-GKXauodlJW7SgUBuYVh8l2tzJGm1rnlSFQ5djE';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ============================================================
  // ICONE SVG INLINE (riutilizzabili)
  // ============================================================
  const ICONS = {
    package:  `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`,
    building: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M8 9V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v4"/><line x1="12" y1="14" x2="12" y2="14"/></svg>`,
    tag:      `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
    barcode:  `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v14M7 5v14M11 5v14M15 5v14M19 5v14M21 5v14"/></svg>`,
    clock:    `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
    dot:      `<svg width="4" height="4" viewBox="0 0 4 4" fill="currentColor"><circle cx="2" cy="2" r="2"/></svg>`,
    arrowL:   `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
    // price icons
    star:     `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
    percent:  `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>`,
    wrench:   `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`,
    key:      `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>`,
    shield:   `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
    loader:   `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>`,
    empty:    `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    error:    `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  };

  // ============================================================
  // RICERCA
  // ============================================================
  async function doSearch() {
    const query = document.getElementById('search-input').value.trim();
    if (!query) return;

    const content = document.getElementById('main-content');
    content.innerHTML = `
      <div class="stato-msg loading">
        <div class="stato-icon">${ICONS.loader}</div>
        <p>Ricerca in corso…</p>
      </div>`;

    try {
      let dbQuery = supabaseClient.from('chiavi').select('*');

      if (query.startsWith('%')) {
        const term = query.slice(1);
        dbQuery = dbQuery.or(`art.ilike.%${term}%,fornitore.ilike.%${term}%,descrizione.ilike.%${term}%`);
      } else if (/^\d{8,14}$/.test(query)) {
        dbQuery = dbQuery.or(`ean.eq.${query},art.eq.${query}`);
      } else {
        dbQuery = dbQuery.or(`art.eq.${query},fornitore.ilike.%${query}%,descrizione.ilike.%${query}%`);
      }

      const { data, error } = await dbQuery.order('fornitore').limit(100);
      if (error) throw error;

      if (!data || data.length === 0) {
        content.innerHTML = `
          <div class="stato-msg">
            <div class="stato-icon">${ICONS.empty}</div>
            <p>Nessun articolo trovato<br>per <strong>${esc(query)}</strong></p>
          </div>`;
        return;
      }

      if (data.length === 1) {
        showDettaglio(data[0]);
      } else {
        showListaRisultati(data);
      }

    } catch (e) {
      content.innerHTML = `
        <div class="stato-msg">
          <div class="stato-icon" style="background:#fef2f2;color:#ef4444">${ICONS.error}</div>
          <p>Errore: <strong>${esc(e.message)}</strong></p>
        </div>`;
    }
  }

  // ============================================================
  // LISTA RISULTATI
  // ============================================================
  function showListaRisultati(items) {
    const content = document.getElementById('main-content');

    const rows = items.map(item => {
      const hasChiave  = !!item.foto_chiave;
      const hasTessera = !!item.foto_tessera;
      const fotoHtml = (hasChiave || hasTessera) ? `
        <div class="result-photos">
          ${hasChiave  ? `<img class="result-thumb" src="${esc(item.foto_chiave)}"  alt="Chiave"  loading="lazy" onclick="openPhotoLightbox('${esc(item.foto_chiave)}', event)"  onerror="this.style.display='none'">` : ''}
          ${hasTessera ? `<img class="result-thumb" src="${esc(item.foto_tessera)}" alt="Tessera" loading="lazy" onclick="openPhotoLightbox('${esc(item.foto_tessera)}', event)" onerror="this.style.display='none'">` : ''}
        </div>` : '';

      return `
      <div class="result-item" onclick='showDettaglio(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
        ${fotoHtml}
        <div class="result-main">
          <div class="result-fornitore">${esc(item.fornitore || '—')}</div>
          <div class="result-desc">${esc(item.descrizione || '—')}</div>
          <div class="result-meta">
            <span class="result-art-tag">${esc(item.art || '—')}</span>
            ${item.um ? `${ICONS.dot} ${ICONS.package} ${esc(item.um)}` : ''}
          </div>
        </div>
        <div class="result-price"><span class="currency">€</span>${fmt(item.prezzo)}</div>

    }).join('');

    content.innerHTML = `

  // ============================================================
  // UTILITY
  // ============================================================
  function fmt(n) {
    const num = parseFloat(n);
    if (isNaN(num)) return '—';
    return num.toFixed(2).replace('.', ',');
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Lightbox foto (chiave/tessera) ──────────────────────────
  function openPhotoLightbox(url, ev) {
    if (ev) ev.stopPropagation();
    if (!url) return;
    document.getElementById('lightbox-img').src = url;
    document.getElementById('photo-lightbox').classList.add('open');
  }

  function closePhotoLightbox() {
    document.getElementById('photo-lightbox').classList.remove('open');
    document.getElementById('lightbox-img').src = '';
  }

  function handlePhotoLightboxClick(e) {
    if (e.target.id === 'photo-lightbox') closePhotoLightbox();
  }

  // ============================================================
  // SCANNER BARCODE
  // ============================================================
  let scannerStream    = null;
  let scannerDetector  = null;
  let scannerActive    = false;
  let scannerRAF       = null;
  let currentZoom      = 1;
  let maxZoom          = 4;
  let torchOn          = false;
  let lastScanned      = null;
  let lastScannedTime  = 0;

  async function openScanner() {
    const overlay = document.getElementById('scanner-overlay');

    // Richiedi permesso fotocamera
    try {
      const constraints = {
        video: {
          facingMode: { ideal: 'environment' },
          width:  { ideal: 1920 },
          height: { ideal: 1080 },
        }
      };
      scannerStream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (e) {
      alert('Fotocamera non accessibile: ' + e.message);
      return;
    }

    const video = document.getElementById('scanner-video');
    video.srcObject = scannerStream;
    await video.play().catch(() => {});

    // Inizializza BarcodeDetector (nativo o polyfill)
    try {
      scannerDetector = new BarcodeDetector({
        formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e',
                  'code_128', 'code_39', 'code_93',
                  'qr_code', 'data_matrix', 'itf']
      });
    } catch (e) {
      alert('BarcodeDetector non disponibile: ' + e.message);
      stopStream();
      return;
    }

    // Reset stato
    currentZoom = 1;
    torchOn     = false;
    lastScanned = null;
    updateZoomLabel();
    document.getElementById('btn-flash').classList.remove('on');

    // Controlla disponibilità torch e zoom
    await checkCapabilities();

    overlay.classList.add('open');
    document.getElementById('btn-scan').classList.add('active');
    scannerActive = true;
    scanLoop();
  }

  async function checkCapabilities() {
    if (!scannerStream) return;
    const track = scannerStream.getVideoTracks()[0];
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};

    // Torch
    const flashBtn = document.getElementById('btn-flash');
    if (caps.torch) {
      flashBtn.style.display = '';
    } else {
      flashBtn.style.display = 'none';
    }

    // Zoom max
    if (caps.zoom && caps.zoom.max) {
      maxZoom = Math.min(caps.zoom.max, 6);
    }
  }

  function closeScanner() {
    scannerActive = false;
    if (scannerRAF) { cancelAnimationFrame(scannerRAF); scannerRAF = null; }
    stopStream();
    document.getElementById('scanner-overlay').classList.remove('open');
    document.getElementById('btn-scan').classList.remove('active');
    // Rimetti focus sull'input
    document.getElementById('search-input').focus();
  }

  function stopStream() {
    if (scannerStream) {
      scannerStream.getTracks().forEach(t => t.stop());
      scannerStream = null;
    }
    const video = document.getElementById('scanner-video');
    video.srcObject = null;
  }

  function scanLoop() {
    if (!scannerActive) return;
    const video = document.getElementById('scanner-video');

    if (video.readyState < 2) {
      scannerRAF = requestAnimationFrame(scanLoop);
      return;
    }

    scannerDetector.detect(video).then(barcodes => {
      if (!scannerActive) return;
      if (barcodes.length > 0) {
        const code = barcodes[0].rawValue;
        const now  = Date.now();
        // Evita rilevamenti multipli dello stesso codice entro 2s
        if (code !== lastScanned || now - lastScannedTime > 2000) {
          lastScanned     = code;
          lastScannedTime = now;
          onBarcodeDetected(code);
        }
      }
      scannerRAF = requestAnimationFrame(scanLoop);
    }).catch(() => {
      scannerRAF = requestAnimationFrame(scanLoop);
    });
  }

  function onBarcodeDetected(code) {
    // Flash visivo
    const flash = document.getElementById('scanner-flash');
    flash.classList.add('blink');
    setTimeout(() => flash.classList.remove('blink'), 150);

    // Vibrazione (Android)
    if (navigator.vibrate) navigator.vibrate(60);

    // Chiudi scanner, metti codice nell'input e avvia ricerca
    closeScanner();
    const input = document.getElementById('search-input');
    input.value = code;
    doSearch();
  }

  async function toggleFlash() {
    if (!scannerStream) return;
    const track = scannerStream.getVideoTracks()[0];
    if (!track) return;
    torchOn = !torchOn;
    try {
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      document.getElementById('btn-flash').classList.toggle('on', torchOn);
    } catch (e) {
      torchOn = !torchOn; // rollback
    }
  }

  async function changeZoom(delta) {
    if (!scannerStream) return;
    const track = scannerStream.getVideoTracks()[0];
    if (!track) return;
    const newZoom = Math.max(1, Math.min(maxZoom, currentZoom + delta));
    if (newZoom === currentZoom) return;
    try {
      await track.applyConstraints({ advanced: [{ zoom: newZoom }] });
      currentZoom = newZoom;
      updateZoomLabel();
    } catch (e) {
      // Zoom non supportato su questo dispositivo — silenzioso
    }
  }

  function updateZoomLabel() {
    document.getElementById('zoom-label').textContent = currentZoom % 1 === 0
      ? currentZoom + '×'
      : currentZoom.toFixed(1) + '×';
  }

  // Chiudi con tasto Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && scannerActive) closeScanner();
  });


  // ============================================================
  // TOGGLE GLOBALE IVA
  // ============================================================
  let ivaGlobaleAttiva = false;

  function toggleTutteIva() {
    ivaGlobaleAttiva = !ivaGlobaleAttiva;
    const cards = document.querySelectorAll('.prezzo-card');
    cards.forEach(card => {
      if (ivaGlobaleAttiva) {
        card.classList.add('flipped', 'hint-done');
      } else {
        card.classList.remove('flipped');
      }
    });
    const btn = document.getElementById('btn-iva-toggle');
    if (btn) {
      btn.classList.toggle('active', ivaGlobaleAttiva);
      btn.innerHTML = ivaGlobaleAttiva
        ? '<span class="toggle-dot"></span><span class="btn-iva-label"> IVA inclusa</span>'
        : '<span class="toggle-dot"></span><span class="btn-iva-label"> IVA esclusa</span>';
    }
  }

  // ============================================================
  // SERVICE WORKER (PWA)
  // ============================================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.warn('SW registration failed:', err));
    });
  }

  // ============================================================
  // PICKING LIST — CARRELLO (solo in memoria, nessuna persistenza)
  // ============================================================
  let carrello = []; // { art, descrizione, um, fornitore, prezzoBase, qty }
  let pendingItem = null;    // articolo in attesa di conferma quantità
  let currentDetailItem = null; // articolo attualmente visualizzato nel dettaglio

  // Helper: apre il popup per l'articolo corrente nel dettaglio
  function openQtyPopupCurrent() {
    if (currentDetailItem) openQtyPopup(currentDetailItem);
  }

  // ── Aggiorna badge nell'header ──────────────────────────────
  function aggiornaCartBadge() {
    const totQty = carrello.reduce((s, r) => s + r.qty, 0);
    const badge  = document.getElementById('cart-badge');
    const btn    = document.getElementById('btn-cart');
    if (badge) badge.textContent = totQty;
    if (btn)  btn.classList.toggle('visible', carrello.length > 0);
  }

  // ── Apri popup quantità ─────────────────────────────────────
  function openQtyPopup(item) {
    pendingItem = item;
    const inCart = carrello.find(r => r.art === item.art);

    document.getElementById('qty-art').textContent  = item.art || '';
    document.getElementById('qty-desc').textContent = item.descrizione || '';

    const inp = document.getElementById('qty-input');
    inp.value = inCart ? inCart.qty : 1;

    document.getElementById('qty-overlay').classList.add('open');
    // focus con delay per evitare problemi su iOS Safari
    setTimeout(() => { try { inp.focus(); inp.select(); } catch(e) {} }, 120);
  }

  function closeQtyPopup() {
    document.getElementById('qty-overlay').classList.remove('open');
    pendingItem = null;
  }

  function handleQtyOverlayClick(e) {
    if (e.target === document.getElementById('qty-overlay')) closeQtyPopup();
  }

  function changeQty(delta) {
    const inp = document.getElementById('qty-input');
    const v = parseInt(inp.value, 10) || 1;
    inp.value = Math.max(1, v + delta);
  }

  function clampQty() {
    const inp = document.getElementById('qty-input');
    let v = parseInt(inp.value, 10);
    if (isNaN(v) || v < 1) v = 1;
    if (v > 9999) v = 9999;
    inp.value = v;
  }

  function confirmAddToCart() {
    if (!pendingItem) return;
    clampQty();
    const qty = parseInt(document.getElementById('qty-input').value, 10) || 1;
    const art = pendingItem.art;

    const esistente = carrello.find(r => r.art === art);
    if (esistente) {
      esistente.qty = qty;
    } else {
      carrello.push({
        art:        pendingItem.art        || '',
        descrizione:pendingItem.descrizione|| '',
        um:         pendingItem.um         || '',
        fornitore:  pendingItem.fornitore  || '',
        prezzoBase: parseFloat(pendingItem.prezzo) || 0,
        qty:        qty,
      });
    }

    closeQtyPopup();
    aggiornaCartBadge();
    aggiornaBottoneDettaglio(pendingItem.art);
  }

  // ── Aggiorna il bottone nella scheda dettaglio ──────────────
  function aggiornaBottoneDettaglio(art) {
    const btn = document.getElementById('btn-add-picking-detail');
    if (!btn) return;
    const inCart = carrello.find(r => r.art === art);
    if (inCart) {
      btn.classList.add('added');
      btn.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span class="btn-pick-label">In lista (${inCart.qty} pz) — modifica</span>`;
    } else {
      btn.classList.remove('added');
      btn.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        <span class="btn-pick-label">Aggiungi a picking</span>`;
    }
  }

  // ── Pannello carrello ────────────────────────────────────────
  function openCart() {
    renderCart();
    document.getElementById('cart-overlay').classList.add('open');
  }

  function closeCart() {
    document.getElementById('cart-overlay').classList.remove('open');
  }

  function handleCartOverlayClick(e) {
    if (e.target === document.getElementById('cart-overlay')) closeCart();
  }

  function renderCart() {
    const body = document.getElementById('cart-body');
    const pill = document.getElementById('cart-count-pill');
    const info = document.getElementById('cart-footer-info');
    const pdfBtn = document.getElementById('btn-generate-pdf');

    if (pill) pill.textContent = carrello.length;

    if (carrello.length === 0) {
      body.innerHTML = '<div class="cart-empty">Nessun articolo nella lista</div>';
      if (info) info.textContent = '';
      if (pdfBtn) pdfBtn.disabled = true;
      return;
    }

    if (pdfBtn) pdfBtn.disabled = false;

    const totRighe = carrello.length;
    const totPz    = carrello.reduce((s, r) => s + r.qty, 0);
    if (info) info.textContent = `${totRighe} articol${totRighe === 1 ? 'o' : 'i'} · ${totPz} pz totali`;

    body.innerHTML = carrello.map((r, i) => {
      const prezzoVendita = (r.prezzoBase * 1.20).toFixed(2).replace('.', ',');
      return `
        <div class="cart-row" id="cart-row-${i}">
          <div class="cart-row-info">
            <div class="cart-row-art">${esc(r.art)}</div>
            <div class="cart-row-desc">${esc(r.descrizione)}</div>
            <div class="cart-row-price">€ ${prezzoVendita} · prezzo vendita (+20%)</div>
          </div>
          <div class="cart-qty-wrap">
            <button class="cart-qty-btn" onclick="cartChangeQty(${i}, -1)" aria-label="Diminuisci">−</button>
            <span class="cart-qty-val" id="cart-qty-val-${i}">${r.qty}</span>
            <button class="cart-qty-btn" onclick="cartChangeQty(${i}, +1)" aria-label="Aumenta">+</button>
          </div>
          <button class="btn-cart-remove" onclick="cartRemove(${i})" aria-label="Rimuovi">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>`;
    }).join('');
  }

  function cartChangeQty(i, delta) {
    if (!carrello[i]) return;
    carrello[i].qty = Math.max(1, carrello[i].qty + delta);
    const el = document.getElementById(`cart-qty-val-${i}`);
    if (el) el.textContent = carrello[i].qty;
    // aggiorna footer info
    const totRighe = carrello.length;
    const totPz    = carrello.reduce((s, r) => s + r.qty, 0);
    const info = document.getElementById('cart-footer-info');
    if (info) info.textContent = `${totRighe} articol${totRighe === 1 ? 'o' : 'i'} · ${totPz} pz totali`;
    aggiornaCartBadge();
    // aggiorna bottone nella scheda se visibile
    aggiornaBottoneDettaglio(carrello[i].art);
  }

  function cartRemove(i) {
    if (!carrello[i]) return;
    const art = carrello[i].art;
    carrello.splice(i, 1);
    renderCart();
    aggiornaCartBadge();
    aggiornaBottoneDettaglio(art);
  }

  // ── Tasto ESC chiude i pannelli ─────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.getElementById('photo-lightbox').classList.contains('open')) {
        closePhotoLightbox();
      } else if (document.getElementById('qty-overlay').classList.contains('open')) {
        closeQtyPopup();
      } else if (document.getElementById('cart-overlay').classList.contains('open')) {
        closeCart();
      } else if (scannerActive) {
        closeScanner();
      }
    }
  });

  // ── Generazione PDF ─────────────────────────────────────────
  function generatePDF() {
    if (carrello.length === 0) return;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

    const oggi = new Date();
    const dataStr = oggi.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const oraStr  = oggi.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

    // Header
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.setTextColor(37, 99, 235);
    doc.text('PICKING LIST', 14, 20);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(100, 116, 139);
    doc.text(`Generata il ${dataStr} alle ${oraStr}`, 14, 27);

    // Linea separatrice
    doc.setDrawColor(232, 236, 244);
    doc.setLineWidth(0.5);
    doc.line(14, 31, 196, 31);

    // Tabella
    const head = [['Articolo', 'Descrizione', 'UM', 'PZ', 'Prezzo (+20%)']];
    const body = carrello.map(r => [
      r.art,
      r.descrizione,
      r.um || '—',
      String(r.qty),
      '€ ' + (r.prezzoBase * 1.20).toFixed(2).replace('.', ','),
    ]);

    doc.autoTable({
      head: head,
      body: body,
      startY: 35,
      styles: {
        font: 'helvetica',
        fontSize: 9,
        cellPadding: 4,
        textColor: [15, 23, 42],
        lineColor: [232, 236, 244],
        lineWidth: 0.3,
      },
      headStyles: {
        fillColor: [37, 99, 235],
        textColor: [255, 255, 255],
        fontStyle: 'bold',
        fontSize: 8.5,
      },
      alternateRowStyles: {
        fillColor: [244, 246, 251],
      },
      columnStyles: {
        0: { cellWidth: 30, font: 'courier', fontSize: 8 },
        1: { cellWidth: 'auto' },
        2: { cellWidth: 14, halign: 'center' },
        3: { cellWidth: 14, halign: 'center', fontStyle: 'bold' },
        4: { cellWidth: 32, halign: 'right', fontStyle: 'bold' },
      },
      margin: { left: 14, right: 14 },
    });

    // Totali a piè di tabella
    const finalY = doc.lastAutoTable.finalY + 6;
    const totPz  = carrello.reduce((s, r) => s + r.qty, 0);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.setTextColor(15, 23, 42);
    doc.text(`Totale articoli: ${carrello.length}   |   Totale pezzi: ${totPz}`, 14, finalY);

    // Footer pagina
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.5);
    doc.setTextColor(148, 163, 184);
    doc.text('Chiavi — documento generato automaticamente', 14, 287);

    // Salva e poi svuota il carrello
    doc.save(`picking-list-${dataStr.replace(/\//g, '-')}.pdf`);

    // Reset carrello
    carrello = [];
    aggiornaCartBadge();
    closeCart();
    // aggiorna bottone nella scheda se ancora visibile
    const btnDetail = document.getElementById('btn-add-picking-detail');
    if (btnDetail) aggiornaBottoneDettaglio('');
  }
</script>
</body>
</html>
