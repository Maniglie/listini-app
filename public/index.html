<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Listini Prezzi</title>

  <!-- ═══ PWA META ═══════════════════════════════════════════ -->
  <link rel="manifest" href="manifest.json">

  <!-- Theme color (barra del browser / status bar) -->
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS / iPadOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Listini">

  <!-- iOS icons (Apple ignora il manifest per le icone) -->
  <link rel="apple-touch-icon" href="icons/icon-180x180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167x167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">

  <!-- Favicon desktop -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16x16.png">
  <link rel="shortcut icon" href="icons/favicon.ico">

  <!-- Windows tile -->
  <meta name="msapplication-TileColor" content="#2563eb">
  <meta name="msapplication-TileImage" content="icons/icon-144x144.png">

  <!-- SEO / sharing -->
  <meta name="description" content="Ricerca rapida listini prezzi con lettore barcode integrato">
  <!-- ═══════════════════════════════════════════════════════ -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Barcode Detection API polyfill (ZXing-WASM) — covers iOS Safari, Firefox, etc. -->
  <script src="https://fastly.jsdelivr.net/npm/barcode-detector@3/dist/iife/polyfill.min.js"></script>
  <style>
    :root {
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --accent-dark: #1d4ed8;
      --surface: #ffffff;
      --bg: #f4f6fb;
      --border: #e8ecf4;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
      --shadow-md: 0 4px 16px rgba(15,23,42,0.08), 0 2px 6px rgba(15,23,42,0.04);
      --shadow-lg: 0 12px 32px rgba(15,23,42,0.1), 0 4px 12px rgba(15,23,42,0.05);
      --radius: 14px;
      --radius-sm: 8px;
      --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .header-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .logo svg { flex-shrink: 0; }

    .search-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color var(--transition);
    }

    .search-wrap:focus-within .search-icon { color: var(--accent); }

    #search-input {
      width: 100%;
      padding: 11px 14px 11px 42px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }

    #search-input::placeholder { color: var(--text-muted); }

    #search-input:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .btn-search {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      background: var(--accent);
      color: white;
      padding: 11px 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 2px 8px rgba(37,99,235,0.25);
      flex-shrink: 0;
    }

    .btn-search:hover {
      background: var(--accent-dark);
      box-shadow: 0 4px 14px rgba(37,99,235,0.35);
      transform: translateY(-1px);
    }

    .btn-search:active { transform: scale(0.97) translateY(0); }

    /* ─── CONTENT ─── */
    .content {
      max-width: 820px;
      margin: 28px auto;
      padding: 0 16px 60px;
    }

    /* ─── EMPTY STATE ─── */
    .stato-msg {
      text-align: center;
      padding: 72px 24px;
      color: var(--text-secondary);
      animation: fadeUp 0.35s ease both;
    }

    .stato-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      background: var(--accent-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .stato-msg p {
      font-size: 0.95rem;
      line-height: 1.7;
      max-width: 300px;
      margin: 0 auto;
    }

    .stato-msg strong { color: var(--text-primary); font-weight: 600; }

    .stato-msg.loading .stato-icon { animation: spin 1.2s linear infinite; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ─── RESULTS ─── */
    .results-count {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .results-list { display: flex; flex-direction: column; gap: 6px; }

    .result-item {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 15px 18px;
      cursor: pointer;
      border: 1.5px solid transparent;
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 16px;
      align-items: center;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
      animation: fadeUp 0.3s ease both;
    }

    .result-item:nth-child(1) { animation-delay: 0.03s; }
    .result-item:nth-child(2) { animation-delay: 0.06s; }
    .result-item:nth-child(3) { animation-delay: 0.09s; }
    .result-item:nth-child(4) { animation-delay: 0.12s; }
    .result-item:nth-child(5) { animation-delay: 0.15s; }
    .result-item:nth-child(n+6) { animation-delay: 0.18s; }

    .result-item:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md), 0 0 0 3px rgba(37,99,235,0.06);
      transform: translateY(-1px);
    }

    .result-art {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.03em;
    }

    .result-desc {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      grid-column: 1;
    }

    .result-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      grid-column: 1;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .result-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      grid-row: 1 / 4;
      grid-column: 2;
      text-align: right;
      align-self: center;
      font-variant-numeric: tabular-nums;
    }

    .result-price .currency {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      vertical-align: super;
      margin-right: 1px;
    }

    /* ─── DETAIL ─── */
    .btn-back {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 8px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }

    .btn-back:hover {
      background: var(--bg);
      color: var(--text-primary);
      border-color: var(--accent);
    }

    .detail-card {
      background: var(--surface);
      border-radius: 18px;
      padding: 26px;
      box-shadow: var(--shadow-md);
      animation: fadeUp 0.3s ease both;
    }

    .article-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
      margin-bottom: 22px;
    }

    .article-code {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .article-desc {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 14px;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .article-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meta-tag {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .meta-tag svg { color: var(--text-muted); flex-shrink: 0; }

    .article-update {
      font-size: 0.73rem;
      color: var(--text-muted);
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ─── PRICE GRID ─── */
    .prezzi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .prezzi-grid { grid-template-columns: 1fr; }
      .logo span { display: none; }
    }

    .prezzo-card {
      border-radius: var(--radius);
      padding: 18px;
      position: relative;
      overflow: hidden;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .prezzo-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .prezzo-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .prezzo-card.base {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      grid-column: 1 / -1;
    }

    .prezzo-card.base::before  { background: linear-gradient(90deg, #4f8bff, #60efff); }
    .prezzo-card.chn::before        { background: #6366f1; }
    .prezzo-card.interventi::before { background: #f97316; }
    .prezzo-card.fabbro::before     { background: #22c55e; }
    .prezzo-card.minimo::before     { background: #ef4444; }

    .prezzo-card.chn        { background: #eef2ff; border: 1.5px solid #c7d2fe; }
    .prezzo-card.interventi { background: #fff7ed; border: 1.5px solid #fed7aa; }
    .prezzo-card.fabbro     { background: #f0fdf4; border: 1.5px solid #bbf7d0; }
    .prezzo-card.minimo     { background: #fef2f2; border: 1.5px solid #fecaca; }

    .prezzo-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .prezzo-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .prezzo-card.base .prezzo-icon        { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
    .prezzo-card.chn .prezzo-icon         { background: #e0e7ff; color: #4338ca; }
    .prezzo-card.interventi .prezzo-icon  { background: #ffedd5; color: #c2410c; }
    .prezzo-card.fabbro .prezzo-icon      { background: #dcfce7; color: #166534; }
    .prezzo-card.minimo .prezzo-icon      { background: #fee2e2; color: #b91c1c; }

    .prezzo-label {
      font-size: 0.73rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .prezzo-card.base .prezzo-label        { color: rgba(255,255,255,0.55); }
    .prezzo-card.chn .prezzo-label         { color: #4338ca; }
    .prezzo-card.interventi .prezzo-label  { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-label      { color: #166534; }
    .prezzo-card.minimo .prezzo-label      { color: #b91c1c; }

    .prezzo-valore {
      font-size: 1.9rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .prezzo-valore .prezzo-currency {
      font-size: 1rem;
      font-weight: 600;
      vertical-align: super;
      margin-right: 2px;
      opacity: 0.7;
    }

    .prezzo-card.base .prezzo-valore { color: white; font-size: 2.3rem; }
    .prezzo-card.chn .prezzo-valore        { color: #3730a3; }
    .prezzo-card.interventi .prezzo-valore { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-valore     { color: #166534; }
    .prezzo-card.minimo .prezzo-valore     { color: #b91c1c; }

    .prezzo-molt {
      font-size: 0.72rem;
      font-family: 'DM Mono', monospace;
      margin-top: 6px;
      opacity: 0.45;
    }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .detail-card .prezzo-card {
      animation: fadeUp 0.3s ease both;
    }
    .detail-card .prezzo-card:nth-child(1) { animation-delay: 0.05s; }
    .detail-card .prezzo-card:nth-child(2) { animation-delay: 0.1s; }
    .detail-card .prezzo-card:nth-child(3) { animation-delay: 0.15s; }
    .detail-card .prezzo-card:nth-child(4) { animation-delay: 0.2s; }
    .detail-card .prezzo-card:nth-child(5) { animation-delay: 0.25s; }

    /* ─── SCANNER BUTTON (header) ─── */
    .btn-scan {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 10px 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    .btn-scan:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn-scan.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(37,99,235,0.3);
    }

    /* ─── SCANNER OVERLAY ─── */
    #scanner-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #000;
      flex-direction: column;
    }

    #scanner-overlay.open { display: flex; }

    #scanner-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* viewfinder frame */
    .scanner-frame {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .scanner-window {
      width: min(72vw, 300px);
      height: min(72vw, 300px);
      position: relative;
    }

    /* corner brackets */
    .scanner-window::before,
    .scanner-window::after,
    .scanner-corner-bl,
    .scanner-corner-br {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: white;
      border-style: solid;
    }

    .scanner-window::before  { top:0;    left:0;  border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .scanner-window::after   { top:0;    right:0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .scanner-corner-bl       { bottom:0; left:0;  border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .scanner-corner-br       { bottom:0; right:0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    /* scan line animation */
    .scanner-line {
      position: absolute;
      left: 6px; right: 6px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #4f8bff, #60efff, #4f8bff, transparent);
      border-radius: 2px;
      animation: scanLine 2s ease-in-out infinite;
      box-shadow: 0 0 8px rgba(96,239,255,0.8);
    }

    @keyframes scanLine {
      0%   { top: 8px;   opacity: 0.4; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: calc(100% - 10px); opacity: 0.4; }
    }

    .scanner-hint {
      color: rgba(255,255,255,0.7);
      font-size: 0.82rem;
      margin-top: 22px;
      letter-spacing: 0.02em;
      text-align: center;
    }

    /* scanner top bar */
    .scanner-topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: env(safe-area-inset-top, 0px) 16px 0;
      padding-top: max(env(safe-area-inset-top, 0px), 16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 10;
    }

    .scanner-title {
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-scanner-close {
      cursor: pointer;
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      color: white;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      transition: background var(--transition);
    }

    .btn-scanner-close:hover { background: rgba(255,255,255,0.15); }

    /* scanner bottom controls */
    .scanner-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 24px);
      padding-left: 24px; padding-right: 24px;
      padding-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
    }

    .btn-scanner-ctrl {
      cursor: pointer;
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 50px;
      background: rgba(0,0,0,0.45);
      color: white;
      padding: 10px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      backdrop-filter: blur(6px);
      transition: background var(--transition), border-color var(--transition);
      -webkit-tap-highlight-color: transparent;
    }

    .btn-scanner-ctrl:hover  { background: rgba(255,255,255,0.15); }
    .btn-scanner-ctrl.on     { background: rgba(255,220,50,0.25); border-color: rgba(255,220,50,0.6); color: #ffd700; }
    .btn-scanner-ctrl.zoom-label { min-width: 52px; justify-content: center; }

    /* detected flash */
    .scanner-flash {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s;
    }

    .scanner-flash.blink { opacity: 0.5; }

  </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14,2 14,8 20,8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10,9 9,9 8,9"/>
      </svg>
      <span>Listini</span>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input"
             placeholder="Codice, EAN oppure %ricerca libera..."
             onkeydown="if(event.key==='Enter') doSearch()"
             autofocus autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn-search" onclick="doSearch()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>

        Cerca
      </button>
      <button class="btn-scan" id="btn-scan" onclick="openScanner()" title="Scansiona barcode">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>

</div>

<!-- ─── SCANNER OVERLAY ─── -->
<div id="scanner-overlay">
  <video id="scanner-video" playsinline muted autoplay></video>
  <div class="scanner-frame">

      <div class="scanner-corner-bl"></div>

  <div class="scanner-topbar">
    <div class="scanner-title">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>

  </div>
  <div class="scanner-controls">
    <button class="btn-scanner-ctrl" id="btn-flash" onclick="toggleFlash()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      Flash
    </button>
    <button class="btn-scanner-ctrl zoom-label" id="btn-zoom-out" onclick="changeZoom(-0.5)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </button>
    <span id="zoom-label" style="color:rgba(255,255,255,0.7);font-size:0.8rem;font-weight:600;min-width:36px;text-align:center;">1×</span>
    <button class="btn-scanner-ctrl zoom-label" id="btn-zoom-in" onclick="changeZoom(+0.5)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </button>
  </div>
  <div class="scanner-flash" id="scanner-flash"></div>
</div>

<div class="content" id="main-content">
  <div class="stato-msg">
    <div class="stato-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
    <p>Cerca per <strong>codice articolo</strong> o <strong>EAN</strong><br>
       Usa <strong>%testo</strong> per ricerca parziale sul codice</p>
  </div>
</div>

<script>
  // ============================================================
  // CONFIGURAZIONE
  // ============================================================
  const SUPABASE_URL      = 'https://dltokkmmgiqcearzapzf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsdG9ra21tZ2lxY2VhcnphcHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2NzE4MjcsImV4cCI6MjA5MjI0NzgyN30.Aokl-GKXauodlJW7SgUBuYVh8l2tzJGm1rnlSFQ5djE';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ============================================================
  // ICONE SVG INLINE (riutilizzabili)
  // ============================================================
  const ICONS = {
    package:  `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`,
    building: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M8 9V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v4"/><line x1="12" y1="14" x2="12" y2="14"/></svg>`,
    tag:      `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
    barcode:  `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v14M7 5v14M11 5v14M15 5v14M19 5v14M21 5v14"/></svg>`,
    clock:    `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
    dot:      `<svg width="4" height="4" viewBox="0 0 4 4" fill="currentColor"><circle cx="2" cy="2" r="2"/></svg>`,
    arrowL:   `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
    // price icons
    star:     `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
    percent:  `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>`,
    wrench:   `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`,
    key:      `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>`,
    shield:   `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
    loader:   `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>`,
    empty:    `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    error:    `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  };

  // ============================================================
  // RICERCA
  // ============================================================
  async function doSearch() {
    const query = document.getElementById('search-input').value.trim();
    if (!query) return;

    const content = document.getElementById('main-content');
    content.innerHTML = `
      <div class="stato-msg loading">
        <div class="stato-icon">${ICONS.loader}</div>
        <p>Ricerca in corso…</p>
      </div>`;

    try {
      let dbQuery = supabaseClient.from('prodotti').select('*');

      if (query.startsWith('%')) {
        const term = query.slice(1);
        dbQuery = dbQuery.ilike('art', `%${term}%`);
      } else if (/^\d{8,14}$/.test(query)) {
        dbQuery = dbQuery.or(`ean.eq.${query},art.eq.${query}`);
      } else {
        dbQuery = dbQuery.eq('art', query);
      }

      const { data, error } = await dbQuery.order('fornitore').limit(100);
      if (error) throw error;

      if (!data || data.length === 0) {
        content.innerHTML = `
          <div class="stato-msg">
            <div class="stato-icon">${ICONS.empty}</div>
            <p>Nessun articolo trovato<br>per <strong>${esc(query)}</strong></p>
          </div>`;
        return;
      }

      if (data.length === 1) {
        showDettaglio(data[0]);
      } else {
        showListaRisultati(data);
      }

    } catch (e) {
      content.innerHTML = `
        <div class="stato-msg">
          <div class="stato-icon" style="background:#fef2f2;color:#ef4444">${ICONS.error}</div>
          <p>Errore: <strong>${esc(e.message)}</strong></p>
        </div>`;
    }
  }

  // ============================================================
  // LISTA RISULTATI
  // ============================================================
  function showListaRisultati(items) {
    const content = document.getElementById('main-content');

    const rows = items.map(item => `
      <div class="result-item" onclick='showDettaglio(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
        <div class="result-art">${esc(item.art || '—')}</div>
        <div class="result-desc">${esc(item.descrizione || '—')}</div>
        <div class="result-meta">
          ${item.fornitore ? `${ICONS.building} ${esc(item.fornitore)}` : ''}
          ${item.fornitore && item.um ? `${ICONS.dot}` : ''}
          ${item.um ? `${ICONS.package} ${esc(item.um)}` : ''}
        </div>
        <div class="result-price"><span class="currency">€</span>${fmt(item.prezzo)}</div>
      </div>
    `).join('');

    content.innerHTML = `
      <div class="results-count">${items.length} risultati trovati</div>
      <div class="results-list">${rows}</div>
    `;
  }

  // ============================================================
  // DETTAGLIO ARTICOLO
  // ============================================================
  function showDettaglio(item) {
    const content = document.getElementById('main-content');
    const p = parseFloat(item.prezzo) || 0;

    const prezzi = [
      { label: 'Prezzo Base',       valore: p,        classe: 'base',       molt: '× 1.00', icon: ICONS.star   },
      { label: 'CHN Ufficiale',     valore: p * 1.05, classe: 'chn',        molt: '× 1.05', icon: ICONS.percent },
      { label: 'Interventi Esterni',valore: p * 1.25, classe: 'interventi', molt: '× 1.25', icon: ICONS.wrench  },
      { label: 'Fabbro',            valore: p * 0.73, classe: 'fabbro',     molt: '× 0.73', icon: ICONS.key     },
      { label: 'Minimo Vendita',    valore: p * 0.68, classe: 'minimo',     molt: '× 0.68', icon: ICONS.shield  },
    ];

    const prezziHtml = prezzi.map(pr => `
      <div class="prezzo-card ${pr.classe}">
        <div class="prezzo-header">
          <div class="prezzo-icon">${pr.icon}</div>
          <div class="prezzo-label">${pr.label}</div>
        </div>
        <div class="prezzo-valore"><span class="prezzo-currency">€</span>${fmt(pr.valore)}</div>
        <div class="prezzo-molt">${pr.molt}</div>
      </div>
    `).join('');

    content.innerHTML = `
      <button class="btn-back" onclick="document.getElementById('search-input').focus(); document.getElementById('search-input').select()">
        ${ICONS.arrowL} Nuova ricerca
      </button>
      <div class="detail-card">
        <div class="article-header">
          <div class="article-code">${esc(item.art || '—')}</div>
          <div class="article-desc">${esc(item.descrizione || '—')}</div>
          <div class="article-meta">
            ${item.um        ? `<span class="meta-tag">${ICONS.package}  ${esc(item.um)}</span>`        : ''}
            ${item.fornitore ? `<span class="meta-tag">${ICONS.building} ${esc(item.fornitore)}</span>` : ''}
            ${item.categoria ? `<span class="meta-tag">${ICONS.tag}      ${esc(item.categoria)}</span>` : ''}
            ${item.ean       ? `<span class="meta-tag">${ICONS.barcode}  ${esc(item.ean)}</span>`       : ''}
          </div>
          ${item.data_aggiornamento
            ? `<div class="article-update">${ICONS.clock} Aggiornato: ${esc(item.data_aggiornamento)}</div>`
            : ''}
        </div>
        <div class="prezzi-grid">${prezziHtml}</div>
      </div>
    `;
  }

  // ============================================================
  // UTILITY
  // ============================================================
  function fmt(n) {
    const num = parseFloat(n);
    if (isNaN(num)) return '—';
    return num.toFixed(2).replace('.', ',');
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ============================================================
  // SCANNER BARCODE
  // ============================================================
  let scannerStream    = null;
  let scannerDetector  = null;
  let scannerActive    = false;
  let scannerRAF       = null;
  let currentZoom      = 1;
  let maxZoom          = 4;
  let torchOn          = false;
  let lastScanned      = null;
  let lastScannedTime  = 0;

  async function openScanner() {
    const overlay = document.getElementById('scanner-overlay');

    // Richiedi permesso fotocamera
    try {
      const constraints = {
        video: {
          facingMode: { ideal: 'environment' },
          width:  { ideal: 1920 },
          height: { ideal: 1080 },
        }
      };
      scannerStream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (e) {
      alert('Fotocamera non accessibile: ' + e.message);
      return;
    }

    const video = document.getElementById('scanner-video');
    video.srcObject = scannerStream;
    await video.play().catch(() => {});

    // Inizializza BarcodeDetector (nativo o polyfill)
    try {
      scannerDetector = new BarcodeDetector({
        formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e',
                  'code_128', 'code_39', 'code_93',
                  'qr_code', 'data_matrix', 'itf']
      });
    } catch (e) {
      alert('BarcodeDetector non disponibile: ' + e.message);
      stopStream();
      return;
    }

    // Reset stato
    currentZoom = 1;
    torchOn     = false;
    lastScanned = null;
    updateZoomLabel();
    document.getElementById('btn-flash').classList.remove('on');

    // Controlla disponibilità torch e zoom
    await checkCapabilities();

    overlay.classList.add('open');
    document.getElementById('btn-scan').classList.add('active');
    scannerActive = true;
    scanLoop();
  }

  async function checkCapabilities() {
    if (!scannerStream) return;
    const track = scannerStream.getVideoTracks()[0];
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};

    // Torch
    const flashBtn = document.getElementById('btn-flash');
    if (caps.torch) {
      flashBtn.style.display = '';
    } else {
      flashBtn.style.display = 'none';
    }

    // Zoom max
    if (caps.zoom && caps.zoom.max) {
      maxZoom = Math.min(caps.zoom.max, 6);
    }
  }

  function closeScanner() {
    scannerActive = false;
    if (scannerRAF) { cancelAnimationFrame(scannerRAF); scannerRAF = null; }
    stopStream();
    document.getElementById('scanner-overlay').classList.remove('open');
    document.getElementById('btn-scan').classList.remove('active');
    // Rimetti focus sull'input
    document.getElementById('search-input').focus();
  }

  function stopStream() {
    if (scannerStream) {
      scannerStream.getTracks().forEach(t => t.stop());
      scannerStream = null;
    }
    const video = document.getElementById('scanner-video');
    video.srcObject = null;
  }

  function scanLoop() {
    if (!scannerActive) return;
    const video = document.getElementById('scanner-video');

    if (video.readyState < 2) {
      scannerRAF = requestAnimationFrame(scanLoop);
      return;
    }

    scannerDetector.detect(video).then(barcodes => {
      if (!scannerActive) return;
      if (barcodes.length > 0) {
        const code = barcodes[0].rawValue;
        const now  = Date.now();
        // Evita rilevamenti multipli dello stesso codice entro 2s
        if (code !== lastScanned || now - lastScannedTime > 2000) {
          lastScanned     = code;
          lastScannedTime = now;
          onBarcodeDetected(code);
        }
      }
      scannerRAF = requestAnimationFrame(scanLoop);
    }).catch(() => {
      scannerRAF = requestAnimationFrame(scanLoop);
    });
  }

  function onBarcodeDetected(code) {
    // Flash visivo
    const flash = document.getElementById('scanner-flash');
    flash.classList.add('blink');
    setTimeout(() => flash.classList.remove('blink'), 150);

    // Vibrazione (Android)
    if (navigator.vibrate) navigator.vibrate(60);

    // Chiudi scanner, metti codice nell'input e avvia ricerca
    closeScanner();
    const input = document.getElementById('search-input');
    input.value = code;
    doSearch();
  }

  async function toggleFlash() {
    if (!scannerStream) return;
    const track = scannerStream.getVideoTracks()[0];
    if (!track) return;
    torchOn = !torchOn;
    try {
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      document.getElementById('btn-flash').classList.toggle('on', torchOn);
    } catch (e) {
      torchOn = !torchOn; // rollback
    }
  }

  async function changeZoom(delta) {
    if (!scannerStream) return;
    const track = scannerStream.getVideoTracks()[0];
    if (!track) return;
    const newZoom = Math.max(1, Math.min(maxZoom, currentZoom + delta));
    if (newZoom === currentZoom) return;
    try {
      await track.applyConstraints({ advanced: [{ zoom: newZoom }] });
      currentZoom = newZoom;
      updateZoomLabel();
    } catch (e) {
      // Zoom non supportato su questo dispositivo — silenzioso
    }
  }

  function updateZoomLabel() {
    document.getElementById('zoom-label').textContent = currentZoom % 1 === 0
      ? currentZoom + '×'
      : currentZoom.toFixed(1) + '×';
  }

  // Chiudi con tasto Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && scannerActive) closeScanner();
  });


  // ============================================================
  // SERVICE WORKER (PWA)
  // ============================================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.warn('SW registration failed:', err));
    });
  }
</script>
