<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Listini Prezzi</title>

  <!-- ═══ PWA META ═══════════════════════════════════════════ -->
  <link rel="manifest" href="manifest.json">

  <!-- Android: associa icona e nome per "Aggiungi a schermata Home" -->
<link rel="icon" sizes="192x192" href="icons/icon-192x192.png">
<link rel="icon" sizes="512x512" href="icons/icon-512x512.png">

  <!-- Theme color (barra del browser / status bar) -->
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS / iPadOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="#2563eb">
  <meta name="apple-mobile-web-app-title" content="Listini">

  <!-- iOS icons (Apple ignora il manifest per le icone) -->
  <link rel="apple-touch-icon" href="icons/icon-180x180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167x167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">

  <!-- Favicon desktop -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16x16.png">
  <link rel="shortcut icon" href="icons/favicon.ico">

  <!-- Windows tile -->
  <meta name="msapplication-TileColor" content="#2563eb">
  <meta name="msapplication-TileImage" content="icons/icon-144x144.png">

  <!-- SEO / sharing -->
  <meta name="description" content="Ricerca rapida listini prezzi con lettore barcode integrato">
  <!-- ═══════════════════════════════════════════════════════ -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Barcode Detection API polyfill (ZXing-WASM) — covers iOS Safari, Firefox, etc. -->
  <script src="https://fastly.jsdelivr.net/npm/barcode-detector@3/dist/iife/polyfill.min.js"></script>
  <!-- jsPDF per generazione picking list -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --accent-dark: #1d4ed8;
      --surface: #ffffff;
      --bg: #f4f6fb;
      --border: #e8ecf4;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
      --shadow-md: 0 4px 16px rgba(15,23,42,0.08), 0 2px 6px rgba(15,23,42,0.04);
      --shadow-lg: 0 12px 32px rgba(15,23,42,0.1), 0 4px 12px rgba(15,23,42,0.05);
      --radius: 14px;
      --radius-sm: 8px;
      --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { touch-action: manipulation; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .header-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .logo svg { flex-shrink: 0; }

    .search-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color var(--transition);
    }

    .search-wrap:focus-within .search-icon { color: var(--accent); }

    #search-input {
      width: 100%;
      padding: 11px 14px 11px 42px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }

    #search-input::placeholder { color: var(--text-muted); text-transform: none; }

    #search-input:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .btn-search {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      background: var(--accent);
      color: white;
      padding: 11px 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 2px 8px rgba(37,99,235,0.25);
      flex-shrink: 0;
    }

    .btn-search:hover {
      background: var(--accent-dark);
      box-shadow: 0 4px 14px rgba(37,99,235,0.35);
      transform: translateY(-1px);
    }

    .btn-search:active { transform: scale(0.97) translateY(0); }

    /* ─── CONTENT ─── */
    .content {
      max-width: 820px;
      margin: 28px auto;
      padding: 0 16px 60px;
    }

    /* ─── EMPTY STATE ─── */
    .stato-msg {
      text-align: center;
      padding: 72px 24px;
      color: var(--text-secondary);
      animation: fadeUp 0.35s ease both;
    }

    .stato-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      background: var(--accent-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .stato-msg p {
      font-size: 0.95rem;
      line-height: 1.7;
      max-width: 300px;
      margin: 0 auto;
    }

    .stato-msg strong { color: var(--text-primary); font-weight: 600; }

    .stato-msg.loading .stato-icon { animation: spin 1.2s linear infinite; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ─── RESULTS ─── */
    .results-count {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .results-list { display: flex; flex-direction: column; gap: 6px; }

    .result-item {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 15px 18px;
      cursor: pointer;
      border: 1.5px solid transparent;
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 16px;
      align-items: center;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
      animation: fadeUp 0.3s ease both;
    }

    .result-item:nth-child(1) { animation-delay: 0.03s; }
    .result-item:nth-child(2) { animation-delay: 0.06s; }
    .result-item:nth-child(3) { animation-delay: 0.09s; }
    .result-item:nth-child(4) { animation-delay: 0.12s; }
    .result-item:nth-child(5) { animation-delay: 0.15s; }
    .result-item:nth-child(n+6) { animation-delay: 0.18s; }

    .result-item:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md), 0 0 0 3px rgba(37,99,235,0.06);
      transform: translateY(-1px);
    }

    .result-art {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.03em;
    }

    .result-desc {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      grid-column: 1;
    }

    .result-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      grid-column: 1;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .result-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      grid-row: 1 / 4;
      grid-column: 2;
      text-align: right;
      align-self: center;
      font-variant-numeric: tabular-nums;
    }

    .result-price .currency {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      vertical-align: super;
      margin-right: 1px;
    }

    /* ─── DETAIL ─── */
    .btn-back {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 8px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }

    .btn-back:hover {
      background: var(--bg);
      color: var(--text-primary);
      border-color: var(--accent);
    }

    .detail-card {
      background: var(--surface);
      border-radius: 18px;
      padding: 26px;
      box-shadow: var(--shadow-md);
      animation: fadeUp 0.3s ease both;
    }

    .article-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
      margin-bottom: 22px;
    }

    .article-code {
      font-family: 'DM Mono', monospace;
      font-size: 1.05rem;
      color: var(--accent-dark);
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 12px;
      line-height: 1.3;
      word-break: break-all;
      /* etichetta leggera */
      display: inline-block;
      max-width: 100%;
      background: var(--accent-light);
      border: 1px solid rgba(37,99,235,0.25);
      border-radius: 8px;
      padding: 5px 12px;
      /* tap per copiare il codice */
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }
    .article-code:active { transform: scale(0.97); }
    .article-code.copied {
      background: #dcfce7;
      color: #166534;
      border-color: rgba(22,163,74,0.4);
    }

    .article-desc {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 14px;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .article-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meta-tag {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .meta-tag svg { color: var(--text-muted); flex-shrink: 0; }

    /* Etichetta fornitore evidenziata in blu leggero */
    .meta-tag.meta-fornitore {
      background: var(--accent-light);
      border-color: rgba(37,99,235,0.25);
      color: var(--accent-dark);
      font-weight: 500;
    }
    .meta-tag.meta-fornitore svg { color: var(--accent); }

    .article-update {
      font-size: 0.73rem;
      color: var(--text-muted);
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ─── PRICE GRID ─── */
    .prezzi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .prezzi-grid { grid-template-columns: 1fr; }
      .logo span { display: none; }
    }

    /* ─── MOBILE PORTRAIT: search row ─── */
    @media (max-width: 600px) and (orientation: portrait) {
      .header { padding: 10px 14px 0; }

      .header-inner {
        flex-wrap: wrap;
        gap: 8px;
      }

      /* Logo prima riga */
      .logo { flex: 1 0 auto; }

      /* Search-wrap: flex-wrap per mettere barcode in seconda riga */
      .search-wrap {
        flex: 1 0 100%;
        flex-wrap: wrap;
        gap: 8px;
        padding-bottom: 10px;
      }

      /* Nasconde la lente (position:absolute incompatibile col flex-wrap) */
      .search-icon { display: none; }

      /* Input + btn-search sulla stessa riga, padding normale */
      #search-input {
        flex: 1 1 0;
        min-width: 0;
        font-size: 1rem;
        padding: 13px 14px;
      }

      .btn-search {
        padding: 13px 20px;
        font-size: 0.95rem;
        flex-shrink: 0;
      }

      /* Bottone barcode: riga intera, bello grande */
      #btn-scan {
        order: 10;
        flex: 1 0 100%;
        padding: 13px 16px;
        gap: 10px;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--accent);
        border-color: var(--accent);
        background: var(--accent-light);
        border-radius: var(--radius);
        justify-content: center;
      }

      #btn-scan::after {
        content: 'Scansiona barcode';
      }
    }

    .prezzo-card {
      border-radius: var(--radius);
      position: relative;
      text-align: center;
      transition: box-shadow var(--transition);
    }

    .prezzo-card:hover { box-shadow: var(--shadow-md); }

    .prezzo-card.base { grid-column: 1 / -1; }

    /* Fronte colori */
    .prezzo-card.base .prezzo-card-front {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
    }
    .prezzo-card.base .prezzo-card-front::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; border-radius: var(--radius) var(--radius) 0 0;
      background: linear-gradient(90deg, #4f8bff, #60efff);
    }
    .prezzo-card.chn .prezzo-card-front        { background: #e0e7ff; border: 1.5px solid #a5b4fc; }
    .prezzo-card.interventi .prezzo-card-front { background: #ffedd5; border: 1.5px solid #fb923c; }
    .prezzo-card.fabbro .prezzo-card-front     { background: #dcfce7; border: 1.5px solid #86efac; }
    .prezzo-card.minimo .prezzo-card-front     { background: #fee2e2; border: 1.5px solid #fca5a5; }

    .prezzo-card.chn .prezzo-card-front::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; border-radius: var(--radius) var(--radius) 0 0;
      background: #6366f1;
    }
    .prezzo-card.interventi .prezzo-card-front::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; border-radius: var(--radius) var(--radius) 0 0;
      background: #f97316;
    }
    .prezzo-card.fabbro .prezzo-card-front::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; border-radius: var(--radius) var(--radius) 0 0;
      background: #22c55e;
    }
    .prezzo-card.minimo .prezzo-card-front::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; border-radius: var(--radius) var(--radius) 0 0;
      background: #ef4444;
    }

    .prezzo-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .prezzo-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Icons - front */
    .prezzo-card.base .prezzo-card-front .prezzo-icon        { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
    .prezzo-card.chn .prezzo-card-front .prezzo-icon         { background: #e0e7ff; color: #4338ca; }
    .prezzo-card.interventi .prezzo-card-front .prezzo-icon  { background: #ffedd5; color: #c2410c; }
    .prezzo-card.fabbro .prezzo-card-front .prezzo-icon      { background: #dcfce7; color: #166534; }
    .prezzo-card.minimo .prezzo-card-front .prezzo-icon      { background: #fee2e2; color: #b91c1c; }
    /* Icons - back */
    .prezzo-card.base .prezzo-card-back .prezzo-icon        { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8); }
    .prezzo-card.chn .prezzo-card-back .prezzo-icon         { background: #c7d2fe; color: #3730a3; }
    .prezzo-card.interventi .prezzo-card-back .prezzo-icon  { background: #fde68a; color: #92400e; }
    .prezzo-card.fabbro .prezzo-card-back .prezzo-icon      { background: #bbf7d0; color: #14532d; }
    .prezzo-card.minimo .prezzo-card-back .prezzo-icon      { background: #fecaca; color: #991b1b; }

    .prezzo-label {
      font-size: 0.73rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    /* Labels - front */
    .prezzo-card.base .prezzo-card-front .prezzo-label        { color: rgba(255,255,255,0.55); }
    .prezzo-card.chn .prezzo-card-front .prezzo-label         { color: #4338ca; }
    .prezzo-card.interventi .prezzo-card-front .prezzo-label  { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-card-front .prezzo-label      { color: #166534; }
    .prezzo-card.minimo .prezzo-card-front .prezzo-label      { color: #b91c1c; }
    /* Labels - back */
    .prezzo-card.base .prezzo-card-back .prezzo-label        { color: rgba(255,255,255,0.55); }
    .prezzo-card.chn .prezzo-card-back .prezzo-label         { color: #3730a3; }
    .prezzo-card.interventi .prezzo-card-back .prezzo-label  { color: #92400e; }
    .prezzo-card.fabbro .prezzo-card-back .prezzo-label      { color: #14532d; }
    .prezzo-card.minimo .prezzo-card-back .prezzo-label      { color: #991b1b; }

    .prezzo-valore {
      font-size: 1.9rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .prezzo-valore .prezzo-currency {
      font-size: 1rem;
      font-weight: 600;
      vertical-align: super;
      margin-right: 2px;
      opacity: 0.7;
    }

    /* Valori - front */
    .prezzo-card.base .prezzo-card-front .prezzo-valore { color: white; font-size: 2.3rem; }
    .prezzo-card.chn .prezzo-card-front .prezzo-valore        { color: #3730a3; }
    .prezzo-card.interventi .prezzo-card-front .prezzo-valore { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-card-front .prezzo-valore     { color: #166534; }
    .prezzo-card.minimo .prezzo-card-front .prezzo-valore     { color: #b91c1c; }
    /* Valori - back */
    .prezzo-card.base .prezzo-card-back .prezzo-valore { color: white; font-size: 2.3rem; }
    .prezzo-card.chn .prezzo-card-back .prezzo-valore        { color: #312e81; }
    .prezzo-card.interventi .prezzo-card-back .prezzo-valore { color: #92400e; }
    .prezzo-card.fabbro .prezzo-card-back .prezzo-valore     { color: #14532d; }
    .prezzo-card.minimo .prezzo-card-back .prezzo-valore     { color: #991b1b; }

    .prezzo-molt {
      font-size: 0.72rem;
      font-family: 'DM Mono', monospace;
      margin-top: 6px;
      opacity: 0.45;
    }

    /* ─── FLIP CARD ─── */
    .prezzo-card {
      perspective: 900px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .prezzo-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 110px;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: var(--radius);
    }

    .prezzo-card.base .prezzo-card-inner { min-height: 120px; }

    .prezzo-card.flipped .prezzo-card-inner {
      transform: rotateY(180deg);
    }

    .prezzo-card-front,
    .prezzo-card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .prezzo-card-back {
      transform: rotateY(180deg);
    }

    /* Colori retro (IVA inclusa) */
    .prezzo-card.base .prezzo-card-back        { background: linear-gradient(135deg, #1e3a5f 0%, #0f2744 100%); color: white; }
    .prezzo-card.chn .prezzo-card-back         { background: #c7d2fe; border: 1.5px solid #818cf8; }
    .prezzo-card.interventi .prezzo-card-back  { background: #fde68a; border: 1.5px solid #f59e0b; }
    .prezzo-card.fabbro .prezzo-card-back      { background: #bbf7d0; border: 1.5px solid #4ade80; }
    .prezzo-card.minimo .prezzo-card-back      { background: #fecaca; border: 1.5px solid #ef4444; }

    .prezzo-card-back .prezzo-card-back-before {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .prezzo-card.base        .prezzo-card-back-before { background: linear-gradient(90deg, #60efff, #a78bfa); }
    .prezzo-card.chn         .prezzo-card-back-before { background: #818cf8; }
    .prezzo-card.interventi  .prezzo-card-back-before { background: #f59e0b; }
    .prezzo-card.fabbro      .prezzo-card-back-before { background: #4ade80; }
    .prezzo-card.minimo      .prezzo-card-back-before { background: #f87171; }

    .iva-badge {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-radius: 4px;
      padding: 2px 7px;
      white-space: nowrap;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .prezzo-card.base .iva-badge        { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.75); }
    .prezzo-card.chn .iva-badge         { background: #c7d2fe; color: #3730a3; }
    .prezzo-card.interventi .iva-badge  { background: #fde68a; color: #92400e; }
    .prezzo-card.fabbro .iva-badge      { background: #bbf7d0; color: #14532d; }
    .prezzo-card.minimo .iva-badge      { background: #fecaca; color: #991b1b; }

    .prezzo-card-back .prezzo-header { margin-bottom: 6px; }
    .prezzo-card-back .prezzo-molt   { margin-top: 4px; }

    /* hint "tocca" visibile solo prima volta (sparisce dopo primo flip) */
    .flip-hint {
      position: absolute;
      bottom: 7px;
      right: 9px;
      font-size: 0.6rem;
      opacity: 0.35;
      font-family: 'DM Mono', monospace;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .prezzo-card.flipped .flip-hint,
    .prezzo-card.hint-done .flip-hint { opacity: 0; }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .detail-card .prezzo-card {
      animation: fadeUp 0.3s ease both;
    }
    .detail-card .prezzo-card:nth-child(1) { animation-delay: 0.05s; }
    .detail-card .prezzo-card:nth-child(2) { animation-delay: 0.1s; }
    .detail-card .prezzo-card:nth-child(3) { animation-delay: 0.15s; }
    .detail-card .prezzo-card:nth-child(4) { animation-delay: 0.2s; }
    .detail-card .prezzo-card:nth-child(5) { animation-delay: 0.25s; }

    /* ─── DETAIL TOP BAR ─── */
    .detail-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 8px;
    }

    /* tutti e tre i tasti della topbar condividono la stessa altezza e allineamento */
    .detail-topbar .btn-back,
    .detail-topbar .btn-iva-toggle,
    .detail-topbar .btn-add-picking {
      flex: 1;
      justify-content: center;
      min-width: 0;
    }

    /* mobile portrait: etichette abbreviate o icona-only per non andare a capo */
    @media (max-width: 540px) {
      .detail-topbar {
        gap: 6px;
      }
      .detail-topbar .btn-back,
      .detail-topbar .btn-iva-toggle,
      .detail-topbar .btn-add-picking {
        padding: 8px 6px;
        font-size: 0.78rem;
        gap: 4px;
      }
      /* "Nuova ricerca" → "Ricerca" */
      .btn-back-label { display: none; }
      .btn-back::after { content: 'Ricerca'; font-size: 0.78rem; }

      /* IVA: mostra solo il testo inclusa/esclusa, nasconde il dot */
      .btn-iva-toggle .toggle-dot { display: none; }

      /* Picking: nasconde testo lungo e svg, mostra "+ Picking" */
      .btn-pick-label { display: none; }
      .btn-add-picking > svg { display: none; }
      .btn-add-picking::after { content: '+ Picking'; font-size: 0.78rem; }
    }

    .btn-iva-toggle {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 8px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
      white-space: nowrap;
    }

    .btn-iva-toggle:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn-iva-toggle.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(37,99,235,0.25);
    }

    .btn-iva-toggle .toggle-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.5;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .btn-iva-toggle.active .toggle-dot { opacity: 1; }

    /* ─── SCANNER BUTTON (header) ─── */
    .btn-scan {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 10px 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    .btn-scan:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn-scan.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(37,99,235,0.3);
    }

    /* Su PC (puntatore preciso + hover) il bottone fotocamera non serve: si usa lo scanner hardware */
    @media (hover: hover) and (pointer: fine) {
      #btn-scan { display: none; }
    }

    /* ─── SCANNER OVERLAY ─── */
    #scanner-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #000;
      flex-direction: column;
    }

    #scanner-overlay.open { display: flex; }

    #scanner-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
      /* Nascosto finché il primo fotogramma non è pronto: su iPhone il video
         nasce piccolo e si allarga con uno scatto, così lo scatto non si vede. */
      opacity: 0;
      transition: opacity 0.18s ease;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    #scanner-video.ready { opacity: 1; }

    /* viewfinder frame */
    .scanner-frame {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .scanner-window {
      width: min(72vw, 300px);
      height: min(72vw, 300px);
      position: relative;
    }

    /* corner brackets */
    .scanner-window::before,
    .scanner-window::after,
    .scanner-corner-bl,
    .scanner-corner-br {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: white;
      border-style: solid;
    }

    .scanner-window::before  { top:0;    left:0;  border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .scanner-window::after   { top:0;    right:0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .scanner-corner-bl       { bottom:0; left:0;  border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .scanner-corner-br       { bottom:0; right:0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    /* scan line animation */
    .scanner-line {
      position: absolute;
      left: 6px; right: 6px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #4f8bff, #60efff, #4f8bff, transparent);
      border-radius: 2px;
      animation: scanLine 2s ease-in-out infinite;
      box-shadow: 0 0 8px rgba(96,239,255,0.8);
    }

    @keyframes scanLine {
      0%   { top: 8px;   opacity: 0.4; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: calc(100% - 10px); opacity: 0.4; }
    }

    .scanner-hint {
      color: rgba(255,255,255,0.7);
      font-size: 0.82rem;
      margin-top: 22px;
      letter-spacing: 0.02em;
      text-align: center;
    }

    /* scanner top bar */
    .scanner-topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: env(safe-area-inset-top, 0px) 16px 0;
      padding-top: max(env(safe-area-inset-top, 0px), 16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 10;
    }

    .scanner-title {
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-scanner-close {
      cursor: pointer;
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      color: white;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      transition: background var(--transition);
    }

    .btn-scanner-close:hover { background: rgba(255,255,255,0.15); }

    /* scanner bottom controls */
    .scanner-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 24px);
      padding-left: 24px; padding-right: 24px;
      padding-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
    }

    .btn-scanner-ctrl {
      cursor: pointer;
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 50px;
      background: rgba(0,0,0,0.45);
      color: white;
      padding: 10px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      backdrop-filter: blur(6px);
      transition: background var(--transition), border-color var(--transition);
      -webkit-tap-highlight-color: transparent;
    }

    .btn-scanner-ctrl:hover  { background: rgba(255,255,255,0.15); }
    .btn-scanner-ctrl.on     { background: rgba(255,220,50,0.25); border-color: rgba(255,220,50,0.6); color: #ffd700; }
    .btn-scanner-ctrl.zoom-label { min-width: 52px; justify-content: center; }

    /* detected flash */
    .scanner-flash {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s;
    }

    .scanner-flash.blink { opacity: 0.5; }

    /* ─── CARRELLO BADGE (header) ─── */
    .btn-cart {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 10px 13px;
      display: none; /* hidden until items added */
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
    }
    .btn-cart.visible { display: flex; }
    .btn-cart:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }
    .cart-badge {
      position: absolute;
      top: -6px; right: -6px;
      background: #ef4444;
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 2px solid var(--surface);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* ─── PULSANTE AGGIUNGI NELLA SCHEDA DETTAGLIO ─── */
    .btn-add-picking {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 8px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-add-picking:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }
    .btn-add-picking.added {
      background: #f0fdf4;
      color: #16a34a;
      border-color: #86efac;
    }
    .btn-add-picking.added:hover {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fca5a5;
    }

    /* ─── POPUP QUANTITÀ ─── */
    #qty-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(15,23,42,0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #qty-overlay.open { display: flex; }

    .qty-popup {
      background: var(--surface);
      border-radius: 20px;
      padding: 28px 24px 24px;
      width: 100%;
      max-width: 320px;
      box-shadow: var(--shadow-lg);
      animation: fadeUp 0.22s ease both;
      text-align: center;
    }
    .qty-popup-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .qty-popup-art {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 2px;
    }
    .qty-popup-desc {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 24px;
      line-height: 1.35;
    }
    .qty-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .qty-btn {
      cursor: pointer;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 1.4rem;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition), border-color var(--transition);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      flex-shrink: 0;
    }
    .qty-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
    .qty-btn:active { transform: scale(0.93); }
    #qty-input {
      width: 72px;
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 4px;
      background: var(--bg);
      outline: none;
      -moz-appearance: textfield;
    }
    #qty-input::-webkit-outer-spin-button,
    #qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #qty-input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .qty-popup-actions {
      display: flex;
      gap: 10px;
    }
    .btn-qty-cancel {
      flex: 1;
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background var(--transition);
    }
    .btn-qty-cancel:hover { background: var(--bg); }
    .btn-qty-confirm {
      flex: 2;
      cursor: pointer;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      padding: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 2px 8px rgba(37,99,235,0.25);
      transition: background var(--transition), box-shadow var(--transition);
    }
    .btn-qty-confirm:hover { background: var(--accent-dark); box-shadow: 0 4px 14px rgba(37,99,235,0.35); }

    /* ─── PANNELLO CARRELLO ─── */
    #cart-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(15,23,42,0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      align-items: flex-end;
      justify-content: center;
    }
    #cart-overlay.open { display: flex; }

    .cart-panel {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 820px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -8px 40px rgba(15,23,42,0.18);
      animation: slideUp 0.28s cubic-bezier(0.4,0,0.2,1) both;
      overflow: hidden;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .cart-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .cart-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cart-count-pill {
      background: var(--accent);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
    }
    .btn-cart-close {
      cursor: pointer;
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition);
    }
    .btn-cart-close:hover { background: var(--border); }

    .cart-header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-cart-clear {
      cursor: pointer;
      border: 1.5px solid #fca5a5;
      border-radius: var(--radius-sm);
      background: #fef2f2;
      color: #dc2626;
      padding: 7px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background var(--transition), border-color var(--transition), opacity var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-cart-clear:hover { background: #fee2e2; border-color: #ef4444; }
    .btn-cart-clear:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ─── CONFERMA SVUOTA LISTA ─── */
    #confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(15,23,42,0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #confirm-overlay.open { display: flex; }
    #confirm-overlay .qty-popup-title { color: #dc2626; }
    #confirm-overlay .qty-popup-desc { margin-bottom: 22px; font-weight: 500; color: var(--text-secondary); }
    .btn-qty-danger {
      flex: 1;
      cursor: pointer;
      border: none;
      border-radius: var(--radius-sm);
      background: #dc2626;
      color: white;
      padding: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(220,38,38,0.25);
      transition: background var(--transition);
    }
    .btn-qty-danger:hover { background: #b91c1c; }

    .cart-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 16px;
    }

    .cart-empty {
      text-align: center;
      padding: 40px 24px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .cart-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 10px 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.2s ease both;
    }
    .cart-row:last-child { border-bottom: none; }

    .cart-row-info { min-width: 0; }
    .cart-row-art {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .cart-row-desc {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cart-row-price {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* qty mini stepper in cart */
    .cart-qty-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .cart-qty-btn {
      cursor: pointer;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 1rem;
      font-weight: 400;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition);
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .cart-qty-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
    .cart-qty-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 22px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .btn-cart-remove {
      cursor: pointer;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1.5px solid #fca5a5;
      background: #fef2f2;
      color: #dc2626;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background var(--transition), border-color var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-cart-remove:hover { background: #fee2e2; border-color: #ef4444; }

    .cart-footer {
      padding: 16px 20px max(env(safe-area-inset-bottom, 0px), 20px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cart-footer-info {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }
    .btn-generate-pdf {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: white;
      padding: 15px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: 0 2px 8px rgba(37,99,235,0.25);
      transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-generate-pdf:hover { background: var(--accent-dark); box-shadow: 0 4px 14px rgba(37,99,235,0.35); transform: translateY(-1px); }
    .btn-generate-pdf:active { transform: scale(0.98); }
    .btn-generate-pdf:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ─── DUE PAGINE NELLA SCHEDA (Lista / Etichette) ─── */
    .cart-panel[data-page="lista"] .pg-etichette,
    .cart-panel[data-page="etichette"] .pg-lista { display: none; }

    .cart-footer-btns { display: flex; gap: 10px; }
    .cart-footer-btns .btn-generate-pdf { flex: 1 1 auto; min-width: 0; }
    .btn-footer-secondary {
      cursor: pointer;
      flex: 0 0 auto;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 15px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-footer-secondary:hover:not(:disabled) { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    .btn-footer-secondary:active:not(:disabled) { transform: scale(0.98); }
    .btn-footer-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
    /* sulla pagina Etichette le opzioni occupano tutta la scheda, senza il vecchio limite di altezza */
    .cart-panel[data-page="etichette"] .cart-out { flex: 1 1 auto; max-height: none; border-top: none; padding-top: 14px; }

    /* ─── OPZIONI OUTPUT / ETICHETTE ─── */
    .cart-out {
      flex: 0 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      max-height: 42vh;
      padding: 8px 20px 6px;
      border-top: 1px solid var(--border);
    }
    .sw-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .sw-text { min-width: 0; }
    .sw-label { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
    .sw-sub   { font-size: 0.74rem; color: var(--text-muted); margin-top: 1px; }
    .sw input { position: absolute; opacity: 0; width: 0; height: 0; }
    .sw { position: relative; flex-shrink: 0; display: inline-block; }
    .sw-track {
      display: block;
      width: 44px; height: 26px;
      border-radius: 13px;
      background: #cbd5e1;
      position: relative;
      transition: background var(--transition);
    }
    .sw-track::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15,23,42,0.25);
      transition: transform var(--transition);
    }
    .sw input:checked + .sw-track { background: var(--accent); }
    .sw input:checked + .sw-track::after { transform: translateX(18px); }
    .sw input:focus-visible + .sw-track { box-shadow: 0 0 0 3px rgba(37,99,235,0.3); }

    .lbl-opts {
      display: none;
      margin: 2px 0 6px;
      padding: 4px 14px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .lbl-opts.open { display: block; }
    .opt-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 10px 0 4px;
    }
    .seg { display: flex; flex-wrap: wrap; gap: 6px; }
    .seg-btn {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 8px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }
    .seg-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Selettore formato: rettangoli in proporzione reale con le misure dentro */
    #lbl-format { align-items: flex-end; gap: 10px; }
    .fmt-btn {
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .fmt-rect {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      border: 2px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text-secondary);
      transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
    }
    .fmt-btn:hover .fmt-rect { border-color: var(--accent); }
    .fmt-btn:focus-visible .fmt-rect { box-shadow: 0 0 0 3px rgba(37,99,235,0.3); }
    .fmt-btn.active .fmt-rect {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37,99,235,0.25);
    }
    .fmt-dim  { font-size: 0.8rem; font-weight: 700; line-height: 1.1; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .fmt-unit { font-size: 0.65rem; font-weight: 600; opacity: 0.75; }
    .opt-select {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-primary);
      padding: 10px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .opt-hint {
      display: none;
      font-size: 0.74rem;
      color: #b45309;
      margin-top: 8px;
    }

    /* ─── ANTEPRIMA ETICHETTA ─── */
    .lbl-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 6px 0 2px;
    }
    .lbl-preview svg {
      display: block;
      width: 170px;
      height: auto;
      background: #fff;
      border-radius: 2px;
      box-shadow: var(--shadow-md);
    }
    .lbl-preview-cap {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
    }

    /* mobile: scan button adjustments when cart visible */
    @media (max-width: 600px) and (orientation: portrait) {
      #btn-cart {
        order: -1;
      }
    }

    /* ─── APP LOADER ─── */
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #app-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.01em;
      animation: fadeUp 0.3s ease both;
    }
    .loader-bar-wrap {
      width: 120px;
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      animation: fadeUp 0.3s ease 0.08s both;
    }
    .loader-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 99px;
      animation: loaderFill 0.55s cubic-bezier(0.4, 0, 0.2, 1) 0.1s forwards;
    }
    @keyframes loaderFill {
      0%   { width: 0%; }
      60%  { width: 75%; }
      100% { width: 100%; }
    }

    /* ─── RICERCHE RECENTI ─── */
    .recenti-section {
      animation: fadeUp 0.35s ease 0.1s both;
    }
    .recenti-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .recenti-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-clear-recenti {
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-clear-recenti:hover {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fca5a5;
    }

  </style>
</head>
<body>

<!-- ─── APP LOADER ─── -->
<div id="app-loader">
  <div class="loader-logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14,2 14,8 20,8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10,9 9,9 8,9"/>
    </svg>
    Listini
  </div>
  <div class="loader-bar-wrap">
    <div class="loader-bar"></div>
  </div>
</div>

<div class="header">
  <div class="header-inner">
    <div class="logo" onclick="if(document.getElementById('home-state')){return;} document.getElementById('main-content').innerHTML='<div id=\'home-state\'></div>'; renderHome(); document.getElementById('search-input').value=''; document.getElementById('search-input').focus();" style="cursor:pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14,2 14,8 20,8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10,9 9,9 8,9"/>
      </svg>
      <span>Listini</span>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input"
             placeholder="Codice, EAN oppure %ricerca libera..."
             onkeydown="if(event.key==='Enter') doSearch()"
             oninput="this.value=this.value.toUpperCase()"
             autofocus autocomplete="off" autocorrect="off" spellcheck="false"
             autocapitalize="characters" style="text-transform:uppercase">
      <button class="btn-search" onclick="doSearch()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Cerca
      </button>
      <button class="btn-scan" id="btn-scan" onclick="openScanner()" title="Scansiona barcode">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
          <line x1="7" y1="8" x2="7" y2="16"/><line x1="10" y1="8" x2="10" y2="16"/>
          <line x1="13" y1="8" x2="13" y2="16"/><line x1="16" y1="8" x2="16" y2="11"/>
          <line x1="16" y1="13" x2="16" y2="16"/>
        </svg>
      </button>
      <button class="btn-cart" id="btn-cart" onclick="openCart()" title="Lista picking">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        <span class="cart-badge" id="cart-badge">0</span>
      </button>
    </div>
  </div>
</div>

<!-- ─── SCANNER OVERLAY ─── -->
<div id="scanner-overlay">
  <video id="scanner-video" playsinline muted autoplay></video>
  <div class="scanner-frame">
    <div class="scanner-window">
      <div class="scanner-line"></div>
      <div class="scanner-corner-bl"></div>
      <div class="scanner-corner-br"></div>
    </div>
    <div class="scanner-hint">Inquadra il barcode nel riquadro</div>
  </div>
  <div class="scanner-topbar">
    <div class="scanner-title">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
        <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
        <line x1="7" y1="8" x2="7" y2="16"/><line x1="10" y1="8" x2="10" y2="16"/>
        <line x1="13" y1="8" x2="13" y2="16"/><line x1="16" y1="8" x2="16" y2="11"/>
        <line x1="16" y1="13" x2="16" y2="16"/>
      </svg>
      Scanner Barcode
    </div>
    <button class="btn-scanner-close" onclick="closeScanner()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  <div class="scanner-controls">

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      Flash
    </button>
    <button class="btn-scanner-ctrl zoom-label" id="btn-zoom-out" onclick="changeZoom(-0.5)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </button>
    <span id="zoom-label" style="color:rgba(255,255,255,0.7);font-size:0.8rem;font-weight:600;min-width:36px;text-align:center;">1×</span>
    <button class="btn-scanner-ctrl zoom-label" id="btn-zoom-in" onclick="changeZoom(+0.5)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </button>
  </div>
  <div class="scanner-flash" id="scanner-flash"></div>
</div>

<!-- ─── POPUP QUANTITÀ ─── -->
<div id="qty-overlay" onclick="handleQtyOverlayClick(event)">
  <div class="qty-popup" onclick="event.stopPropagation()">
    <div class="qty-popup-title">Aggiungi alla lista picking</div>
    <div class="qty-popup-art" id="qty-art"></div>
    <div class="qty-popup-desc" id="qty-desc"></div>
    <div class="qty-controls">
      <button class="qty-btn" onclick="changeQty(-1)" aria-label="Diminuisci">−</button>
      <input type="number" id="qty-input" value="1" min="1" max="9999"
             inputmode="numeric" pattern="[0-9]*"
             onchange="clampQty()" oninput="clampQty()">
      <button class="qty-btn" onclick="changeQty(+1)" aria-label="Aumenta">+</button>
    </div>
    <div class="qty-popup-actions">
      <button class="btn-qty-cancel" onclick="closeQtyPopup()">Annulla</button>
      <button class="btn-qty-confirm" onclick="confirmAddToCart()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Aggiungi
      </button>
    </div>
  </div>
</div>

<!-- ─── PANNELLO CARRELLO ─── -->
<div id="cart-overlay" onclick="handleCartOverlayClick(event)">
  <div class="cart-panel" data-page="lista" onclick="event.stopPropagation()">
    <div class="cart-header">
      <div class="cart-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        <span class="pg-lista">Lista Picking</span>
        <span class="pg-etichette">Etichette prezzi</span>
        <span class="cart-count-pill" id="cart-count-pill">0</span>
      </div>
      <div class="cart-header-actions">
        <button class="btn-cart-clear pg-lista" id="btn-cart-clear" onclick="chiediSvuotaCarrello()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
          </svg>
          Svuota
        </button>
        <button class="btn-cart-close" onclick="closeCart()" aria-label="Chiudi">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="cart-body pg-lista" id="cart-body"></div>
    <div class="cart-out pg-etichette" id="cart-out">
      <div class="lbl-opts open" id="lbl-opts">

    try {

  function salvaRecente(item) {
    try {
      let recenti = getRecenti();
      // rimuovi duplicato per stesso art+fornitore
      recenti = recenti.filter(r => !(r.art === item.art && r.fornitore === item.fornitore));
      // inserisci in testa, taglia a MAX
      recenti = [item, ...recenti].slice(0, MAX_RECENTI);
      localStorage.setItem(RECENTI_KEY, JSON.stringify(recenti));
    } catch {}
  }

  function cancellaRecenti() {
    try { localStorage.removeItem(RECENTI_KEY); } catch {}

  // ============================================================
  // RICERCA
  // ============================================================
  async function doSearch() {
    const query = document.getElementById('search-input').value.trim();
    if (!query) return;

    const content = document.getElementById('main-content');
    content.innerHTML = `
      <div class="stato-msg loading">
        <div class="stato-icon">${ICONS.loader}</div>
        <p>Ricerca in corso…</p>
      </div>`;

    try {
      let dbQuery = supabaseClient.from('prodotti').select('*');

      if (query.startsWith('%')) {
        const term = query.slice(1);
        dbQuery = dbQuery.ilike('art', `%${term}%`);
      } else if (/^\d{8,14}$/.test(query)) {
        dbQuery = dbQuery.or(`ean.eq.${query},art.eq.${query}`);
      } else {
        dbQuery = dbQuery.eq('art', query);
      }

      const { data, error } = await dbQuery.order('fornitore').limit(100);
      if (error) throw error;

      if (!data || data.length === 0) {
        content.innerHTML = `
          <div class="stato-msg">
            <div class="stato-icon">${ICONS.empty}</div>
            <p>Nessun articolo trovato<br>per <strong>${esc(query)}</strong></p>
          </div>`;
        return;
      }

      if (data.length === 1) {
        showDettaglio(data[0]);
      } else {
        showListaRisultati(data);
      }

    } catch (e) {
      content.innerHTML = `
        <div class="stato-msg">
          <div class="stato-icon" style="background:#fef2f2;color:#ef4444">${ICONS.error}</div>
          <p>Errore: <strong>${esc(e.message)}</strong></p>
        </div>`;
    }
  }

    const rows = items.map(item => `
      <div class="result-item" onclick='showDettaglio(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
        <div class="result-art">${esc(item.art || '—')}</div>
        <div class="result-desc">${esc(item.descrizione || '—')}</div>
        <div class="result-meta">
          ${item.fornitore ? `${ICONS.building} ${esc(item.fornitore)}` : ''}
          ${item.fornitore && item.um ? `${ICONS.dot}` : ''}
          ${item.um ? `${ICONS.package} ${esc(item.um)}` : ''}

        <div class="result-price"><span class="currency">€</span>${fmt(item.prezzo)}</div>
      </div>
    `).join('');

    content.innerHTML = `
      <div class="results-count">${items.length} risultati trovati</div>
      <div class="results-list">${rows}</div>
    `;
  }

  function showDettaglio(item) {

    const prezzi = [

      { label: 'Fabbro',            valore: p * 0.73, classe: 'fabbro',     molt: '× 0.73', icon: ICONS.key     },

    const IVA = 1.22;
    const prezziHtml = prezzi.map(pr => `

    content.innerHTML = `

            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          <span class="btn-pick-label">Aggiungi a picking</span>
        </button>

          <div class="article-code" data-code="${esc(item.art || '')}" onclick="copiaCodiceArticolo(this)" title="Tocca per copiare">${esc(item.art || '—')}</div>
          <div class="article-desc">${esc(item.descrizione || '—')}</div>
          <div class="article-meta">
            ${item.fornitore ? `<span class="meta-tag meta-fornitore">${ICONS.building} ${esc(item.fornitore)}</span>` : ''}
