<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listini Prezzi</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: white;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: #4361ee;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .search-bar input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 0.95rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus { border-color: #4361ee; }

    .btn-scan {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      background: #f0f2f5;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .btn-scan:hover  { background: #e2e6ed; }
    .btn-scan:active { background: #d5dae3; }
    .btn-scan.scanning { background: #fef2f2; }

    .btn-search {
      flex-shrink: 0;
      background: #4361ee;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-search:hover  { background: #3451d1; }
    .btn-search:active { background: #2c44b8; }

    @media (max-width: 360px) { .logo { display: none; } }

    /* =============================================
       SCANNER MODAL
    ============================================= */
    .scanner-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 200;
      flex-direction: column;
    }

    .scanner-modal.active { display: flex; }

    /* Video */
    .scanner-video-wrap {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #000;
    }

    #scanner-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Mirino centrale */
    .scanner-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .scanner-target {
      width: min(75vw, 320px);
      height: min(28vw, 120px);
      position: relative;
    }

    /* Ombra intorno al mirino */
    .scanner-target::before {
      content: '';
      position: absolute;
      inset: -200vh -200vw;
      border: 200vh solid rgba(0,0,0,0.5);
      border-left-width: calc(200vw + (100vw - min(75vw,320px)) / 2);
      border-right-width: calc(200vw + (100vw - min(75vw,320px)) / 2);
      box-sizing: content-box;
    }

    /* Angolini */
    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: #4af0a0;
      border-style: solid;
    }

    .corner-tl { top: 0; left: 0;  border-width: 3px 0 0 3px; border-radius: 3px 0 0 0; }
    .corner-tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 3px 0 0; }
    .corner-bl { bottom: 0; left: 0;  border-width: 0 0 3px 3px; border-radius: 0 0 0 3px; }
    .corner-br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 3px 0; }

    /* Linea scansione */
    .scan-line {
      position: absolute;
      left: 4px; right: 4px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #4af0a0, transparent);
      border-radius: 1px;
      animation: scanLine 1.8s ease-in-out infinite;
    }

    @keyframes scanLine {
      0%   { top: 8%;  opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: 88%; opacity: 0; }
    }

    /* Flash verde al successo */
    .scanner-target.success .corner { border-color: #fff; }
    .scanner-flash {
      position: absolute;
      inset: 0;
      background: rgba(74,240,160,0.35);
      opacity: 0;
      border-radius: 4px;
      pointer-events: none;
      transition: opacity 0.1s;
    }

    .scanner-target.success .scanner-flash { opacity: 1; }

    /* Label hint */
    .scanner-hint-text {
      position: absolute;
      bottom: 18%;
      left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.75);
      font-size: 0.82rem;
      pointer-events: none;
    }

    /* TOOLBAR BASSA */
    .scanner-toolbar {
      background: rgba(0,0,0,0.85);
      padding: 16px 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    /* Zoom */
    .zoom-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .zoom-btn {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      color: white;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background 0.15s;
      user-select: none;
    }

    .zoom-btn:active { background: rgba(255,255,255,0.25); }

    .zoom-label {
      color: rgba(255,255,255,0.8);
      font-size: 0.82rem;
      min-width: 36px;
      text-align: center;
    }

    /* Chiudi */
    .btn-close-scanner {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: white;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 10px 18px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-close-scanner:active { background: rgba(255,255,255,0.25); }

    /* Flash torcia */
    .btn-flash {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .btn-flash.on  { background: rgba(255,220,0,0.3); border-color: rgba(255,220,0,0.6); }
    .btn-flash:active { background: rgba(255,255,255,0.25); }
    .btn-flash.hidden { visibility: hidden; pointer-events: none; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a2e;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      max-width: 88vw;
      text-align: center;
      z-index: 600;
      transition: transform 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    /* CONTENUTO */
    .content {
      max-width: 800px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    .stato-msg {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .stato-msg .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .stato-msg p { font-size: 0.95rem; line-height: 1.7; }
    .stato-msg strong { color: #555; }

    .loading { animation: pulse 1.2s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* LISTA RISULTATI */
    .results-count { font-size: 0.85rem; color: #888; margin-bottom: 12px; }
    .results-list  { display: flex; flex-direction: column; gap: 8px; }

    .result-item {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.15s;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 3px 14px;
    }

    .result-item:hover { border-color: #4361ee; box-shadow: 0 4px 16px rgba(67,97,238,0.15); }

    .result-art   { font-weight: 700; font-size: 0.9rem; color: #4361ee; }
    .result-desc  { font-size: 0.88rem; color: #333; grid-column: 1; }
    .result-meta  { font-size: 0.76rem; color: #888; grid-column: 1; }

    .result-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1a1a2e;
      grid-row: 1 / 4;
      grid-column: 2;
      text-align: right;
      align-self: center;
    }

    /* DETTAGLIO */
    .btn-back {
      background: #f0f2f5;
      color: #333;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-back:hover { background: #e0e4eb; }

    .detail-card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .article-header {
      border-bottom: 2px solid #f0f2f5;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .article-code {
      font-size: 0.82rem;
      color: #4361ee;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }

    .article-desc {
      font-size: 1.18rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .article-meta { display: flex; gap: 8px; flex-wrap: wrap; }

    .meta-tag {
      background: #f0f2f5;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.78rem;
      color: #555;
    }

    .article-update { font-size: 0.73rem; color: #aaa; margin-top: 8px; }

    .prezzi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    @media (max-width: 420px) { .prezzi-grid { grid-template-columns: 1fr; } }

    .prezzo-card { border-radius: 12px; padding: 14px 16px; text-align: center; }

    .prezzo-card.base       { background: #1a1a2e; grid-column: 1 / -1; }
    .prezzo-card.chn        { background: #eef2ff; border: 2px solid #c7d2fe; }
    .prezzo-card.interventi { background: #fff7ed; border: 2px solid #fed7aa; }
    .prezzo-card.fabbro     { background: #f0fdf4; border: 2px solid #bbf7d0; }
    .prezzo-card.minimo     { background: #fef2f2; border: 2px solid #fecaca; }

    .prezzo-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }

    .prezzo-card.base .prezzo-label        { color: rgba(255,255,255,0.65); }
    .prezzo-card.chn .prezzo-label         { color: #4338ca; }
    .prezzo-card.interventi .prezzo-label  { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-label      { color: #166534; }
    .prezzo-card.minimo .prezzo-label      { color: #b91c1c; }

    .prezzo-valore { font-size: 1.8rem; font-weight: 800; line-height: 1; }

    .prezzo-card.base .prezzo-valore       { color: white; font-size: 2.1rem; }
    .prezzo-card.chn .prezzo-valore        { color: #3730a3; }
    .prezzo-card.interventi .prezzo-valore { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-valore     { color: #166534; }
    .prezzo-card.minimo .prezzo-valore     { color: #b91c1c; }

    .prezzo-moltiplicatore { font-size: 0.7rem; opacity: 0.5; margin-top: 4px; }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <span class="logo">📋 Listini</span>
    <div class="search-bar">
      <input type="text" id="search-input"
             placeholder="Codice, EAN o %ricerca..."
             onkeydown="if(event.key==='Enter') doSearch()"
             autofocus autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn-scan" id="btn-scan" onclick="openScanner()" title="Scansiona barcode">📷</button>
      <button class="btn-search" onclick="doSearch()">Cerca</button>
    </div>
  </div>
</div>

<!-- SCANNER MODAL -->
<div class="scanner-modal" id="scanner-modal">
  <div class="scanner-video-wrap">
    <video id="scanner-video" autoplay playsinline muted></video>
    <div class="scanner-overlay">
      <div class="scanner-target" id="scanner-target">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        <div class="scan-line"></div>
        <div class="scanner-flash"></div>
      </div>
    </div>
    <div class="scanner-hint-text">Allinea il barcode al centro</div>
  </div>

  <div class="scanner-toolbar">
    <!-- Zoom -->
    <div class="zoom-group">
      <button class="zoom-btn" onclick="changeZoom(-0.5)">−</button>
      <span class="zoom-label" id="zoom-label">1×</span>
      <button class="zoom-btn" onclick="changeZoom(+0.5)">+</button>
    </div>

    <!-- Flash / Torcia -->
    <button class="btn-flash hidden" id="btn-flash" onclick="toggleFlash()" title="Torcia">🔦</button>

    <!-- Chiudi -->
    <button class="btn-close-scanner" onclick="closeScanner()">✕ Chiudi</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- CONTENUTO PRINCIPALE -->
<div class="content" id="main-content">
  <div class="stato-msg">
    <div class="icon">🔍</div>
    <p>Cerca per <strong>codice articolo</strong> o <strong>EAN</strong><br>
       Usa <strong>%testo</strong> per ricerca parziale<br>
       Premi 📷 per scansionare un barcode</p>
  </div>
</div>

<!-- Polyfill Barcode Detection API per browser non supportati (Firefox, Safari vecchio) -->
<script type="module">
  if (!('BarcodeDetector' in window)) {
    const { BarcodeDetector } = await import('https://cdn.jsdelivr.net/npm/@sec-ant/barcode-detector@3/dist/es/side-effects.js');
    window.BarcodeDetector = BarcodeDetector;
  }
</script>

<script>
  // ============================================================
  // CONFIGURAZIONE — sostituisci con i tuoi valori Supabase
  // ============================================================
  var SUPABASE_URL      = 'https://TUO-PROGETTO.supabase.co';  // ← sostituisci
  var SUPABASE_ANON_KEY = 'eyJ...TUA_ANON_KEY...';             // ← sostituisci

  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ============================================================
  // SCANNER — Barcode Detection API
  // ============================================================
  var videoStream   = null;
  var videoTrack    = null;
  var detector      = null;
  var scanLoop      = null;
  var currentZoom   = 1;
  var minZoom       = 1;
  var maxZoom       = 5;
  var flashOn       = false;
  var lastScan      = 0; // evita doppie letture

  async function openScanner() {
    var modal = document.getElementById('scanner-modal');
    modal.classList.add('active');
    document.getElementById('btn-scan').classList.add('scanning');

    // Aspetta che BarcodeDetector sia disponibile (polyfill async)
    var waited = 0;
    while (!window.BarcodeDetector && waited < 3000) {
      await sleep(100);
      waited += 100;
    }

    if (!window.BarcodeDetector) {
      closeScanner();
      showToast('Il tuo browser non supporta lo scanner. Aggiorna Chrome o usa un altro browser.');
      return;
    }

    try {
      // Inizializza detector
      detector = new BarcodeDetector({
        formats: [
          'ean_13', 'ean_8',
          'code_128', 'code_39',
          'upc_a', 'upc_e',
          'itf', 'codabar',
          'data_matrix', 'qr_code'
        ]
      });

      // Avvia camera posteriore
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width:  { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });

      var video = document.getElementById('scanner-video');
      video.srcObject = videoStream;
      await video.play();

      videoTrack = videoStream.getVideoTracks()[0];

      // Zoom e flash supportati?
      var caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};

      if (caps.zoom) {
        minZoom = caps.zoom.min || 1;
        maxZoom = caps.zoom.max || 5;
        currentZoom = minZoom;
        updateZoomLabel();
      }

      if (caps.torch) {
        document.getElementById('btn-flash').classList.remove('hidden');
      }

      // Avvia loop di scansione
      startScanLoop();

    } catch(e) {
      closeScanner();
      if (e.name === 'NotAllowedError') {
        showToast('Permesso fotocamera negato. Abilitalo nelle impostazioni del browser.');
      } else {
        showToast('Fotocamera non disponibile: ' + e.message);
      }
    }
  }

  function startScanLoop() {
    var video = document.getElementById('scanner-video');

    function loop() {
      if (!videoStream) return;

      detector.detect(video).then(function(barcodes) {
        if (barcodes.length > 0) {
          var now = Date.now();
          // Evita di scansionare lo stesso codice più volte in 2 secondi
          if (now - lastScan < 2000) {
            scanLoop = requestAnimationFrame(loop);
            return;
          }
          lastScan = now;

          var codice = barcodes[0].rawValue.replace(/\s+/g, '');

          // Flash visivo di conferma
          var target = document.getElementById('scanner-target');
          target.classList.add('success');
          setTimeout(function() { target.classList.remove('success'); }, 350);

          // Vibrazione
          if (navigator.vibrate) navigator.vibrate(80);

          // Inserisce e cerca
          document.getElementById('search-input').value = codice;
          closeScanner();
          setTimeout(doSearch, 200);
          return;
        }
        scanLoop = requestAnimationFrame(loop);
      }).catch(function() {
        scanLoop = requestAnimationFrame(loop);
      });
    }

    scanLoop = requestAnimationFrame(loop);
  }

  function closeScanner() {
    if (scanLoop) { cancelAnimationFrame(scanLoop); scanLoop = null; }

    if (videoStream) {
      videoStream.getTracks().forEach(function(t) { t.stop(); });
      videoStream = null;
      videoTrack  = null;
    }

    var video = document.getElementById('scanner-video');
    video.srcObject = null;

    // Reset flash
    flashOn = false;
    var fb = document.getElementById('btn-flash');
    fb.classList.remove('on');
    fb.classList.add('hidden');

    // Reset zoom
    currentZoom = 1;
    updateZoomLabel();

    document.getElementById('scanner-modal').classList.remove('active');
    document.getElementById('btn-scan').classList.remove('scanning');
    document.getElementById('btn-scan').textContent = '📷';
  }

  // ZOOM
  function changeZoom(delta) {
    if (!videoTrack) return;
    var caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    if (!caps.zoom) return;

    currentZoom = Math.min(maxZoom, Math.max(minZoom, currentZoom + delta));
    videoTrack.applyConstraints({ advanced: [{ zoom: currentZoom }] }).catch(function(){});
    updateZoomLabel();
  }

  function updateZoomLabel() {
    document.getElementById('zoom-label').textContent = currentZoom.toFixed(1) + '×';
  }

  // FLASH
  function toggleFlash() {
    if (!videoTrack) return;
    flashOn = !flashOn;
    videoTrack.applyConstraints({ advanced: [{ torch: flashOn }] }).catch(function(){
      flashOn = !flashOn;
      showToast('Torcia non disponibile su questo dispositivo.');
    });
    var fb = document.getElementById('btn-flash');
    if (flashOn) { fb.classList.add('on'); }
    else          { fb.classList.remove('on'); }
  }

  // Chiudi con ESC
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeScanner();
  });

  // ============================================================
  // RICERCA
  // ============================================================
  function doSearch() {
    var query = document.getElementById('search-input').value.trim();
    if (!query) return;

    var content = document.getElementById('main-content');
    content.innerHTML = '<div class="stato-msg loading"><div class="icon">⏳</div><p>Ricerca in corso...</p></div>';

    var dbQuery = sb.from('prodotti').select('*');

    if (query.charAt(0) === '%') {
      dbQuery = dbQuery.ilike('art', '%' + query.slice(1) + '%');
    } else if (/^\d{8,14}$/.test(query)) {
      dbQuery = dbQuery.or('ean.eq.' + query + ',art.eq.' + query);
    } else {
      dbQuery = dbQuery.eq('art', query);
    }

    dbQuery.order('fornitore').limit(100).then(function(res) {
      if (res.error) {
        content.innerHTML = '<div class="stato-msg"><div class="icon">⚠️</div><p>Errore: ' + esc(res.error.message) + '</p></div>';
        return;
      }

      var data = res.data;

      if (!data || data.length === 0) {
        content.innerHTML = '<div class="stato-msg"><div class="icon">😕</div><p>Nessun articolo trovato</p></div>';
        return;
      }

      data.length === 1 ? showDettaglio(data[0]) : showListaRisultati(data);
    });
  }

  // ============================================================
  // LISTA RISULTATI
  // ============================================================
  function showListaRisultati(items) {
    var content = document.getElementById('main-content');

    var rows = items.map(function(item) {
      return '<div class="result-item" onclick=\'showDettaglio(' + JSON.stringify(item).replace(/'/g, '&#39;') + ')\'>' +
        '<div class="result-art">'  + esc(item.art || '—') + '</div>' +
        '<div class="result-desc">' + esc(item.descrizione || '—') + '</div>' +
        '<div class="result-meta">' + esc(item.fornitore || '') + (item.um ? ' · ' + esc(item.um) : '') + '</div>' +
        '<div class="result-price">€ ' + fmt(item.prezzo) + '</div>' +
      '</div>';
    }).join('');

    content.innerHTML =
      '<div class="results-count">' + items.length + ' risultati trovati</div>' +
      '<div class="results-list">' + rows + '</div>';
  }

  // ============================================================
  // DETTAGLIO + LISTINI
  // ============================================================
  function showDettaglio(item) {
    var content = document.getElementById('main-content');
    var p = parseFloat(item.prezzo) || 0;

    var prezzi = [
      { label: 'Prezzo Base',        valore: p,        classe: 'base',       molt: '× 1.00' },
      { label: 'CHN Ufficiale',       valore: p * 1.05, classe: 'chn',        molt: '× 1.05' },
      { label: 'Interventi Esterni',  valore: p * 1.25, classe: 'interventi', molt: '× 1.25' },
      { label: 'Fabbro',              valore: p * 0.73, classe: 'fabbro',     molt: '× 0.73' },
      { label: 'Minimo Vendita',      valore: p * 0.68, classe: 'minimo',     molt: '× 0.68' },
    ];

    var prezziHtml = prezzi.map(function(pr) {
      return '<div class="prezzo-card ' + pr.classe + '">' +
        '<div class="prezzo-label">' + pr.label + '</div>' +
        '<div class="prezzo-valore">€ ' + fmt(pr.valore) + '</div>' +
        '<div class="prezzo-moltiplicatore">' + pr.molt + '</div>' +
      '</div>';
    }).join('');

    var metaHtml = '';
    if (item.um)        metaHtml += '<span class="meta-tag">📦 ' + esc(item.um) + '</span>';
    if (item.fornitore) metaHtml += '<span class="meta-tag">🏭 ' + esc(item.fornitore) + '</span>';
    if (item.categoria) metaHtml += '<span class="meta-tag">🏷️ ' + esc(item.categoria) + '</span>';
    if (item.ean)       metaHtml += '<span class="meta-tag">🔢 ' + esc(item.ean) + '</span>';

    content.innerHTML =
      '<button class="btn-back" onclick="document.getElementById(\'search-input\').focus(); document.getElementById(\'search-input\').select()">← Nuova ricerca</button>' +
      '<div class="detail-card">' +
        '<div class="article-header">' +
          '<div class="article-code">' + esc(item.art || '—') + '</div>' +
          '<div class="article-desc">' + esc(item.descrizione || '—') + '</div>' +
          '<div class="article-meta">' + metaHtml + '</div>' +
          (item.data_aggiornamento ? '<div class="article-update">Aggiornato: ' + esc(item.data_aggiornamento) + '</div>' : '') +
        '</div>' +
        '<div class="prezzi-grid">' + prezziHtml + '</div>' +
      '</div>';
  }

  // ============================================================
  // UTILITY
  // ============================================================
  function fmt(n) {
    var num = parseFloat(n);
    if (isNaN(num)) return '—';
    return num.toFixed(2).replace('.', ',');
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function sleep(ms) {
    return new Promise(function(r) { setTimeout(r, ms); });
  }

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 4000);
  }
</script>
</body>
</html>
