<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listini Prezzi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: white;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: #4361ee;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Barra di ricerca: input + bottoni sulla stessa riga */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .search-bar input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 0.95rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus { border-color: #4361ee; }

    /* Bottone fotocamera — input file nascosto sopra */
    .scan-btn-wrap {
      position: relative;
      flex-shrink: 0;
      width: 42px;
      height: 42px;
    }

    .scan-btn-wrap input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      font-size: 0; /* evita testo su iOS */
    }

    .scan-btn-icon {
      width: 42px;
      height: 42px;
      background: #f0f2f5;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      pointer-events: none;
      transition: background 0.2s;
    }

    .scan-btn-wrap:active .scan-btn-icon { background: #dde1ea; }

    .btn-search {
      flex-shrink: 0;
      background: #4361ee;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-search:hover { background: #3451d1; }

    /* Nascondi logo su schermi molto piccoli per non comprimere la barra */
    @media (max-width: 360px) {
      .logo { display: none; }
    }

    /* SPINNER SCANSIONE */
    .scan-spinner {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 500;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    .scan-spinner.active { display: flex; }

    .spinner-ring {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #4af0a0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner-text {
      color: white;
      font-size: 0.9rem;
    }

    /* CONTENUTO */
    .content {
      max-width: 800px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    .stato-msg {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .stato-msg .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .stato-msg p { font-size: 0.95rem; line-height: 1.7; }
    .stato-msg strong { color: #555; }

    .loading { animation: pulse 1.2s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* LISTA RISULTATI */
    .results-count { font-size: 0.85rem; color: #888; margin-bottom: 12px; }

    .results-list { display: flex; flex-direction: column; gap: 8px; }

    .result-item {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.15s;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 3px 14px;
    }

    .result-item:hover { border-color: #4361ee; box-shadow: 0 4px 16px rgba(67,97,238,0.15); }

    .result-art  { font-weight: 700; font-size: 0.9rem; color: #4361ee; }
    .result-desc { font-size: 0.88rem; color: #333; grid-column: 1; }
    .result-meta { font-size: 0.76rem; color: #888; grid-column: 1; }

    .result-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1a1a2e;
      grid-row: 1 / 4;
      grid-column: 2;
      text-align: right;
      align-self: center;
    }

    /* DETTAGLIO */
    .btn-back {
      background: #f0f2f5;
      color: #333;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-back:hover { background: #e0e4eb; }

    .detail-card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .article-header {
      border-bottom: 2px solid #f0f2f5;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .article-code {
      font-size: 0.82rem;
      color: #4361ee;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }

    .article-desc {
      font-size: 1.18rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .article-meta { display: flex; gap: 8px; flex-wrap: wrap; }

    .meta-tag {
      background: #f0f2f5;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.78rem;
      color: #555;
    }

    .article-update { font-size: 0.73rem; color: #aaa; margin-top: 8px; }

    /* GRIGLIA PREZZI */
    .prezzi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 420px) {
      .prezzi-grid { grid-template-columns: 1fr; }
    }

    .prezzo-card { border-radius: 12px; padding: 14px 16px; text-align: center; }

    .prezzo-card.base       { background: #1a1a2e; grid-column: 1 / -1; }
    .prezzo-card.chn        { background: #eef2ff; border: 2px solid #c7d2fe; }
    .prezzo-card.interventi { background: #fff7ed; border: 2px solid #fed7aa; }
    .prezzo-card.fabbro     { background: #f0fdf4; border: 2px solid #bbf7d0; }
    .prezzo-card.minimo     { background: #fef2f2; border: 2px solid #fecaca; }

    .prezzo-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }

    .prezzo-card.base .prezzo-label        { color: rgba(255,255,255,0.65); }
    .prezzo-card.chn .prezzo-label         { color: #4338ca; }
    .prezzo-card.interventi .prezzo-label  { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-label      { color: #166534; }
    .prezzo-card.minimo .prezzo-label      { color: #b91c1c; }

    .prezzo-valore { font-size: 1.8rem; font-weight: 800; line-height: 1; }

    .prezzo-card.base .prezzo-valore       { color: white; font-size: 2.1rem; }
    .prezzo-card.chn .prezzo-valore        { color: #3730a3; }
    .prezzo-card.interventi .prezzo-valore { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-valore     { color: #166534; }
    .prezzo-card.minimo .prezzo-valore     { color: #b91c1c; }

    .prezzo-moltiplicatore { font-size: 0.7rem; opacity: 0.5; margin-top: 4px; }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <span class="logo">📋 Listini</span>
    <div class="search-bar">
      <input type="text" id="search-input"
             placeholder="Codice, EAN o %ricerca..."
             onkeydown="if(event.key==='Enter') doSearch()"
             autofocus autocomplete="off" autocorrect="off" spellcheck="false">

      <!-- Bottone fotocamera: input file nativo, apre la fotocamera su mobile -->
      <div class="scan-btn-wrap">
        <input type="file" id="scan-input"
               accept="image/*"
               capture="environment">
        <div class="scan-btn-icon">📷</div>
      </div>

      <button class="btn-search" onclick="doSearch()">Cerca</button>
    </div>
  </div>
</div>

<!-- SPINNER durante decodifica -->
<div class="scan-spinner" id="scan-spinner">
  <div class="spinner-ring"></div>
  <div class="spinner-text">Lettura codice...</div>
</div>

<!-- CONTENUTO -->
<div class="content" id="main-content">
  <div class="stato-msg">
    <div class="icon">🔍</div>
    <p>Cerca per <strong>codice articolo</strong> o <strong>EAN</strong><br>
       Usa <strong>%testo</strong> per ricerca parziale<br>
       Premi 📷 per scansionare un barcode</p>
  </div>
</div>

<script type="module">
  import { BrowserMultiFormatReader, BarcodeFormat, DecodeHintType }
    from 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.1/+esm';

  // ============================================================
  // CONFIGURAZIONE — sostituisci con i tuoi valori Supabase
  // ============================================================
  const SUPABASE_URL     = 'https://dltokkmmgiqcearzapzf.supabase.co';  // ← sostituisci
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsdG9ra21tZ2lxY2VhcnphcHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2NzE4MjcsImV4cCI6MjA5MjI0NzgyN30.Aokl-GKXauodlJW7SgUBuYVh8l2tzJGm1rnlSFQ5djE';            // ← sostituisci

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ============================================================
  // SCANNER — decodifica foto scattata con la fotocamera nativa
  // ============================================================
  const hints = new Map();
  hints.set(DecodeHintType.POSSIBLE_FORMATS, [
    BarcodeFormat.EAN_13,
    BarcodeFormat.EAN_8,
    BarcodeFormat.CODE_128,
    BarcodeFormat.CODE_39,
    BarcodeFormat.UPC_A,
    BarcodeFormat.UPC_E,
  ]);
  hints.set(DecodeHintType.TRY_HARDER, true);

  const reader = new BrowserMultiFormatReader(hints);

  document.getElementById('scan-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    // Mostra spinner
    document.getElementById('scan-spinner').classList.add('active');

    try {
      // Crea un URL temporaneo per l'immagine scattata
      const imgUrl = URL.createObjectURL(file);
      const img = new Image();

      img.onload = async () => {
        try {
          const result = await reader.decodeFromImageElement(img);
          const codice = result.getText();
          document.getElementById('search-input').value = codice;
          doSearch();
        } catch (err) {
          alert('Codice non rilevato. Riprova avvicinando la fotocamera al codice.');
        } finally {
          URL.revokeObjectURL(imgUrl);
          document.getElementById('scan-spinner').classList.remove('active');
          // Reset input così si può scansionare di nuovo lo stesso codice
          e.target.value = '';
        }
      };

      img.onerror = () => {
        URL.revokeObjectURL(imgUrl);
        document.getElementById('scan-spinner').classList.remove('active');
        e.target.value = '';
        alert('Errore nel caricamento dell\'immagine.');
      };

      img.src = imgUrl;

    } catch (err) {
      document.getElementById('scan-spinner').classList.remove('active');
      e.target.value = '';
      alert('Errore durante la scansione.');
    }
  });

  // ============================================================
  // RICERCA
  // ============================================================
  window.doSearch = async () => {
    const query = document.getElementById('search-input').value.trim();
    if (!query) return;

    const content = document.getElementById('main-content');
    content.innerHTML = '<div class="stato-msg loading"><div class="icon">⏳</div><p>Ricerca in corso...</p></div>';

    try {
      let dbQuery = supabaseClient.from('prodotti').select('*');

      if (query.startsWith('%')) {
        const term = query.slice(1);
        dbQuery = dbQuery.ilike('art', `%${term}%`);
      } else if (/^\d{8,14}$/.test(query)) {
        dbQuery = dbQuery.or(`ean.eq.${query},art.eq.${query}`);
      } else {
        dbQuery = dbQuery.eq('art', query);
      }

      const { data, error } = await dbQuery.order('fornitore').limit(100);
      if (error) throw error;

      if (!data || data.length === 0) {
        content.innerHTML = '<div class="stato-msg"><div class="icon">😕</div><p>Nessun articolo trovato</p></div>';
        return;
      }

      data.length === 1 ? showDettaglio(data[0]) : showListaRisultati(data);

    } catch (e) {
      content.innerHTML = `<div class="stato-msg"><div class="icon">⚠️</div><p>Errore: ${e.message}</p></div>`;
    }
  };

  // ============================================================
  // LISTA RISULTATI
  // ============================================================
  window.showListaRisultati = (items) => {
    const content = document.getElementById('main-content');
    const rows = items.map(item => `
      <div class="result-item" onclick='showDettaglio(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
        <div class="result-art">${esc(item.art || '—')}</div>
        <div class="result-desc">${esc(item.descrizione || '—')}</div>
        <div class="result-meta">${esc(item.fornitore || '')}${item.um ? ' · ' + esc(item.um) : ''}</div>
        <div class="result-price">€ ${fmt(item.prezzo)}</div>
      </div>
    `).join('');

    content.innerHTML = `
      <div class="results-count">${items.length} risultati trovati</div>
      <div class="results-list">${rows}</div>
    `;
  };

  // ============================================================
  // DETTAGLIO ARTICOLO + LISTINI
  // ============================================================
  window.showDettaglio = (item) => {
    const content = document.getElementById('main-content');
    const p = parseFloat(item.prezzo) || 0;

    const prezzi = [
      { label: 'Prezzo Base',        valore: p,        classe: 'base',       molt: '× 1.00' },
      { label: 'CHN Ufficiale',       valore: p * 1.05, classe: 'chn',        molt: '× 1.05' },
      { label: 'Interventi Esterni',  valore: p * 1.25, classe: 'interventi', molt: '× 1.25' },
      { label: 'Fabbro',              valore: p * 0.73, classe: 'fabbro',     molt: '× 0.73' },
      { label: 'Minimo Vendita',      valore: p * 0.68, classe: 'minimo',     molt: '× 0.68' },
    ];

    const prezziHtml = prezzi.map(pr => `
      <div class="prezzo-card ${pr.classe}">
        <div class="prezzo-label">${pr.label}</div>
        <div class="prezzo-valore">€ ${fmt(pr.valore)}</div>
        <div class="prezzo-moltiplicatore">${pr.molt}</div>
      </div>
    `).join('');

    content.innerHTML = `
      <button class="btn-back"
        onclick="document.getElementById('search-input').focus();
                 document.getElementById('search-input').select()">
        ← Nuova ricerca
      </button>
      <div class="detail-card">
        <div class="article-header">
          <div class="article-code">${esc(item.art || '—')}</div>
          <div class="article-desc">${esc(item.descrizione || '—')}</div>
          <div class="article-meta">
            ${item.um        ? `<span class="meta-tag">📦 ${esc(item.um)}</span>`         : ''}
            ${item.fornitore ? `<span class="meta-tag">🏭 ${esc(item.fornitore)}</span>`  : ''}
            ${item.categoria ? `<span class="meta-tag">🏷️ ${esc(item.categoria)}</span>` : ''}
            ${item.ean       ? `<span class="meta-tag">🔢 ${esc(item.ean)}</span>`        : ''}
          </div>
          ${item.data_aggiornamento
            ? `<div class="article-update">Aggiornato: ${esc(item.data_aggiornamento)}</div>`
            : ''}
        </div>
        <div class="prezzi-grid">${prezziHtml}</div>
      </div>
    `;
  };

  // ============================================================
  // UTILITY
  // ============================================================
  function fmt(n) {
    const num = parseFloat(n);
    if (isNaN(num)) return '—';
    return num.toFixed(2).replace('.', ',');
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
