<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listini Prezzi</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: white;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: #4361ee;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .search-bar input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 0.95rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus { border-color: #4361ee; }

    .btn-scan {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      background: #f0f2f5;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .btn-scan:hover  { background: #e2e6ed; }
    .btn-scan:active { background: #d5dae3; }
    .btn-scan.active { background: #fee2e2; }

    .btn-search {
      flex-shrink: 0;
      background: #4361ee;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-search:hover  { background: #3451d1; }
    .btn-search:active { background: #2c44b8; }

    @media (max-width: 360px) { .logo { display: none; } }

    /* SCANNER BOX */
    #scanner-container {
      display: none;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 16px;
    }

    #scanner-container.active { display: block; }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 12px;
      background: #000;
    }

    /* Nasconde elementi superflui generati da html5-qrcode */
    #reader__dashboard_section_swaplink { display: none !important; }
    #reader__dashboard_section_fileselection { display: none !important; }
    #reader select { display: none !important; }
    #reader__status_span { display: none !important; }

    .scanner-close-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 4px;
    }

    .scanner-hint {
      font-size: 0.82rem;
      color: #888;
    }

    .btn-close-scan {
      background: #f0f2f5;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      color: #444;
      transition: background 0.15s;
    }

    .btn-close-scan:hover { background: #e0e4eb; }

    /* CONTENUTO */
    .content {
      max-width: 800px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    .stato-msg {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .stato-msg .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .stato-msg p { font-size: 0.95rem; line-height: 1.7; }
    .stato-msg strong { color: #555; }

    .loading { animation: pulse 1.2s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* LISTA RISULTATI */
    .results-count { font-size: 0.85rem; color: #888; margin-bottom: 12px; }
    .results-list  { display: flex; flex-direction: column; gap: 8px; }

    .result-item {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.15s;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 3px 14px;
    }

    .result-item:hover { border-color: #4361ee; box-shadow: 0 4px 16px rgba(67,97,238,0.15); }

    .result-art   { font-weight: 700; font-size: 0.9rem; color: #4361ee; }
    .result-desc  { font-size: 0.88rem; color: #333; grid-column: 1; }
    .result-meta  { font-size: 0.76rem; color: #888; grid-column: 1; }

    .result-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1a1a2e;
      grid-row: 1 / 4;
      grid-column: 2;
      text-align: right;
      align-self: center;
    }

    /* DETTAGLIO */
    .btn-back {
      background: #f0f2f5;
      color: #333;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-back:hover { background: #e0e4eb; }

    .detail-card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .article-header {
      border-bottom: 2px solid #f0f2f5;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .article-code {
      font-size: 0.82rem;
      color: #4361ee;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }

    .article-desc {
      font-size: 1.18rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .article-meta { display: flex; gap: 8px; flex-wrap: wrap; }

    .meta-tag {
      background: #f0f2f5;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.78rem;
      color: #555;
    }

    .article-update { font-size: 0.73rem; color: #aaa; margin-top: 8px; }

    /* GRIGLIA PREZZI */
    .prezzi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    @media (max-width: 420px) { .prezzi-grid { grid-template-columns: 1fr; } }

    .prezzo-card { border-radius: 12px; padding: 14px 16px; text-align: center; }

    .prezzo-card.base       { background: #1a1a2e; grid-column: 1 / -1; }
    .prezzo-card.chn        { background: #eef2ff; border: 2px solid #c7d2fe; }
    .prezzo-card.interventi { background: #fff7ed; border: 2px solid #fed7aa; }
    .prezzo-card.fabbro     { background: #f0fdf4; border: 2px solid #bbf7d0; }
    .prezzo-card.minimo     { background: #fef2f2; border: 2px solid #fecaca; }

    .prezzo-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }

    .prezzo-card.base .prezzo-label        { color: rgba(255,255,255,0.65); }
    .prezzo-card.chn .prezzo-label         { color: #4338ca; }
    .prezzo-card.interventi .prezzo-label  { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-label      { color: #166534; }
    .prezzo-card.minimo .prezzo-label      { color: #b91c1c; }

    .prezzo-valore { font-size: 1.8rem; font-weight: 800; line-height: 1; }

    .prezzo-card.base .prezzo-valore       { color: white; font-size: 2.1rem; }
    .prezzo-card.chn .prezzo-valore        { color: #3730a3; }
    .prezzo-card.interventi .prezzo-valore { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-valore     { color: #166534; }
    .prezzo-card.minimo .prezzo-valore     { color: #b91c1c; }

    .prezzo-moltiplicatore { font-size: 0.7rem; opacity: 0.5; margin-top: 4px; }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <span class="logo">📋 Listini</span>
    <div class="search-bar">
      <input type="text" id="search-input"
             placeholder="Codice, EAN o %ricerca..."
             onkeydown="if(event.key==='Enter') doSearch()"
             autofocus autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn-scan" id="btn-scan" onclick="toggleScanner()" title="Scansiona barcode">📷</button>
      <button class="btn-search" onclick="doSearch()">Cerca</button>
    </div>
  </div>
</div>

<!-- SCANNER (sotto header, sopra contenuto) -->
<div id="scanner-container">
  <div class="scanner-close-row">
    <span class="scanner-hint">📷 Inquadra il codice a barre</span>
    <button class="btn-close-scan" onclick="stopScanner()">✕ Chiudi</button>
  </div>
  <div id="reader"></div>
</div>

<!-- CONTENUTO PRINCIPALE -->
<div class="content" id="main-content">
  <div class="stato-msg">
    <div class="icon">🔍</div>
    <p>Cerca per <strong>codice articolo</strong> o <strong>EAN</strong><br>
       Usa <strong>%testo</strong> per ricerca parziale<br>
       Premi 📷 per scansionare un barcode</p>
  </div>
</div>

<script>
 // ============================================================
  // CONFIGURAZIONE — sostituisci con i tuoi valori Supabase
  // ============================================================
  const SUPABASE_URL     = 'https://dltokkmmgiqcearzapzf.supabase.co';  // ← sostituisci
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsdG9ra21tZ2lxY2VhcnphcHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2NzE4MjcsImV4cCI6MjA5MjI0NzgyN30.Aokl-GKXauodlJW7SgUBuYVh8l2tzJGm1rnlSFQ5djE';            // ← sostituisci

  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ============================================================
// SCANNER BARCODE — html5-qrcode (VERSIONE STABILE)
// ============================================================

let html5QrCode = null;
let scannerRunning = false;

function toggleScanner() {
  if (scannerRunning) {
    stopScanner();
  } else {
    startScanner();
  }
}

function startScanner() {
  if (scannerRunning) return; // evita doppio avvio

  const container = document.getElementById('scanner-container');
  const btn = document.getElementById('btn-scan');

  container.classList.add('active');
  btn.classList.add('active');
  btn.textContent = '✕';

  html5QrCode = new Html5Qrcode('reader');

  const cameraConfig = {
    facingMode: "environment",
    width: { ideal: 1920 },
    height: { ideal: 1080 },
    advanced: [{ zoom: 2.0 }], // utile Android
    focusMode: "continuous"
  };

  const config = {
    fps: 15,
    qrbox: { width: 300, height: 120 }, // rettangolo = meglio barcode
    aspectRatio: 1.777,

    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true
    },

    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF
    ]
  };

  html5QrCode.start(
    cameraConfig,
    config,
    (decodedText) => {
      const codice = decodedText.replace(/\s+/g, '');

      document.getElementById('search-input').value = codice;

      if (navigator.vibrate) navigator.vibrate(80);

      stopScanner();
      doSearch();
    }
  ).then(() => {
    scannerRunning = true;
  }).catch((err) => {
    console.error(err);
    stopScanner();
    alert('Impossibile accedere alla fotocamera.\nControlla i permessi del browser.');
  });
}

function stopScanner() {
  const container = document.getElementById('scanner-container');
  const btn = document.getElementById('btn-scan');

  btn.classList.remove('active');
  btn.textContent = '📷';

  if (html5QrCode && scannerRunning) {
    html5QrCode.stop()
      .then(() => {
        html5QrCode.clear();
        html5QrCode = null;
        container.classList.remove('active');
        scannerRunning = false;
      })
      .catch(() => {
        html5QrCode = null;
        container.classList.remove('active');
        scannerRunning = false;
      });
  } else {
    container.classList.remove('active');
    scannerRunning = false;
  }
}



  

  // ============================================================
  // RICERCA
  // ============================================================
  function doSearch() {
    var query = document.getElementById('search-input').value.trim();
    if (!query) return;

    var content = document.getElementById('main-content');
    content.innerHTML = '<div class="stato-msg loading"><div class="icon">⏳</div><p>Ricerca in corso...</p></div>';

    var dbQuery = sb.from('prodotti').select('*');

    if (query.charAt(0) === '%') {
      dbQuery = dbQuery.ilike('art', '%' + query.slice(1) + '%');
    } else if (/^\d{8,14}$/.test(query)) {
      dbQuery = dbQuery.or('ean.eq.' + query + ',art.eq.' + query);
    } else {
      dbQuery = dbQuery.eq('art', query);
    }

    dbQuery.order('fornitore').limit(100).then(function(res) {
      if (res.error) {
        content.innerHTML = '<div class="stato-msg"><div class="icon">⚠️</div><p>Errore: ' + esc(res.error.message) + '</p></div>';
        return;
      }

      var data = res.data;

      if (!data || data.length === 0) {
        content.innerHTML = '<div class="stato-msg"><div class="icon">😕</div><p>Nessun articolo trovato</p></div>';
        return;
      }

      if (data.length === 1) {
        showDettaglio(data[0]);
      } else {
        showListaRisultati(data);
      }
    });
  }

  // ============================================================
  // LISTA RISULTATI
  // ============================================================
  function showListaRisultati(items) {
    var content = document.getElementById('main-content');

    var rows = items.map(function(item) {
      return '<div class="result-item" onclick=\'showDettaglio(' + JSON.stringify(item).replace(/'/g, '&#39;') + ')\'>' +
        '<div class="result-art">'  + esc(item.art || '—') + '</div>' +
        '<div class="result-desc">' + esc(item.descrizione || '—') + '</div>' +
        '<div class="result-meta">' + esc(item.fornitore || '') + (item.um ? ' · ' + esc(item.um) : '') + '</div>' +
        '<div class="result-price">€ ' + fmt(item.prezzo) + '</div>' +
      '</div>';
    }).join('');

    content.innerHTML =
      '<div class="results-count">' + items.length + ' risultati trovati</div>' +
      '<div class="results-list">' + rows + '</div>';
  }

  // ============================================================
  // DETTAGLIO ARTICOLO + LISTINI
  // ============================================================
  function showDettaglio(item) {
    var content = document.getElementById('main-content');
    var p = parseFloat(item.prezzo) || 0;

    var prezzi = [
      { label: 'Prezzo Base',        valore: p,        classe: 'base',       molt: '× 1.00' },
      { label: 'CHN Ufficiale',       valore: p * 1.05, classe: 'chn',        molt: '× 1.05' },
      { label: 'Interventi Esterni',  valore: p * 1.25, classe: 'interventi', molt: '× 1.25' },
      { label: 'Fabbro',              valore: p * 0.73, classe: 'fabbro',     molt: '× 0.73' },
      { label: 'Minimo Vendita',      valore: p * 0.68, classe: 'minimo',     molt: '× 0.68' },
    ];

    var prezziHtml = prezzi.map(function(pr) {
      return '<div class="prezzo-card ' + pr.classe + '">' +
        '<div class="prezzo-label">' + pr.label + '</div>' +
        '<div class="prezzo-valore">€ ' + fmt(pr.valore) + '</div>' +
        '<div class="prezzo-moltiplicatore">' + pr.molt + '</div>' +
      '</div>';
    }).join('');

    var metaHtml = '';
    if (item.um)        metaHtml += '<span class="meta-tag">📦 ' + esc(item.um) + '</span>';
    if (item.fornitore) metaHtml += '<span class="meta-tag">🏭 ' + esc(item.fornitore) + '</span>';
    if (item.categoria) metaHtml += '<span class="meta-tag">🏷️ ' + esc(item.categoria) + '</span>';
    if (item.ean)       metaHtml += '<span class="meta-tag">🔢 ' + esc(item.ean) + '</span>';

    content.innerHTML =
      '<button class="btn-back" onclick="document.getElementById(\'search-input\').focus(); document.getElementById(\'search-input\').select()">← Nuova ricerca</button>' +
      '<div class="detail-card">' +
        '<div class="article-header">' +
          '<div class="article-code">' + esc(item.art || '—') + '</div>' +
          '<div class="article-desc">' + esc(item.descrizione || '—') + '</div>' +
          '<div class="article-meta">' + metaHtml + '</div>' +
          (item.data_aggiornamento ? '<div class="article-update">Aggiornato: ' + esc(item.data_aggiornamento) + '</div>' : '') +
        '</div>' +
        '<div class="prezzi-grid">' + prezziHtml + '</div>' +
      '</div>';
  }

  // ============================================================
  // UTILITY
  // ============================================================
  function fmt(n) {
    var num = parseFloat(n);
    if (isNaN(num)) return '—';
    return num.toFixed(2).replace('.', ',');
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
