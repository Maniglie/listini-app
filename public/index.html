  // ============================================================
  // COPIA CODICE ARTICOLO
  // ============================================================
  function copiaCodiceArticolo(el) {
    const code = el.dataset.code;
    if (!code) return;

    const feedback = () => {
      if (el._copyTimer) return;
      const orig = el.innerHTML;
      el.style.minWidth = el.offsetWidth + 'px';   // evita che la cella cambi larghezza
      el.classList.add('copied');
      el.textContent = '✓ Copiato';
      el._copyTimer = setTimeout(() => {
        el.classList.remove('copied');
        el.innerHTML = orig;
        el.style.minWidth = '';
        el._copyTimer = null;
      }, 1200);
    };

    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, code.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (ok) feedback();
    };

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(code).then(feedback).catch(fallback);
    } else {
      fallback();
    }
  }

  // ============================================================
  // UTILITY
  // ============================================================
  function fmt(n) {
    const num = parseFloat(n);
    if (isNaN(num)) return '—';
    return num.toFixed(2).replace('.', ',');
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ============================================================
  // SCANNER BARCODE
  // ============================================================
  let scannerStream    = null;
  let scannerDetector  = null;
  let scannerActive    = false;
  let scannerRAF       = null;
  let currentZoom      = 1;
  let maxZoom          = 4;
  let torchOn          = false;
  let lastScanned      = null;
  let lastScannedTime  = 0;

  let scannerOpening = false;

  // Ricrea l'elemento <video> da zero: su iOS/WebKit un video già usato può
  // restare con dimensioni/layer vecchi e ricomparire rimpicciolito.
  function resetVideoElement() {
    const old = document.getElementById('scanner-video');
    const v = document.createElement('video');
    v.id = 'scanner-video';
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');
    v.muted = true;
    v.autoplay = true;
    if (old) {
      try { old.pause(); old.srcObject = null; old.removeAttribute('src'); old.load(); } catch (e) {}
      old.replaceWith(v);
    }
    return v;
  }

  async function openScanner() {
    if (scannerOpening || scannerActive) return;   // evita doppio tap / doppia apertura
    scannerOpening = true;
    const overlay = document.getElementById('scanner-overlay');

    // Toglie il focus dall'input (chiude la tastiera) e riporta la pagina in posizione
    const ae = document.activeElement;
    if (ae && ae !== document.body && ae.blur) ae.blur();

    // Richiedi permesso fotocamera
    try {
      const constraints = {
        video: {
          facingMode: { ideal: 'environment' },
          width:  { ideal: 1920 },
          height: { ideal: 1080 },
        }
      };
      scannerStream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (e) {
      scannerOpening = false;
      alert('Fotocamera non accessibile: ' + e.message);
      return;
    }

    // Mostra l'overlay a tutto schermo PRIMA di collegare il video,
    // così il video viene dimensionato quando è già visibile.
    overlay.classList.add('open');
    document.getElementById('btn-scan').classList.add('active');
    void overlay.offsetHeight;   // forza il layout

    const video = resetVideoElement();
    video.srcObject = scannerStream;
    await video.play().catch(() => {});

    // Mostra il video solo quando ha già il primo fotogramma e il layout si è assestato
    let rivelato = false;
    const rivela = () => {
      if (rivelato || !video.isConnected) return;
      rivelato = true;
      void video.offsetHeight;
      requestAnimationFrame(() => requestAnimationFrame(() => video.classList.add('ready')));
    };
    if ('requestVideoFrameCallback' in video) {
      video.requestVideoFrameCallback(() => setTimeout(rivela, 80));
    } else {
      video.addEventListener('playing', () => setTimeout(rivela, 150), { once: true });
    }
    setTimeout(rivela, 900);   // sicurezza: lo mostra comunque

    // Inizializza BarcodeDetector (nativo o polyfill)
    try {
      scannerDetector = new BarcodeDetector({
        formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e',
                  'code_128', 'code_39', 'code_93',
                  'qr_code', 'data_matrix', 'itf']
      });
    } catch (e) {
      alert('BarcodeDetector non disponibile: ' + e.message);
      scannerOpening = false;
      closeScanner();
      return;
    }

    // Reset stato
    currentZoom = 1;
    torchOn     = false;
    lastScanned = null;
    updateZoomLabel();
    document.getElementById('btn-flash').classList.remove('on');

    // Controlla disponibilità torch e zoom
    await checkCapabilities();

    scannerActive = true;
    scannerOpening = false;
    scanLoop();
  }

  async function checkCapabilities() {
    if (!scannerStream) return;
    const track = scannerStream.getVideoTracks()[0];
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};

    // Torch
    const flashBtn = document.getElementById('btn-flash');
    if (caps.torch) {
      flashBtn.style.display = '';
    } else {
      flashBtn.style.display = 'none';
    }

    // Zoom max
    if (caps.zoom && caps.zoom.max) {
      maxZoom = Math.min(caps.zoom.max, 6);
    }
  }

  function closeScanner() {
    scannerActive = false;
    scannerOpening = false;
    if (scannerRAF) { cancelAnimationFrame(scannerRAF); scannerRAF = null; }
    stopStream();
    document.getElementById('scanner-overlay').classList.remove('open');
    document.getElementById('btn-scan').classList.remove('active');
    // Focus sull'input solo su PC: su telefono aprirebbe la tastiera e
    // sposterebbe la pagina, rovinando la riapertura a tutto schermo dello scanner.
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      document.getElementById('search-input').focus();
    }
  }

  function stopStream() {
    if (scannerStream) {
      scannerStream.getTracks().forEach(t => t.stop());
      scannerStream = null;
    }
    const video = document.getElementById('scanner-video');
    if (video) {
      try { video.pause(); } catch (e) {}
      video.srcObject = null;
      video.removeAttribute('src');
      try { video.load(); } catch (e) {}
    }
  }

  function scanLoop() {
    if (!scannerActive) return;
    const video = document.getElementById('scanner-video');

    if (video.readyState < 2) {
      scannerRAF = requestAnimationFrame(scanLoop);
      return;
    }

    scannerDetector.detect(video).then(barcodes => {
      if (!scannerActive) return;
      if (barcodes.length > 0) {
        const code = barcodes[0].rawValue;
        const now  = Date.now();
        // Evita rilevamenti multipli dello stesso codice entro 2s
        if (code !== lastScanned || now - lastScannedTime > 2000) {
          lastScanned     = code;
          lastScannedTime = now;
          onBarcodeDetected(code);
        }
      }
      scannerRAF = requestAnimationFrame(scanLoop);
    }).catch(() => {
      scannerRAF = requestAnimationFrame(scanLoop);
    });
  }

  function onBarcodeDetected(code) {
    // Flash visivo
    const flash = document.getElementById('scanner-flash');
    flash.classList.add('blink');
    setTimeout(() => flash.classList.remove('blink'), 150);

    // Vibrazione (Android)
    if (navigator.vibrate) navigator.vibrate(60);

    // Chiudi scanner, metti codice nell'input e avvia ricerca
    closeScanner();
    const input = document.getElementById('search-input');
    input.value = code;
    doSearch();
  }

  async function toggleFlash() {
    if (!scannerStream) return;
    const track = scannerStream.getVideoTracks()[0];
    if (!track) return;
    torchOn = !torchOn;
    try {
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      document.getElementById('btn-flash').classList.toggle('on', torchOn);
    } catch (e) {
      torchOn = !torchOn; // rollback
    }
  }

  async function changeZoom(delta) {
    if (!scannerStream) return;
    const track = scannerStream.getVideoTracks()[0];
    if (!track) return;
    const newZoom = Math.max(1, Math.min(maxZoom, currentZoom + delta));
    if (newZoom === currentZoom) return;
    try {
      await track.applyConstraints({ advanced: [{ zoom: newZoom }] });
      currentZoom = newZoom;
      updateZoomLabel();
    } catch (e) {
      // Zoom non supportato su questo dispositivo — silenzioso
    }
  }

  function updateZoomLabel() {
    document.getElementById('zoom-label').textContent = currentZoom % 1 === 0
      ? currentZoom + '×'
      : currentZoom.toFixed(1) + '×';
  }

  // Chiudi con tasto Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && scannerActive) closeScanner();
  });


  // ============================================================
  // TOGGLE GLOBALE IVA
  // ============================================================
  let ivaGlobaleAttiva = false;

  function toggleTutteIva() {
    ivaGlobaleAttiva = !ivaGlobaleAttiva;
    const cards = document.querySelectorAll('.prezzo-card');
    cards.forEach(card => {
      if (ivaGlobaleAttiva) {
        card.classList.add('flipped', 'hint-done');
      } else {
        card.classList.remove('flipped');
      }
    });
    const btn = document.getElementById('btn-iva-toggle');
    if (btn) {
      btn.classList.toggle('active', ivaGlobaleAttiva);
      btn.innerHTML = ivaGlobaleAttiva
        ? '<span class="toggle-dot"></span><span class="btn-iva-label"> IVA inclusa</span>'
        : '<span class="toggle-dot"></span><span class="btn-iva-label"> IVA esclusa</span>';
    }
  }

  // ============================================================
  // SERVICE WORKER (PWA)
  // ============================================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.warn('SW registration failed:', err));
    });
  }

  // ============================================================
  // PICKING LIST — CARRELLO (solo in memoria, nessuna persistenza)
  // ============================================================
  // Persistenza locale: la lista resta salvata nel browser finché non viene svuotata
  const CARRELLO_KEY = 'listini_picking_v1';

  function caricaCarrello() {
    try {
      const raw = JSON.parse(localStorage.getItem(CARRELLO_KEY) || '[]');
      if (!Array.isArray(raw)) return [];
      return raw
        .filter(r => r && typeof r.art === 'string' && r.art)
        .map(r => ({
          art:         r.art,
          descrizione: String(r.descrizione || ''),
          um:          String(r.um || ''),
          ean:         String(r.ean || ''),
          fornitore:   String(r.fornitore || ''),
          prezzoBase:  parseFloat(r.prezzoBase) || 0,
          qty:         Math.min(9999, Math.max(1, parseInt(r.qty, 10) || 1)),
        }));
    } catch (e) { return []; }
  }

  function salvaCarrello() {
    try {
      if (carrello.length === 0) localStorage.removeItem(CARRELLO_KEY);
      else localStorage.setItem(CARRELLO_KEY, JSON.stringify(carrello));
    } catch (e) { /* storage pieno o non disponibile: la lista resta comunque in memoria */ }
  }

  let carrello = caricaCarrello(); // { art, descrizione, um, fornitore, prezzoBase, qty }
  let pendingItem = null;    // articolo in attesa di conferma quantità
  let currentDetailItem = null; // articolo attualmente visualizzato nel dettaglio

  // Helper: apre il popup per l'articolo corrente nel dettaglio
  function openQtyPopupCurrent() {
    if (currentDetailItem) openQtyPopup(currentDetailItem);
  }

  // ── Aggiorna badge nell'header ──────────────────────────────
  function aggiornaCartBadge() {
    const totQty = carrello.reduce((s, r) => s + r.qty, 0);
    const badge  = document.getElementById('cart-badge');
    const btn    = document.getElementById('btn-cart');
    if (badge) badge.textContent = totQty;
    if (btn)  btn.classList.toggle('visible', carrello.length > 0);
  }

  // ── Apri popup quantità ─────────────────────────────────────
  function openQtyPopup(item) {
    pendingItem = item;
    const inCart = carrello.find(r => r.art === item.art);

    document.getElementById('qty-art').textContent  = item.art || '';
    document.getElementById('qty-desc').textContent = item.descrizione || '';

    const inp = document.getElementById('qty-input');
    inp.value = inCart ? inCart.qty : 1;

    document.getElementById('qty-overlay').classList.add('open');
    // focus con delay per evitare problemi su iOS Safari
    setTimeout(() => { try { inp.focus(); inp.select(); } catch(e) {} }, 120);
  }

  function closeQtyPopup() {
    document.getElementById('qty-overlay').classList.remove('open');
    pendingItem = null;
  }

  function handleQtyOverlayClick(e) {
    if (e.target === document.getElementById('qty-overlay')) closeQtyPopup();
  }

  function changeQty(delta) {
    const inp = document.getElementById('qty-input');
    const v = parseInt(inp.value, 10) || 1;
    inp.value = Math.max(1, v + delta);
  }

  function clampQty() {
    const inp = document.getElementById('qty-input');
    let v = parseInt(inp.value, 10);
    if (isNaN(v) || v < 1) v = 1;
    if (v > 9999) v = 9999;
    inp.value = v;
  }

  function confirmAddToCart() {
    if (!pendingItem) return;
    clampQty();
    const qty = parseInt(document.getElementById('qty-input').value, 10) || 1;
    const art = pendingItem.art;

    const esistente = carrello.find(r => r.art === art);
    if (esistente) {
      esistente.qty = qty;
    } else {
      carrello.push({
        art:        pendingItem.art        || '',
        descrizione:pendingItem.descrizione|| '',
        um:         pendingItem.um         || '',
        ean:        pendingItem.ean        || '',
        fornitore:  pendingItem.fornitore  || '',
        prezzoBase: parseFloat(pendingItem.prezzo) || 0,
        qty:        qty,
      });
    }

    salvaCarrello();
    closeQtyPopup();
    aggiornaCartBadge();
    aggiornaBottoneDettaglio(art);
  }

  // ── Aggiorna il bottone nella scheda dettaglio ──────────────
  function aggiornaBottoneDettaglio(art) {
    const btn = document.getElementById('btn-add-picking-detail');
    if (!btn) return;
    const inCart = carrello.find(r => r.art === art);
    if (inCart) {
      btn.classList.add('added');
      btn.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span class="btn-pick-label">In lista (${inCart.qty} pz) — modifica</span>`;
    } else {
      btn.classList.remove('added');
      btn.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        <span class="btn-pick-label">Aggiungi a picking</span>`;
    }
  }

  // ── Pannello carrello ────────────────────────────────────────
  // La scheda ha due pagine: 'lista' (articoli) ed 'etichette' (impostazioni + anteprima)
  let cartPage = 'lista';

  function vaiPaginaCarrello(pagina) {
    if (pagina === 'etichette' && carrello.length === 0) return;
    cartPage = pagina;
    const panel = document.querySelector('.cart-panel');
    if (panel) panel.dataset.page = pagina;
    ['cart-body', 'cart-out'].forEach(id => { const el = document.getElementById(id); if (el) el.scrollTop = 0; });
    if (pagina === 'etichette') aggiornaOutputUI();      // disegna l'anteprima
  }

  function openCart() {
    vaiPaginaCarrello('lista');
    renderCart();
    document.getElementById('cart-overlay').classList.add('open');
  }

  function closeCart() {
    document.getElementById('cart-overlay').classList.remove('open');
  }

  function handleCartOverlayClick(e) {
    if (e.target === document.getElementById('cart-overlay')) closeCart();
  }

  function renderCart() {
    const body = document.getElementById('cart-body');
    const pill = document.getElementById('cart-count-pill');
    const info = document.getElementById('cart-footer-info');
    const pdfBtn = document.getElementById('btn-generate-pdf');

    if (pill) pill.textContent = carrello.length;
    const clrBtn = document.getElementById('btn-cart-clear');
    if (clrBtn) clrBtn.disabled = carrello.length === 0;

    if (carrello.length === 0) {
      body.innerHTML = '<div class="cart-empty">Nessun articolo nella lista</div>';
      if (info) info.textContent = '';
      if (pdfBtn) pdfBtn.disabled = true;
      aggiornaOutputUI();
      return;
    }

    if (pdfBtn) pdfBtn.disabled = false;

    const totRighe = carrello.length;
    const totPz    = carrello.reduce((s, r) => s + r.qty, 0);
    if (info) info.textContent = `${totRighe} articol${totRighe === 1 ? 'o' : 'i'} · ${totPz} pz totali`;

    body.innerHTML = carrello.map((r, i) => {
      const prezzoVendita = r.prezzoBase.toFixed(2).replace('.', ',');
      return `
        <div class="cart-row" id="cart-row-${i}">
          <div class="cart-row-info">
            <div class="cart-row-art">${esc(r.art)}</div>
            <div class="cart-row-desc">${esc(r.descrizione)}</div>
            <div class="cart-row-price">€ ${prezzoVendita}</div>
          </div>
          <div class="cart-qty-wrap">
            <button class="cart-qty-btn" onclick="cartChangeQty(${i}, -1)" aria-label="Diminuisci">−</button>
            <span class="cart-qty-val" id="cart-qty-val-${i}">${r.qty}</span>
            <button class="cart-qty-btn" onclick="cartChangeQty(${i}, +1)" aria-label="Aumenta">+</button>
          </div>
          <button class="btn-cart-remove" onclick="cartRemove(${i})" aria-label="Rimuovi">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>`;
    }).join('');
    aggiornaOutputUI();
  }

  function cartChangeQty(i, delta) {
    if (!carrello[i]) return;
    carrello[i].qty = Math.max(1, carrello[i].qty + delta);
    salvaCarrello();
    const el = document.getElementById(`cart-qty-val-${i}`);
    if (el) el.textContent = carrello[i].qty;
    // aggiorna footer info
    const totRighe = carrello.length;
    const totPz    = carrello.reduce((s, r) => s + r.qty, 0);
    const info = document.getElementById('cart-footer-info');
    if (info) info.textContent = `${totRighe} articol${totRighe === 1 ? 'o' : 'i'} · ${totPz} pz totali`;
    aggiornaCartBadge();
    // aggiorna bottone nella scheda se visibile
    aggiornaBottoneDettaglio(carrello[i].art);
  }

  function cartRemove(i) {
    if (!carrello[i]) return;
    const art = carrello[i].art;
    carrello.splice(i, 1);
    salvaCarrello();
    renderCart();
    aggiornaCartBadge();
    aggiornaBottoneDettaglio(art);
  }

  // ── Svuota tutta la lista (con conferma) ────────────────────
  function chiediSvuotaCarrello() {
    if (carrello.length === 0) return;
    const n  = carrello.length;
    const pz = carrello.reduce((s, r) => s + r.qty, 0);
    document.getElementById('confirm-text').textContent =
      `Verranno eliminati ${n} articol${n === 1 ? 'o' : 'i'} (${pz} pz) dalla lista. L'operazione non si può annullare.`;
    document.getElementById('confirm-overlay').classList.add('open');
  }

  function chiudiConfermaSvuota() {
    document.getElementById('confirm-overlay').classList.remove('open');
  }

  function svuotaCarrello() {
    carrello = [];
    salvaCarrello();
    chiudiConfermaSvuota();
    renderCart();
    aggiornaCartBadge();
    aggiornaBottoneDettaglio(currentDetailItem ? currentDetailItem.art : '');
  }

  // ── Tasto ESC chiude i pannelli ─────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.getElementById('confirm-overlay').classList.contains('open')) {
        chiudiConfermaSvuota();
      } else if (document.getElementById('qty-overlay').classList.contains('open')) {
        closeQtyPopup();
      } else if (document.getElementById('cart-overlay').classList.contains('open')) {
        closeCart();
      } else if (scannerActive) {
        closeScanner();
      }
    }
  });

  // ── Generazione PDF ─────────────────────────────────────────
  function creaPickingDoc() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

    const oggi = new Date();
    const dataStr = oggi.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const oraStr  = oggi.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

    // Header
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.setTextColor(37, 99, 235);
    doc.text('PICKING LIST', 14, 20);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(100, 116, 139);
    doc.text(`Generata il ${dataStr} alle ${oraStr}`, 14, 27);

    // Linea separatrice
    doc.setDrawColor(232, 236, 244);
    doc.setLineWidth(0.5);
    doc.line(14, 31, 196, 31);

    // Tabella
    const head = [['Articolo', 'Descrizione', 'UM', 'PZ', 'Prezzo']];
    const body = carrello.map(r => [
      r.art,
      r.descrizione,
      r.um || '—',
      String(r.qty),
      '€ ' + r.prezzoBase.toFixed(2).replace('.', ','),
    ]);

    doc.autoTable({
      head: head,
      body: body,
      startY: 35,
      styles: {
        font: 'helvetica',
        fontSize: 9,
        cellPadding: 4,
        textColor: [15, 23, 42],
        lineColor: [232, 236, 244],
        lineWidth: 0.3,
      },
      headStyles: {
        fillColor: [37, 99, 235],
        textColor: [255, 255, 255],
        fontStyle: 'bold',
        fontSize: 8.5,
      },
      alternateRowStyles: {
        fillColor: [244, 246, 251],
      },
      columnStyles: {
        0: { cellWidth: 30, font: 'courier', fontSize: 8 },
        1: { cellWidth: 'auto' },
        2: { cellWidth: 14, halign: 'center' },
        3: { cellWidth: 14, halign: 'center', fontStyle: 'bold' },
        4: { cellWidth: 32, halign: 'right', fontStyle: 'bold' },
      },
      margin: { left: 14, right: 14 },
    });

    // Totali a piè di tabella
    const finalY = doc.lastAutoTable.finalY + 6;
    const totPz  = carrello.reduce((s, r) => s + r.qty, 0);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.setTextColor(15, 23, 42);
    doc.text(`Totale articoli: ${carrello.length}   |   Totale pezzi: ${totPz}`, 14, finalY);

    // Footer pagina
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.5);
    doc.setTextColor(148, 163, 184);
    doc.text('Listini Prezzi — documento generato automaticamente', 14, 287);

    return { doc, nome: `picking-list-${dataStr.replace(/\//g, '-')}.pdf` };
  }

  // ============================================================
  // ETICHETTE PREZZI — fogli A4 da ritagliare
  // ============================================================

  // Formati disponibili (mm). Per aggiungerne uno basta una riga.
  // w = larghezza, h = altezza: il testo corre sempre lungo w.
  //   27×34 → etichetta in verticale, si scrive sul lato corto
  //   60×40 → etichetta in orizzontale, si scrive sul lato lungo
  // Testi, barcode e margini si adattano da soli alla dimensione (vedi "k" in disegnaEtichetta).
  const FORMATI_ETICHETTA = [
    { id: '27x34', label: '27 × 34 mm', w: 27, h: 34 },
    { id: '60x40', label: '60 × 40 mm', w: 60, h: 40 },
  ];
  const SCALA_FORMATO = 2.5;   // px per mm dei rettangoli nel selettore (proporzioni reali)
  let formatoEtichettaId = FORMATI_ETICHETTA[0].id;

  const IVA_ETICHETTE = 1.22;
  const LISTINI_ETICHETTE = [
    { id: 'base',       label: 'Prezzo Base',        molt: 1.00 },
    { id: 'chn',        label: 'CHN Ufficiale',      molt: 1.05 },
    { id: 'interventi', label: 'Interventi Esterni', molt: 1.25 },
    { id: 'fabbro',     label: 'Fabbro',             molt: 0.73 },
    { id: 'minimo',     label: 'Minimo Vendita',     molt: 0.68 },
  ];

  // ── Barcode EAN-13 / EAN-8 / UPC-A (disegnato in vettoriale) ──
  const EAN_L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
  const EAN_G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
  const EAN_R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
  const EAN_PAR = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

  function eanCheckOk(d) {
    let sum = 0;
    for (let i = d.length - 2, w = 3; i >= 0; i--, w = 4 - w) sum += parseInt(d[i], 10) * w;
    return ((10 - (sum % 10)) % 10) === parseInt(d[d.length - 1], 10);
  }

  // Restituisce { bits, testo } oppure null se il codice non è un EAN valido
  function eanModuli(codice) {
    let d = String(codice || '').replace(/\D/g, '');
    if (d.length === 12) d = '0' + d;                 // UPC-A → EAN-13
    if (d.length !== 13 && d.length !== 8) return null;
    if (!eanCheckOk(d)) return null;

    if (d.length === 13) {
      const par = EAN_PAR[parseInt(d[0], 10)];
      let bits = '101';
      for (let i = 0; i < 6; i++) {
        const n = parseInt(d[i + 1], 10);
        bits += par[i] === 'L' ? EAN_L[n] : EAN_G[n];
      }
      bits += '01010';
      for (let i = 7; i < 13; i++) bits += EAN_R[parseInt(d[i], 10)];
      bits += '101';
      return { bits, testo: d[0] + ' ' + d.slice(1, 7) + ' ' + d.slice(7) };
    }
    let bits = '101';
    for (let i = 0; i < 4; i++) bits += EAN_L[parseInt(d[i], 10)];
    bits += '01010';
    for (let i = 4; i < 8; i++) bits += EAN_R[parseInt(d[i], 10)];
    bits += '101';
    return { bits, testo: d.slice(0, 4) + ' ' + d.slice(4) };
  }

  // ── Pannello opzioni (interruttori) ─────────────────────────
  function initOpzioniEtichette() {
    const seg = document.getElementById('lbl-format');
    if (seg) {
      // un rettangolo per formato, in scala reale, con le misure scritte dentro
      seg.innerHTML = FORMATI_ETICHETTA.map(f => {
        const att = f.id === formatoEtichettaId;
        return `<button type="button" class="fmt-btn${att ? ' active' : ''}" data-id="${f.id}" aria-pressed="${att}" aria-label="Formato ${f.label}" onclick="scegliFormatoEtichetta('${f.id}')">` +
          `<span class="fmt-rect" style="width:${f.w * SCALA_FORMATO}px;height:${f.h * SCALA_FORMATO}px">` +
          `<span class="fmt-dim">${f.w} × ${f.h}</span><span class="fmt-unit">mm</span></span></button>`;
      }).join('');
    }
    const sel = document.getElementById('lbl-listino');
    if (sel) sel.innerHTML = LISTINI_ETICHETTE.map(l => `<option value="${l.id}">${l.label}</option>`).join('');
  }

  function scegliFormatoEtichetta(id) {
    formatoEtichettaId = id;
    document.querySelectorAll('#lbl-format .fmt-btn').forEach(b => {
      const att = b.dataset.id === id;
      b.classList.toggle('active', att);
      b.setAttribute('aria-pressed', att);
    });
    aggiornaOutputUI();
  }

  // Legge gli interruttori del pannello (usato sia dal PDF sia dall'anteprima)
  function opzioniEtichette() {
    return {
      nome:        document.getElementById('sw-lbl-name').checked,
      descrizione: document.getElementById('sw-lbl-desc').checked,
      barcode:     document.getElementById('sw-lbl-barcode').checked,
      iva:         document.getElementById('sw-lbl-iva').checked,
      arrotonda:   document.getElementById('sw-lbl-round').checked,
      listino:     document.getElementById('lbl-listino').value,
    };
  }

  function aggiornaOutputUI() {
    // senza articoli non si può generare nulla né aprire la pagina etichette
    const vuoto = carrello.length === 0;
    ['btn-generate-pdf', 'btn-go-etichette', 'btn-generate-labels'].forEach(id => {
      const b = document.getElementById(id);
      if (b) b.disabled = vuoto;
    });
    if (vuoto && cartPage === 'etichette') vaiPaginaCarrello('lista');

    // avviso articoli senza EAN valido
    const hint = document.getElementById('lbl-hint');
    const bc = document.getElementById('sw-lbl-barcode');
    if (hint) {
      const senza = (bc && bc.checked) ? carrello.filter(r => !eanModuli(r.ean)).length : 0;
      hint.textContent = senza > 0
        ? `${senza} articol${senza === 1 ? 'o' : 'i'} senza EAN valido: l'etichetta uscirà senza codice a barre.`
        : '';
      hint.style.display = senza > 0 ? 'block' : 'none';
    }

    aggiornaAnteprimaEtichetta();
  }

  // Arrotonda per eccesso al mezzo euro (10,68 → 11,00 · 10,43 → 10,50 · 10,50 resta 10,50).
  // Lavora sui centesimi interi per evitare errori di virgola mobile.
  function arrotondaEccesso50(v) {
    const cent = Math.round(v * 100);
    return (Math.ceil(cent / 50) * 50) / 100;
  }

  // ── Disegno di una singola etichetta ────────────────────────
  function disegnaEtichetta(doc, x, y, w, h, r, o) {
    const MM = 0.3528;                    // 1 pt in mm
    // Fattore di scala rispetto al formato di riferimento 27×34 mm (k = 1 → misure originali):
    // testi, barcode e margini crescono con l'etichetta, limitati dal lato che "stringe" di più.
    const k   = Math.min(w / 27, h / 34);
    const pad = 1.4 * k;
    const iw  = w - 2 * pad;
    const cx  = x + w / 2;
    let top    = y + pad;
    let bottom = y + h - pad;

    doc.setTextColor(15, 23, 42);

    // 1) Codice a barre in fondo
    if (o.barcode) {
      const bc = eanModuli(r.ean);
      if (bc) {
        const n    = bc.bits.length;
        const modW = Math.min(0.33 * k, (w - 2.0 * k) / n);
        const bw   = modW * n;
        const bx   = cx - bw / 2;
        const bh   = 7.0 * k;

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(5 * k);
        doc.text(bc.testo, cx, bottom, { align: 'center' });

        const barBottom = bottom - 1.9 * k;
        const barTop    = barBottom - bh;
        doc.setFillColor(0, 0, 0);
        let i = 0;
        while (i < n) {
          if (bc.bits[i] === '1') {
            let j = i;
            while (j < n && bc.bits[j] === '1') j++;
            doc.rect(bx + i * modW, barTop, (j - i) * modW, bh, 'F');
            i = j;
          } else i++;
        }
        bottom = barTop - 1.2 * k;
      } else {
        bottom -= 9.5 * k;                // mantiene la posizione del prezzo uniforme
      }
    }

    // 2) Prezzo (con didascalia IVA)
    const l = LISTINI_ETICHETTE.find(x => x.id === o.listino) || LISTINI_ETICHETTE[0];
    let valore = r.prezzoBase * l.molt * (o.iva ? IVA_ETICHETTE : 1);
    if (o.arrotonda) valore = arrotondaEccesso50(valore);
    const testoPrezzo = '€ ' + fmt(valore);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(4.5 * k);
    doc.setTextColor(100, 116, 139);
    doc.text(o.iva ? 'IVA inclusa' : 'IVA esclusa', cx, bottom, { align: 'center' });
    bottom -= 2.4 * k;

    doc.setFont('helvetica', 'bold');
    let fs = 17 * k;
    doc.setFontSize(fs);
    while (fs > 8 * k && doc.getTextWidth(testoPrezzo) > iw) { fs -= 0.5; doc.setFontSize(fs); }
    doc.setTextColor(15, 23, 42);
    doc.text(testoPrezzo, cx, bottom, { align: 'center' });
    bottom -= fs * MM * 0.72 + 1.2 * k;

    // 3) Nome (codice articolo) in alto
    if (o.nome && r.art) {
      doc.setFont('helvetica', 'bold');
      let s = 8.5 * k;
      doc.setFontSize(s);
      while (s > 5 * k && doc.getTextWidth(r.art) > iw) { s -= 0.5; doc.setFontSize(s); }
      let t = r.art;
      if (doc.getTextWidth(t) > iw) {
        while (t.length > 1 && doc.getTextWidth(t + '…') > iw) t = t.slice(0, -1);
        t += '…';
      }
      const cap = s * MM * 0.72;
      doc.text(t, cx, top + cap, { align: 'center' });
      top += cap + 1.3 * k;
    }

    // 4) Descrizione nello spazio rimasto
    if (o.descrizione && r.descrizione) {
      const fsD = 6 * k, lh = 2.5 * k;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(fsD);
      doc.setTextColor(51, 65, 85);
      const maxRighe = Math.floor((bottom - top) / lh);
      if (maxRighe >= 1) {
        let righe = doc.splitTextToSize(String(r.descrizione), iw);
        if (righe.length > maxRighe) {
          righe = righe.slice(0, maxRighe);
          let ult = righe[maxRighe - 1];
          while (ult.length > 1 && doc.getTextWidth(ult + '…') > iw) ult = ult.slice(0, -1);
          righe[maxRighe - 1] = ult.replace(/\s+$/, '') + '…';
        }
        righe.forEach((riga, k) => {
          doc.text(riga, cx, top + fsD * MM * 0.72 + k * lh, { align: 'center' });
        });
      }
    }
  }

  // ── Anteprima live ──────────────────────────────────────────
  // Riusa disegnaEtichetta(): un piccolo "registratore" con la stessa interfaccia di jsPDF
  // raccoglie testi e barre e li trasforma in SVG, così l'anteprima coincide con il PDF.
  function anteprimaEtichettaSvg(r, fmtE, o) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [fmtE.w, fmtE.h] }); // solo per misurare i testi
    const MMPT = 0.3528;                                  // 1 pt in mm
    const st = { bold: false, size: 10, color: 'rgb(0,0,0)', fill: 'rgb(0,0,0)' };
    const n3 = v => (+v).toFixed(3);
    let body = '';

    const rec = {
      setTextColor(a, b, c) { doc.setTextColor(a, b, c); st.color = `rgb(${a},${b},${c})`; },
      setFillColor(a, b, c) { st.fill = `rgb(${a},${b},${c})`; },
      setFont(f, style)     { doc.setFont(f, style); st.bold = style === 'bold'; },
      setFontSize(s)        { doc.setFontSize(s); st.size = s; },
      getTextWidth(t)       { return doc.getTextWidth(t); },
      splitTextToSize(t, w) { return doc.splitTextToSize(t, w); },
      rect(x, y, w, h) {
        body += `<rect x="${n3(x)}" y="${n3(y)}" width="${n3(w)}" height="${n3(h)}" fill="${st.fill}"/>`;
      },
      text(t, x, y) {
        body += `<text x="${n3(x)}" y="${n3(y)}" font-size="${n3(st.size * MMPT)}" fill="${st.color}" text-anchor="middle"` +
                `${st.bold ? ' font-weight="bold"' : ''}>${esc(t)}</text>`;
      },
    };
    disegnaEtichetta(rec, 0, 0, fmtE.w, fmtE.h, r, o);

    const wpx = Math.min(280, Math.round(fmtE.w * 6.3));   // larghezza a schermo (27 mm → 170 px)
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${fmtE.w} ${fmtE.h}" style="width:${wpx}px" role="img" aria-label="Anteprima etichetta">` +
           `<rect x="0.08" y="0.08" width="${n3(fmtE.w - 0.16)}" height="${n3(fmtE.h - 0.16)}" fill="#fff" stroke="#969696" stroke-width="0.15" stroke-dasharray="1 1"/>` +
           `<g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" shape-rendering="geometricPrecision">${body}</g></svg>`;
  }

  function aggiornaAnteprimaEtichetta() {
    const box = document.getElementById('lbl-preview');
    if (!box || cartPage !== 'etichette') return;      // si disegna solo quando la pagina Etichette è aperta

    if (carrello.length === 0) {
      box.innerHTML = '<div class="lbl-preview-cap">Aggiungi un articolo alla lista per vedere l\'anteprima</div>';
      return;
    }
    try {
      const r = carrello[0];
      const fmtE = FORMATI_ETICHETTA.find(f => f.id === formatoEtichettaId) || FORMATI_ETICHETTA[0];
      box.innerHTML = anteprimaEtichettaSvg(r, fmtE, opzioniEtichette()) +
        `<div class="lbl-preview-cap">Esempio: ${esc(r.art)} · primo articolo della lista</div>`;
    } catch (e) {
      console.warn('Anteprima etichetta non disponibile:', e);
      box.innerHTML = '';
    }
  }

  // ── Documento etichette ─────────────────────────────────────
  function creaEtichetteDoc() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

    const fmtE = FORMATI_ETICHETTA.find(f => f.id === formatoEtichettaId) || FORMATI_ETICHETTA[0];
    const o = opzioniEtichette();

    const PAGE_W = 210, PAGE_H = 297, MARG = 5;
    const cols = Math.max(1, Math.floor((PAGE_W - 2 * MARG) / fmtE.w));
    const rows = Math.max(1, Math.floor((PAGE_H - 2 * MARG) / fmtE.h));
    const perPag = cols * rows;
    const x0 = (PAGE_W - cols * fmtE.w) / 2;
    const y0 = (PAGE_H - rows * fmtE.h) / 2;

    // una etichetta per articolo
    const items = carrello.slice();
    const nPag = Math.ceil(items.length / perPag);

    for (let p = 0; p < nPag; p++) {
      if (p > 0) doc.addPage();
      const quanti = Math.min(perPag, items.length - p * perPag);
      const righeUsate = Math.ceil(quanti / cols);

      // linee tratteggiate di taglio (celle attaccate)
      doc.setDrawColor(150, 150, 150);
      doc.setLineWidth(0.15);
      doc.setLineDashPattern([1, 1], 0);
      for (let c = 0; c <= cols; c++) {
        const xx = x0 + c * fmtE.w;
        doc.line(xx, y0, xx, y0 + righeUsate * fmtE.h);
      }
      for (let rr = 0; rr <= righeUsate; rr++) {
        const yy = y0 + rr * fmtE.h;
        doc.line(x0, yy, x0 + cols * fmtE.w, yy);
      }
      doc.setLineDashPattern([], 0);

      for (let k = 0; k < quanti; k++) {
        const col = k % cols, riga = Math.floor(k / cols);
        disegnaEtichetta(doc, x0 + col * fmtE.w, y0 + riga * fmtE.h, fmtE.w, fmtE.h, items[p * perPag + k], o);
      }
    }

    const dataStr = new Date().toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '-');
    return { doc, nome: `etichette-prezzi-${dataStr}.pdf` };
  }

  // ── Generazione PDF: un PDF per tocco ───────────────────────
  // Ogni pulsante scarica un solo file, direttamente nel gestore del tocco: i browser
  // (soprattutto da telefono) bloccano i download multipli o ritardati.
  // La lista NON viene svuotata: si può generare picking ed etichette di seguito e poi usare "Svuota".
  function generaPDF(creaDoc, btnId) {
    if (carrello.length === 0) return;
    try {
      const f = creaDoc();
      f.doc.save(f.nome);
    } catch (err) {
      console.error(err);
      alert('Errore nella generazione del PDF: ' + err.message);
      return;
    }
    // conferma visiva sul pulsante premuto
    const btn = document.getElementById(btnId);
    const lab = btn && btn.querySelector('.btn-gen-label');
    if (lab && !btn._fb) {
      const orig = lab.textContent;
      lab.textContent = '✓ PDF generato';
      btn._fb = setTimeout(() => { lab.textContent = orig; btn._fb = null; }, 1600);
    }
  }

  function generaPickingPDF()   { generaPDF(creaPickingDoc,   'btn-generate-pdf');    }
  function generaEtichettePDF() { generaPDF(creaEtichetteDoc, 'btn-generate-labels'); }

  initOpzioniEtichette();
  aggiornaCartBadge(); // mostra subito il carrello salvato in locale
</script>
</body>
