<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listini Prezzi</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: white;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: #4361ee;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .search-bar input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 0.95rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus { border-color: #4361ee; }

    /* Bottone fotocamera — input file invisibile sopra */
    .scan-btn-wrap {
      position: relative;
      flex-shrink: 0;
      width: 42px;
      height: 42px;
    }

    .scan-btn-wrap input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      font-size: 0;
      /* capture=environment = fotocamera posteriore nativa */
    }

    .scan-btn-icon {
      width: 42px;
      height: 42px;
      background: #f0f2f5;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      pointer-events: none;
      transition: background 0.15s;
    }

    .scan-btn-wrap:active .scan-btn-icon { background: #dde1ea; }

    .btn-search {
      flex-shrink: 0;
      background: #4361ee;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-search:hover  { background: #3451d1; }
    .btn-search:active { background: #2c44b8; }

    @media (max-width: 360px) { .logo { display: none; } }

    /* OVERLAY DECODIFICA */
    .decode-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 500;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .decode-overlay.active { display: flex; }

    .spinner-ring {
      width: 54px;
      height: 54px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #4af0a0;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .decode-text { color: white; font-size: 0.92rem; }

    /* TOAST notifica errore */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a2e;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      max-width: 88vw;
      text-align: center;
      z-index: 600;
      transition: transform 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    /* CONTENUTO */
    .content {
      max-width: 800px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    .stato-msg {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .stato-msg .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .stato-msg p { font-size: 0.95rem; line-height: 1.7; }
    .stato-msg strong { color: #555; }

    .loading { animation: pulse 1.2s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* LISTA RISULTATI */
    .results-count { font-size: 0.85rem; color: #888; margin-bottom: 12px; }
    .results-list  { display: flex; flex-direction: column; gap: 8px; }

    .result-item {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.15s;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 3px 14px;
    }

    .result-item:hover { border-color: #4361ee; box-shadow: 0 4px 16px rgba(67,97,238,0.15); }

    .result-art   { font-weight: 700; font-size: 0.9rem; color: #4361ee; }
    .result-desc  { font-size: 0.88rem; color: #333; grid-column: 1; }
    .result-meta  { font-size: 0.76rem; color: #888; grid-column: 1; }

    .result-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1a1a2e;
      grid-row: 1 / 4;
      grid-column: 2;
      text-align: right;
      align-self: center;
    }

    /* DETTAGLIO */
    .btn-back {
      background: #f0f2f5;
      color: #333;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-back:hover { background: #e0e4eb; }

    .detail-card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .article-header {
      border-bottom: 2px solid #f0f2f5;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .article-code {
      font-size: 0.82rem;
      color: #4361ee;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }

    .article-desc {
      font-size: 1.18rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .article-meta { display: flex; gap: 8px; flex-wrap: wrap; }

    .meta-tag {
      background: #f0f2f5;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.78rem;
      color: #555;
    }

    .article-update { font-size: 0.73rem; color: #aaa; margin-top: 8px; }

    /* GRIGLIA PREZZI */
    .prezzi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    @media (max-width: 420px) { .prezzi-grid { grid-template-columns: 1fr; } }

    .prezzo-card { border-radius: 12px; padding: 14px 16px; text-align: center; }

    .prezzo-card.base       { background: #1a1a2e; grid-column: 1 / -1; }
    .prezzo-card.chn        { background: #eef2ff; border: 2px solid #c7d2fe; }
    .prezzo-card.interventi { background: #fff7ed; border: 2px solid #fed7aa; }
    .prezzo-card.fabbro     { background: #f0fdf4; border: 2px solid #bbf7d0; }
    .prezzo-card.minimo     { background: #fef2f2; border: 2px solid #fecaca; }

    .prezzo-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }

    .prezzo-card.base .prezzo-label        { color: rgba(255,255,255,0.65); }
    .prezzo-card.chn .prezzo-label         { color: #4338ca; }
    .prezzo-card.interventi .prezzo-label  { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-label      { color: #166534; }
    .prezzo-card.minimo .prezzo-label      { color: #b91c1c; }

    .prezzo-valore { font-size: 1.8rem; font-weight: 800; line-height: 1; }

    .prezzo-card.base .prezzo-valore       { color: white; font-size: 2.1rem; }
    .prezzo-card.chn .prezzo-valore        { color: #3730a3; }
    .prezzo-card.interventi .prezzo-valore { color: #c2410c; }
    .prezzo-card.fabbro .prezzo-valore     { color: #166534; }
    .prezzo-card.minimo .prezzo-valore     { color: #b91c1c; }

    .prezzo-moltiplicatore { font-size: 0.7rem; opacity: 0.5; margin-top: 4px; }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <span class="logo">📋 Listini</span>
    <div class="search-bar">
      <input type="text" id="search-input"
             placeholder="Codice, EAN o %ricerca..."
             onkeydown="if(event.key==='Enter') doSearch()"
             autofocus autocomplete="off" autocorrect="off" spellcheck="false">

      <!-- Apre fotocamera nativa ad alta risoluzione -->
      <div class="scan-btn-wrap" title="Scatta foto del barcode">
        <input type="file" id="scan-input"
               accept="image/*"
               capture="environment">
        <div class="scan-btn-icon">📷</div>
      </div>

      <button class="btn-search" onclick="doSearch()">Cerca</button>
    </div>
  </div>
</div>

<!-- OVERLAY SPINNER durante decodifica -->
<div class="decode-overlay" id="decode-overlay">
  <div class="spinner-ring"></div>
  <div class="decode-text">Lettura codice in corso...</div>
</div>

<!-- TOAST errore -->
<div class="toast" id="toast"></div>

<!-- CONTENUTO PRINCIPALE -->
<div class="content" id="main-content">
  <div class="stato-msg">
    <div class="icon">🔍</div>
    <p>Cerca per <strong>codice articolo</strong> o <strong>EAN</strong><br>
       Usa <strong>%testo</strong> per ricerca parziale<br>
       Premi 📷, scatta la foto del barcode e attendi</p>
  </div>
</div>

<script>
  // ============================================================
  // CONFIGURAZIONE — sostituisci con i tuoi valori Supabase
  // ============================================================
  var SUPABASE_URL      = 'https://TUO-PROGETTO.supabase.co';  // ← sostituisci
  var SUPABASE_ANON_KEY = 'eyJ...TUA_ANON_KEY...';             // ← sostituisci

  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ============================================================
  // SCANNER — foto ad alta risoluzione + ZXing
  // ============================================================
  document.getElementById('scan-input').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;

    showOverlay(true);

    var url = URL.createObjectURL(file);
    var img = new Image();

    img.onload = function() {
      // Prova a decodificare con rotazioni e scale diverse
      // per massimizzare le possibilità di lettura
      var codice = tryDecode(img);

      URL.revokeObjectURL(url);
      e.target.value = '';
      showOverlay(false);

      if (codice) {
        document.getElementById('search-input').value = codice;
        if (navigator.vibrate) navigator.vibrate(80);
        doSearch();
      } else {
        showToast('❌ Codice non rilevato. Assicurati che il barcode sia ben illuminato e a fuoco, poi riprova.');
      }
    };

    img.onerror = function() {
      URL.revokeObjectURL(url);
      e.target.value = '';
      showOverlay(false);
      showToast('Errore nel caricamento dell\'immagine.');
    };

    img.src = url;
  });

  // Prova a decodificare l'immagine con più strategie
  function tryDecode(img) {
    var formats = [
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.CODABAR,
    ];

    // Prova con scale diverse (utile per barcode piccoli o foto molto grandi)
    var scales = [1.0, 0.75, 0.5, 1.5];
    // Prova anche ruotando (utile se la foto è girata)
    var rotations = [0, 90, 180, 270];

    for (var s = 0; s < scales.length; s++) {
      for (var r = 0; r < rotations.length; r++) {
        try {
          var result = decodeWithTransform(img, formats, scales[s], rotations[r]);
          if (result) return result;
        } catch(ex) {
          // continua a provare
        }
      }
    }
    return null;
  }

  function decodeWithTransform(img, formats, scale, rotation) {
    var canvas = document.createElement('canvas');
    var ctx    = canvas.getContext('2d');

    var w = Math.round(img.naturalWidth  * scale);
    var h = Math.round(img.naturalHeight * scale);

    // Dimensioni canvas in base alla rotazione
    if (rotation === 90 || rotation === 270) {
      canvas.width  = h;
      canvas.height = w;
    } else {
      canvas.width  = w;
      canvas.height = h;
    }

    ctx.save();
    if (rotation !== 0) {
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(rotation * Math.PI / 180);
      ctx.translate(-w / 2, -h / 2);
    }
    ctx.drawImage(img, 0, 0, w, h);
    ctx.restore();

    var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    var reader    = new ZXing.MultiFormatReader();
    reader.setHints(hints);

    var lumSource = new ZXing.RGBLuminanceSource(
      imageData.data, canvas.width, canvas.height
    );
    var bitmap = new ZXing.BinaryBitmap(
      new ZXing.HybridBinarizer(lumSource)
    );

    var result = reader.decode(bitmap);
    return result ? result.getText().replace(/\s+/g, '') : null;
  }

  // ============================================================
  // UI HELPERS
  // ============================================================
  function showOverlay(show) {
    var el = document.getElementById('decode-overlay');
    if (show) { el.classList.add('active'); }
    else       { el.classList.remove('active'); }
  }

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 4000);
  }

  // ============================================================
  // RICERCA
  // ============================================================
  function doSearch() {
    var query = document.getElementById('search-input').value.trim();
    if (!query) return;

    var content = document.getElementById('main-content');
    content.innerHTML = '<div class="stato-msg loading"><div class="icon">⏳</div><p>Ricerca in corso...</p></div>';

    var dbQuery = sb.from('prodotti').select('*');

    if (query.charAt(0) === '%') {
      dbQuery = dbQuery.ilike('art', '%' + query.slice(1) + '%');
    } else if (/^\d{8,14}$/.test(query)) {
      dbQuery = dbQuery.or('ean.eq.' + query + ',art.eq.' + query);
    } else {
      dbQuery = dbQuery.eq('art', query);
    }

    dbQuery.order('fornitore').limit(100).then(function(res) {
      if (res.error) {
        content.innerHTML = '<div class="stato-msg"><div class="icon">⚠️</div><p>Errore: ' + esc(res.error.message) + '</p></div>';
        return;
      }

      var data = res.data;

      if (!data || data.length === 0) {
        content.innerHTML = '<div class="stato-msg"><div class="icon">😕</div><p>Nessun articolo trovato</p></div>';
        return;
      }

      if (data.length === 1) {
        showDettaglio(data[0]);
      } else {
        showListaRisultati(data);
      }
    });
  }

  // ============================================================
  // LISTA RISULTATI
  // ============================================================
  function showListaRisultati(items) {
    var content = document.getElementById('main-content');

    var rows = items.map(function(item) {
      return '<div class="result-item" onclick=\'showDettaglio(' + JSON.stringify(item).replace(/'/g, '&#39;') + ')\'>' +
        '<div class="result-art">'  + esc(item.art || '—') + '</div>' +
        '<div class="result-desc">' + esc(item.descrizione || '—') + '</div>' +
        '<div class="result-meta">' + esc(item.fornitore || '') + (item.um ? ' · ' + esc(item.um) : '') + '</div>' +
        '<div class="result-price">€ ' + fmt(item.prezzo) + '</div>' +
      '</div>';
    }).join('');

    content.innerHTML =
      '<div class="results-count">' + items.length + ' risultati trovati</div>' +
      '<div class="results-list">' + rows + '</div>';
  }

  // ============================================================
  // DETTAGLIO ARTICOLO + LISTINI
  // ============================================================
  function showDettaglio(item) {
    var content = document.getElementById('main-content');
    var p = parseFloat(item.prezzo) || 0;

    var prezzi = [
      { label: 'Prezzo Base',        valore: p,        classe: 'base',       molt: '× 1.00' },
      { label: 'CHN Ufficiale',       valore: p * 1.05, classe: 'chn',        molt: '× 1.05' },
      { label: 'Interventi Esterni',  valore: p * 1.25, classe: 'interventi', molt: '× 1.25' },
      { label: 'Fabbro',              valore: p * 0.73, classe: 'fabbro',     molt: '× 0.73' },
      { label: 'Minimo Vendita',      valore: p * 0.68, classe: 'minimo',     molt: '× 0.68' },
    ];

    var prezziHtml = prezzi.map(function(pr) {
      return '<div class="prezzo-card ' + pr.classe + '">' +
        '<div class="prezzo-label">' + pr.label + '</div>' +
        '<div class="prezzo-valore">€ ' + fmt(pr.valore) + '</div>' +
        '<div class="prezzo-moltiplicatore">' + pr.molt + '</div>' +
      '</div>';
    }).join('');

    var metaHtml = '';
    if (item.um)        metaHtml += '<span class="meta-tag">📦 ' + esc(item.um) + '</span>';
    if (item.fornitore) metaHtml += '<span class="meta-tag">🏭 ' + esc(item.fornitore) + '</span>';
    if (item.categoria) metaHtml += '<span class="meta-tag">🏷️ ' + esc(item.categoria) + '</span>';
    if (item.ean)       metaHtml += '<span class="meta-tag">🔢 ' + esc(item.ean) + '</span>';

    content.innerHTML =
      '<button class="btn-back" onclick="document.getElementById(\'search-input\').focus(); document.getElementById(\'search-input\').select()">← Nuova ricerca</button>' +
      '<div class="detail-card">' +
        '<div class="article-header">' +
          '<div class="article-code">' + esc(item.art || '—') + '</div>' +
          '<div class="article-desc">' + esc(item.descrizione || '—') + '</div>' +
          '<div class="article-meta">' + metaHtml + '</div>' +
          (item.data_aggiornamento ? '<div class="article-update">Aggiornato: ' + esc(item.data_aggiornamento) + '</div>' : '') +
        '</div>' +
        '<div class="prezzi-grid">' + prezziHtml + '</div>' +
      '</div>';
  }

  // ============================================================
  // UTILITY
  // ============================================================
  function fmt(n) {
    var num = parseFloat(n);
    if (isNaN(num)) return '—';
    return num.toFixed(2).replace('.', ',');
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
